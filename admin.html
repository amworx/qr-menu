<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QR Menu — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
      --text:#f8fafc;--text2:#94a3b8;--text3:#64748b;
      --accent:#f59e0b;--accent2:#d97706;
      --success:#22c55e;--danger:#ef4444;--info:#3b82f6;
      --line:#334155;--radius:10px;
      --header-h:70px;
    }
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    a{color:var(--accent);text-decoration:none}
    button{cursor:pointer;font-family:inherit}
    input,select,textarea{font-family:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:14px;width:100%}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
    textarea{resize:vertical;min-height:60px}
    label{font-size:12px;color:var(--text2);margin-bottom:4px;display:block;font-weight:500}

    /* Auth */
    #auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .auth-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:40px;width:100%;max-width:400px}
    .auth-card h1{font-size:20px;margin-bottom:4px}
    .auth-card p{color:var(--text2);font-size:13px;margin-bottom:24px}
    .auth-card .login-btn{width:100%;margin-top:12px;padding:12px;background:var(--accent);color:#000;border:none;border-radius:6px;font-weight:600;font-size:14px}
    .auth-card .login-btn:disabled{opacity:.5}
    .auth-card .error{color:var(--danger);font-size:13px;margin-top:8px}

    /* Dashboard */
    #dashboard{display:none;min-height:100vh}
    .dash-header{background:var(--bg2);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .dash-header h2{font-size:16px;font-weight:600}
    .dash-header .user-info{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text2)}
    .dash-header .logout-btn{padding:6px 12px;background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:6px;font-size:12px}
    .dash-body{display:flex;min-height:calc(100vh - 53px)}
    .sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--line);padding:16px 0;flex-shrink:0}
    .sidebar button{display:block;width:100%;text-align:left;padding:10px 20px;background:none;color:var(--text2);border:none;font-size:13px;font-weight:500}
    .sidebar button:hover,.sidebar button.active{background:var(--bg3);color:var(--text)}
    .sidebar button.active{border-left:3px solid var(--accent);padding-left:17px}
    .main-content{flex:1;padding:24px;overflow-y:auto}
    .main-content h3{font-size:18px;font-weight:600;margin-bottom:16px}
    .main-content h4{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--text2)}

    /* Cards & Tables */
    .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:16px}
    .table-wrap table{margin-bottom:0}
    .card-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .card-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
    .outlet-row{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;background:var(--card)}
    .outlet-del{align-self:end;height:36px;width:36px;justify-content:center}
    .checkbox{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;user-select:none}
    .allergen-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .allergen-cell{padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg2)}
    @media (max-width:520px){.allergen-grid{grid-template-columns:1fr}}

    /* Variant editor (P1.6) */
    .var-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
    .var-row{display:grid;grid-template-columns:1fr 1fr 30px;gap:6px;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px}
    .var-row input{width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:12.5px;color:var(--text);min-width:0}
    .var-prices{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .mv-del{width:30px;height:30px;border-radius:8px;background:var(--card2);border:1px solid var(--border2);color:var(--text2);cursor:pointer;font-size:13px}
    .mv-del:hover{border-color:var(--danger);color:var(--danger)}
    .btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}

    /* Hours editor (P1.11) */
    .hours-list{display:flex;flex-direction:column;gap:8px}
    .hours-row{display:grid;grid-template-columns:1fr 96px 20px 96px;gap:8px;align-items:center;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px}
    .hours-day{font-size:12.5px;font-weight:700;color:var(--text2)}
    .hours-row input{width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:12.5px;color:var(--text);min-width:0;font-family:inherit}
    .hours-sep{text-align:center;color:var(--text3);font-size:13px}
    @media (max-width:520px){.hours-row{grid-template-columns:1fr 88px 16px 88px;gap:6px}}
    .checkbox input{accent-color:var(--accent);width:16px;height:16px}
    .field{margin-bottom:12px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;padding:8px 12px;color:var(--text2);font-weight:500;border-bottom:1px solid var(--line)}
    td{padding:8px 12px;border-bottom:1px solid var(--line)}
    tr:hover td{background:rgba(255,255,255,.03)}

    /* Buttons */
    .btn{padding:8px 16px;border:none;border-radius:6px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
    .btn-primary{background:var(--accent);color:#000}
    .btn-success{background:var(--success);color:#000}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--line)}
    .btn-sm{padding:5px 10px;font-size:12px}
    .btn-group{display:flex;gap:8px;margin-top:16px}

    /* Item toolbar (search / filter / sort) */
    .item-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
    .item-toolbar .item-search{flex:1;min-width:180px}
    .item-toolbar select{min-width:120px;flex:0 1 auto}
    .item-count{font-size:12px;color:var(--text2);margin-inline-start:auto;white-space:nowrap}

    /* Orders tab */
    .order-lines{display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:1.55;color:var(--text2);min-width:160px}
    .order-lines .ln{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
    .order-lines .lname{flex:1;min-width:0}
    .order-lines .off .lname{color:var(--success)}
    .order-lines .neg{color:var(--success);white-space:nowrap;font-weight:600}
    .order-id{font-weight:700;color:var(--accent);font-size:13px;white-space:nowrap}
    .order-note-inline{font-style:italic;color:var(--text3);margin-top:4px;max-width:220px;overflow-wrap:break-word}

    /* Deal modal dynamic fields */
    .deal-fields{display:none}
    .bundle-pick{display:flex;flex-wrap:wrap;gap:8px}
    .bundle-pick label.chip{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);border:1px solid var(--line);border-radius:16px;padding:6px 12px;cursor:pointer;background:var(--bg)}
    .bundle-pick label.chip input{width:auto}
    .bundle-pick label.chip:has(input:checked){background:var(--accent);color:#000;border-color:var(--accent)}
    .deal-note{font-size:12px;color:var(--text2);margin:-6px 0 10px}

    /* Language toggle */
    .auth-lang-row{display:flex;justify-content:flex-end;margin-bottom:8px}
    .lang-btn{padding:4px 12px;border:1px solid var(--line);border-radius:16px;background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer}
    .lang-btn:hover{color:var(--text);border-color:var(--accent)}

    /* Toggle */
    .toggle{position:relative;width:40px;height:22px;display:inline-block}
    .toggle input{opacity:0;width:0;height:0}
    .toggle .slider{position:absolute;inset:0;background:var(--bg3);border-radius:11px;cursor:pointer;transition:.2s}
    .toggle .slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
    .toggle input:checked+.slider{background:var(--success)}
    .toggle input:checked+.slider::before{transform:translateX(18px)}

    /* Currency chips */
    .currency-chips{display:flex;gap:6px;flex-wrap:wrap}
    .currency-chip{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;border:1px solid var(--line);color:var(--text2);cursor:pointer;transition:.15s}
    .currency-chip.on{background:var(--accent);color:#000;border-color:var(--accent)}

    /* Toast */
    .toast{position:fixed;bottom:20px;right:20px;background:var(--success);color:#000;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:.3s;pointer-events:none}
    .toast.show{opacity:1}
    .toast.error{background:var(--danger);color:#fff}

    /* Empty state */
    .empty{text-align:center;padding:40px;color:var(--text3);font-size:14px}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
    .modal{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
    .modal h3{margin-bottom:16px}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

    /* Loading */
    .spinner{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-overlay{position:absolute;inset:0;background:rgba(15,23,42,.8);display:flex;align-items:center;justify-content:center;z-index:50;border-radius:var(--radius)}

    /* Mobile tab bar */
    .mobile-tabs{display:none;background:var(--bg2);border-bottom:1px solid var(--line);padding:8px;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .mobile-tabs::-webkit-scrollbar{display:none}
    .mobile-tabs button{flex:0 0 auto;padding:8px 16px;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--text2);font-size:13px;font-weight:600;white-space:nowrap}
    .mobile-tabs button.active{background:var(--accent);color:#000;border-color:var(--accent)}

    /* Responsive */
    @media(max-width:768px){
      .sidebar{display:none}
      .mobile-tabs{display:flex;position:sticky;top:var(--header-h,104px);z-index:90}
      .dash-body{flex-direction:column}
      .main-content{padding:16px;overflow-x:hidden}
      .card-row,.card-row-3{grid-template-columns:1fr}
      .outlet-row{grid-template-columns:1fr 1fr}

      /* Header wraps to two tidy rows on phones (title on top, actions below) */
      .dash-header{flex-wrap:wrap;gap:6px;padding:10px 16px}
      .dash-header h2{width:100%;font-size:15px}
      .dash-header .user-info{justify-content:flex-end;flex-wrap:wrap;gap:10px}
      .dash-header .logout-btn{padding:8px 14px}
      .lang-btn{padding:6px 14px}
      :root{--header-h:104px}

      /* Prevent iOS auto-zoom on small inputs */
      input,select,textarea{font-size:16px}

      /* Tables become stacked cards */
      .table-wrap{overflow:visible;margin-bottom:12px}
      .table-wrap table,.table-wrap thead,.table-wrap tbody,.table-wrap tr,.table-wrap td{display:block}
      .table-wrap thead{display:none}
      .table-wrap tbody{display:flex;flex-direction:column;gap:12px}
      .table-wrap tr{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
      .table-wrap tr:hover td{background:transparent}
      .table-wrap td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:none;padding:9px 0;font-size:15px}
      .table-wrap td::before{content:attr(data-label);font-size:11px;font-weight:600;color:var(--text2);flex-shrink:0;letter-spacing:.3px}
      .table-wrap td:last-child{justify-content:flex-start;flex-wrap:wrap}
      .table-wrap td:last-child::before{width:100%;margin-bottom:2px}
      .table-wrap td.empty{display:flex;justify-content:center;padding:26px;font-size:14px;color:var(--text3)}
      .table-wrap td.empty::before{content:none}

      /* Touch-friendly buttons + full-width modal */
      .btn{padding:10px 16px;min-height:42px}
      .btn-sm{min-height:38px;padding:8px 14px;font-size:13px}
      .modal-overlay{padding:12px}
      .modal{padding:18px;max-width:100%}
      .modal-actions .btn{flex:1;justify-content:center}
      .toggle{width:44px;height:24px}
      .toggle .slider::before{width:18px;height:18px}
      .toggle input:checked+.slider::before{transform:translateX(20px)}
      .btn-group{flex-wrap:wrap}
      .item-toolbar input,.item-toolbar select{flex:1 1 100%}
      .item-count{margin-inline-start:0}
    }
  </style>
</head>
<body>

<!-- ═══════════════ AUTH SCREEN ═══════════════ -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-lang-row"><button class="lang-btn" id="auth-lang-btn" onclick="toggleAdminLang()">EN</button></div>
    <h1 id="auth-title">لوحة تحكم QR Menu</h1>
    <p id="auth-sub">سجّل الدخول بالبريد الإلكتروني للمشرف — بدون رمز.</p>
    <div class="field">
      <label id="auth-email-label">البريد الإلكتروني</label>
      <input type="email" id="auth-email" placeholder="you@email.com" value="amworxx@gmail.com">
    </div>
    <button class="login-btn" id="login-btn" onclick="loginWithEmail()">دخول</button>
    <div class="error" id="auth-error"></div>
  </div>
</div>

<!-- ═══════════════ DASHBOARD ═══════════════ -->
<div id="dashboard">
  <div class="dash-header">
    <h2 id="dash-title">لوحة تحكم QR Menu</h2>
    <div class="user-info">
      <span id="user-email"></span>
      <button class="lang-btn" id="dash-lang-btn" onclick="toggleAdminLang()">EN</button>
      <button class="logout-btn" id="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>
  </div>
  <div class="dash-body">
    <nav class="sidebar">
      <button class="active" onclick="showTab('shop')" data-tab="shop" data-i18n="tab_shop">Shop Settings</button>
      <button onclick="showTab('categories')" data-tab="categories" data-i18n="tab_categories">Categories</button>
      <button onclick="showTab('items')" data-tab="items" data-i18n="tab_items">Menu Items</button>
      <button onclick="showTab('deals')" data-tab="deals" data-i18n="tab_deals">Deals &amp; Offers</button>
      <button onclick="showTab('orders')" data-tab="orders" data-i18n="tab_orders">Orders</button>
      <button onclick="showTab('currencies')" data-tab="currencies" data-i18n="tab_currencies">Currencies</button>
    </nav>
    <div class="mobile-tabs" id="mobile-tabs">
      <button onclick="showTab('shop')" data-tab="shop" data-i18n="tab_shop">Shop Settings</button>
      <button onclick="showTab('categories')" data-tab="categories" data-i18n="tab_categories">Categories</button>
      <button onclick="showTab('items')" data-tab="items" data-i18n="tab_items">Menu Items</button>
      <button onclick="showTab('deals')" data-tab="deals" data-i18n="tab_deals">Deals &amp; Offers</button>
      <button onclick="showTab('orders')" data-tab="orders" data-i18n="tab_orders">Orders</button>
      <button onclick="showTab('currencies')" data-tab="currencies" data-i18n="tab_currencies">Currencies</button>
    </div>
    <div class="main-content" id="main-content">
      <!-- Dynamic content injected here -->
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ═══════════════ MODAL ═══════════════ -->
<div class="modal-overlay" id="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ─── Supabase Client ───────────────────────────────────────
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let currentShop = null;
let allCategories = [];
let allItems = [];
let allOutlets = []; // P2.8: branches for this shop
let removedOutletIds = []; // P2.8: outlet rows marked for delete
let currentTab = 'shop';
// Items list UX state (search / filter / sort / pagination)
let itemQuery = '', itemCat = '', itemSort = 'order', itemShown = 50;
const ITEM_PAGE = 50;
// Orders tab state (loaded set + filters + range pagination)
let ordersAll = [];
let orderHasMore = true;
let orderQuery = '', orderFilter = 'all';
const ORDER_PAGE = 200;

// ─── I18N (Arabic default) ─────────────────────────────────
let lang = localStorage.getItem('qm-admin-lang') || 'ar';
const I18N = {

  tab_shop:         { en: 'Shop Settings', ar: 'إعدادات المتجر' },

  discount:         { en: 'Discount', ar: 'الخصم' },

  // Orders tab
  loading_orders:   { en: 'Loading orders…', ar: 'جارٍ تحميل الطلبات…' },
  no_orders:        { en: 'No orders yet. When a customer places an order it will appear here.', ar: 'لا توجد طلبات بعد. عندما يضع العميل طلباً سيظهر هنا.' },

// ─── AUTH ───────────────────────────────────────────────────
// Interim email-only login: the edge function verifies the email server-side
// against the shop owner, mints a magic-link token, exchanges it server-side,
// and hands back a ready access/refresh pair — no email is ever sent.
// This creates a real Supabase session (auth.email() = typed email) so RLS works.
async function loginWithEmail() {
  const email = document.getElementById('auth-email').value.trim();
  if (!email) return showAuthError(t('enter_admin_email'));
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> ' + t('signing_in');
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-login-gate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t('login_failed'));
    const { error } = await sb.auth.setSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Math.floor(Date.now() / 1000) + (data.expires_in || 3600),
    });
    if (error) throw new Error(error.message);
    currentUser = (await sb.auth.getSession()).data.session?.user;
    if (!currentUser) throw new Error(t('session_not_created'));
    showDashboard();
    return;
  } catch (e) {
    showAuthError(e.message || t('login_failed'));
  }
  btn.disabled = false; btn.innerHTML = t('login');
}

function showAuthError(msg) {
  const map = {
    'This email is not the admin': { en: 'This email is not the admin', ar: 'هذا البريد الإلكتروني ليس بريد المشرف' },
    'Email address is required':   { en: 'Email address is required', ar: 'البريد الإلكتروني مطلوب' }
  };
  document.getElementById('auth-error').textContent = (map[msg] && map[msg][lang]) || msg;
}

// Enter key support
document.getElementById('auth-email').addEventListener('keydown', e => { if (e.key === 'Enter') loginWithEmail(); });

// ─── INIT ───────────────────────────────────────────────────
(async () => {
  // A sign-in link from Supabase may land here with ?token= (magic link) or ?code= (PKCE)
  const params = new URLSearchParams(window.location.search);
  const urlToken = params.get('token');
  const urlCode = params.get('code');
  let session = null;
  try {
    if (urlToken) {
      const type = params.get('type') || 'magiclink';
      const email = params.get('email') || '';
      const { error } = await sb.auth.verifyOtp({ email, token: urlToken, type });
      if (error) showAuthError(error.message);
      else session = (await sb.auth.getSession()).data.session;
    } else if (urlCode) {
      const { error } = await sb.auth.exchangeCodeForSession(urlCode);
      if (error) showAuthError(error.message);
      else session = (await sb.auth.getSession()).data.session;
    } else {
      session = (await sb.auth.getSession()).data.session;
    }
  } catch (e) { showAuthError(e.message); }
  if (session?.user) {
    currentUser = session.user;
    showDashboard();
  }
  if (urlToken || urlCode) history.replaceState(null, '', location.pathname + location.hash);
})();

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session?.user) {
    currentUser = session.user;
    showDashboard();
  }
});

async function logout() {
  await sb.auth.signOut();
  currentUser = null; currentShop = null;
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  applyLang();
}

// ─── DASHBOARD ──────────────────────────────────────────────
async function showDashboard() {
  applyLang();
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('user-email').textContent = currentUser.email;

  // Load or create shop
  const { data: shops } = await sb.from('shops').select('*').eq('owner_email', currentUser.email).limit(1);
  if (!shops || shops.length === 0) {
    // Create default shop for this email
    const { data: newShop } = await sb.from('shops').insert({
      owner_email: currentUser.email,
      name: 'My Shop',
      name_ar: 'متجري',
      whatsapp: '',
      currency_default: 'SYP',
      currencies: ['SYP', 'USD', 'TRY']
    }).select().single();
    currentShop = newShop;
  } else {
    currentShop = shops[0];
  }

  // Load categories
  const { data: cats } = await sb.from('categories').select('*').eq('shop_id', currentShop.id).order('sort_order');
  allCategories = cats || [];

  // Load items with prices
  const { data: items } = await sb.from('items').select('*, item_prices(*)').eq('shop_id', currentShop.id).order('sort_order');
  allItems = items || [];

  // Load outlets (P2.8)
  const { data: outs } = await sb.from('outlets').select('*').eq('shop_id', currentShop.id).order('sort_order');
  allOutlets = outs || [];

  showTab('shop');
}

// ─── TABS ───────────────────────────────────────────────────
function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.sidebar button, .mobile-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const c = document.getElementById('main-content');
  const header = document.querySelector('.dash-header');
  if (header && header.getBoundingClientRect().height > 0)
    document.documentElement.style.setProperty('--header-h', (Math.round(header.getBoundingClientRect().height) + 1) + 'px');
  switch(tab) {
    case 'shop': c.innerHTML = renderShopTab(); break;
    case 'categories': c.innerHTML = renderCategoriesTab(); break;
    case 'items': c.innerHTML = renderItemsTab(); renderItemRows(); break;
    case 'deals': c.innerHTML = `<div class="empty">${t('loading_deals')}</div>`; renderDealsTab().then(html => { c.innerHTML = html; }); break;
    case 'orders': c.innerHTML = `<div class="empty">${t('loading_orders')}</div>`; renderOrdersTab().then(html => { c.innerHTML = html; }); break;
    case 'currencies': c.innerHTML = renderCurrenciesTab(); break;
  }
}

async function saveShop() {
  const updates = {
    name: gv('s-name'), name_ar: gv('s-name-ar'),
    tagline: gv('s-tagline'), tagline_ar: gv('s-tagline-ar'),
    logo_url: gv('s-logo'),
    whatsapp: gv('s-whatsapp'), phone: gv('s-phone'), email: gv('s-email'),
    address: gv('s-address'), address_ar: gv('s-address-ar'),
    about: gv('s-about'), about_ar: gv('s-about-ar'),
    instagram: gv('s-instagram'), facebook: gv('s-facebook'), tripadvisor: gv('s-tripadvisor'),
    legal_note: gv('s-legal-note'), legal_note_ar: gv('s-legal-note-ar'),
    wifi_name: gv('s-wifi-name'), wifi_pass: gv('s-wifi-pass'),
    hours: collectHours(),
    primary_color: gv('s-color'), accent_color: gv('s-accent'),
    footer_text: gv('s-footer'),
    currency_default: gv('s-default-currency'),
    show_currency_selector: document.getElementById('s-show-currency').checked
  };
  const { error } = await sb.from('shops').update(updates).eq('id', currentShop.id);
  if (error) return toast(t('error') + ': ' + error.message, true);
  Object.assign(currentShop, updates);
  // P2.8: persist outlet rows (insert/update/delete) after the shop row
  const outErr = await saveOutlets();
  if (outErr) return toast(t('error') + ': ' + outErr.message, true);
  toast(t('shop_settings_saved'));
}

// P2.8 — outlets editor (branches): name EN/AR, per-outlet WhatsApp, active toggle
function outletsEditorRows(list) {
  if (!list || list.length === 0) {
    return `<p style="font-size:12px;color:var(--text2)">${t('outlets_hint')}</p>`;
  }
  return list.map(o => `
    <div class="outlet-row" data-oid="${esc(o.id || '')}">
      <div class="field"><label>${t('outlet_name')}</label><input class="o-name" value="${esc(o.name || '')}" dir="ltr"></div>
      <div class="field"><label>${t('outlet_name_ar')}</label><input class="o-name-ar" value="${esc(o.name_ar || '')}" dir="rtl"></div>
      <div class="field"><label>${t('outlet_whatsapp')}</label><input class="o-wa" value="${esc(o.whatsapp || '')}" dir="ltr" placeholder="963..."></div>
      <div class="field"><label>${t('outlet_active')}</label>
        <label class="toggle" style="margin-top:4px"><input type="checkbox" class="o-active" ${o.is_active ? 'checked' : ''}><span class="slider"></span></label>
      </div>
      <button class="btn btn-danger outlet-del" type="button" onclick="removeOutletRow(this)" title="${t('outlet_remove')}">✕</button>
    </div>`).join('');
}
function addOutletRow() {
  const wrap = document.getElementById('s-outlets');
  const empty = document.querySelector('#s-outlets p');
  if (empty) empty.remove();
  wrap.insertAdjacentHTML('beforeend', outletsEditorRows([{ id: '', name: '', name_ar: '', whatsapp: '', is_active: true }]));
}
function removeOutletRow(btn) {
  const row = btn.closest('.outlet-row');
  const oid = row?.dataset?.oid;
  if (oid) removedOutletIds.push(oid);
  row?.remove();
  const wrap = document.getElementById('s-outlets');
  if (!wrap.querySelector('.outlet-row')) {
    wrap.innerHTML = `<p style="font-size:12px;color:var(--text2)">${t('outlets_hint')}</p>`;
  }
}
async function saveOutlets() {
  const rows = [...document.querySelectorAll('#s-outlets .outlet-row')];
  let idx = 0;
  for (const row of rows) {
    const name = row.querySelector('.o-name').value.trim();
    const name_ar = row.querySelector('.o-name-ar').value.trim();
    const whatsapp = row.querySelector('.o-wa').value.trim();
    if (!name && !name_ar) continue; // skip blank rows
    const payload = { name, name_ar, whatsapp, is_active: row.querySelector('.o-active').checked, sort_order: idx++ };
    const id = row.dataset.oid || null;
    if (id) {
      const { error } = await sb.from('outlets').update(payload).eq('id', id);
      if (error) return error;
    } else {
      const { error } = await sb.from('outlets').insert({ ...payload, shop_id: currentShop.id });
      if (error) return error;
    }
  }
  for (const oid of removedOutletIds) {
    const { error } = await sb.from('outlets').delete().eq('id', oid);
    if (error) return error;
  }
  removedOutletIds = [];
  // Re-render rows so saved rows carry their DB ids (otherwise a later delete
  // of a just-added row is silently skipped because data-oid is empty).
  const { data: outs } = await sb.from('outlets').select('*').eq('shop_id', currentShop.id).order('sort_order');
  allOutlets = outs || [];
  const wrap = document.getElementById('s-outlets');
  if (wrap) wrap.innerHTML = outletsEditorRows(allOutlets);
  return null;
}

// P1.11 — 7 rows (Mon..Sun) of open/close time inputs from shops.hours jsonb
function hoursEditorRows(s) {
  const days = [t('day_mon'), t('day_tue'), t('day_wed'), t('day_thu'), t('day_fri'), t('day_sat'), t('day_sun')];
  const h = Array.isArray(s.hours) ? s.hours : [];
  return days.map((d, i) => {
    const e = h[i] || {};
    return `<div class="hours-row"><span class="hours-day">${d}</span>
      <input class="h-open" type="time" value="${esc(e.open || '')}">
      <span class="hours-sep">–</span>
      <input class="h-close" type="time" value="${esc(e.close || '')}">
    </div>`;
  }).join('');
}
function collectHours() {
  return [...document.querySelectorAll('#s-hours .hours-row')].map(r => {
    const open = r.querySelector('.h-open').value;
    const close = r.querySelector('.h-close').value;
    if (!open && !close) return null;
    return { open: open || null, close: close || null };
  });
}

}

function filteredItems() {
  const q = itemQuery.trim().toLowerCase();
  let list = allItems.filter(i => {
    if (itemCat && i.category_id !== itemCat) return false;
    if (!q) return true;
    return [i.name, i.name_ar, i.description, i.description_ar].join(' ').toLowerCase().includes(q);
  });
  const priceOf = i => { const p = (i.item_prices || []).find(p => p.currency === currentShop.currency_default); return p ? Number(p.price) : 0; };
  if (itemSort === 'name') list = [...list].sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  else if (itemSort === 'price_low') list = [...list].sort((a, b) => priceOf(a) - priceOf(b));
  else if (itemSort === 'price_high') list = [...list].sort((a, b) => priceOf(b) - priceOf(a));
  else list = [...list].sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  return list;
}

// Variant editor (P1.6): rows of name_en / name_ar / 3 currency prices
function variantRowHTML(v) {
  const p = (v && v.prices) || {};
  const val = (c) => (p[c] != null ? p[c] : '');
  return `<div class="var-row">
    <input class="mv-en" placeholder="${t('variant_name_en')}" value="${v ? esc(v.name || '') : ''}">
    <input class="mv-ar" dir="rtl" placeholder="${t('variant_name_ar')}" value="${v ? esc(v.name_ar || '') : ''}">
    <button type="button" class="mv-del" title="${t('remove_variant') || 'Remove'}" onclick="this.closest('.var-row').remove()">✕</button>
    <div class="var-prices">
      <input class="mv-SYP" type="number" step="0.01" placeholder="SYP" value="${val('SYP')}">
      <input class="mv-USD" type="number" step="0.01" placeholder="USD" value="${val('USD')}">
      <input class="mv-TRY" type="number" step="0.01" placeholder="TRY" value="${val('TRY')}">
    </div>
  </div>`;
}
function addVariantRow() {
  const list = document.getElementById('m-variants');
  if (list) list.insertAdjacentHTML('beforeend', variantRowHTML(null));
  else openItemModal(currentItemId || null);
}
function collectVariants() {
  return [...document.querySelectorAll('.var-row')].map(r => {
    const name = r.querySelector('.mv-en').value.trim();
    const name_ar = r.querySelector('.mv-ar').value.trim();
    const prices = {};
    ['SYP', 'USD', 'TRY'].forEach(c => {
      const v = r.querySelector('.mv-' + c).value;
      if (v !== '') prices[c] = Number(v);
    });
    if (!name && !name_ar && Object.keys(prices).length === 0) return null;
    return { name, name_ar, prices };
  }).filter(Boolean);
}

async function saveItem(id) {
  const itemData = {
    name: gv('m-item-name'), name_ar: gv('m-item-name-ar'),
    description: gv('m-item-desc'), description_ar: gv('m-item-desc-ar'),
    category_id: gv('m-item-cat') || null,
    sort_order: parseInt(gv('m-item-sort')) || 0,
    image_url: gv('m-item-img'),
    kcal: gv('m-item-kcal') === '' ? null : parseInt(gv('m-item-kcal')),
    prep_time_min: gv('m-item-prep') === '' ? null : parseInt(gv('m-item-prep')),
    popular: document.getElementById('m-item-popular')?.checked ?? false,
    chef_choice: document.getElementById('m-item-chef')?.checked ?? false,
    is_new: document.getElementById('m-item-new')?.checked ?? false,
    allergens: [...document.querySelectorAll('.allergen-grid input:checked')].map(i => i.value),
    variants: collectVariants(),
    shop_id: currentShop.id
  };

  let itemId = id;
  if (id) {
    const { error } = await sb.from('items').update(itemData).eq('id', id);
    if (error) return toast(t('error') + ': ' + error.message, true);
  } else {
    const { data, error } = await sb.from('items').insert(itemData).select().single();
    if (error) return toast(t('error') + ': ' + error.message, true);
    itemId = data.id;
  }

  // Upsert prices
  const currencies = currentShop.currencies || ['SYP'];
  for (const c of currencies) {
    const priceInput = document.getElementById(`m-price-${c}`);
    const visInput = document.getElementById(`m-price-vis-${c}`);
    if (!priceInput) continue;
    const price = parseFloat(priceInput.value) || 0;
    const isVisible = visInput?.checked ?? true;
    if (price > 0 || id) {
      await sb.from('item_prices').upsert({
        item_id: itemId, currency: c, price, is_visible: isVisible
      }, { onConflict: 'item_id,currency' });
    }
  }

  closeModal();
  // Reload items
  const { data: items } = await sb.from('items').select('*, item_prices(*)').eq('shop_id', currentShop.id).order('sort_order');
  allItems = items || [];
  showTab('items');
  toast(id ? t('item_updated') : t('item_created'));
}

async function toggleItem(id, field, val) {
  await sb.from('items').update({ [field]: val }).eq('id', id);
  const item = allItems.find(x => x.id === id);
  if (item) item[field] = val;
}

async function deleteItem(id) {
  if (!confirm(t('delete_item_q'))) return;
  await sb.from('items').delete().eq('id', id);
  allItems = allItems.filter(i => i.id !== id);
  showTab('items');
  toast(t('item_deleted'));
}

// ─── DEALS ──────────────────────────────────────────────────
function dealLabel(d) {
  const c = d.currency || currentShop.currency_default || 'SYP';
  switch (d.deal_type) {
    case 'percent': return `-${d.discount_value}%`;
    case 'fixed':   return `-${d.discount_value} ${c}`;
    case 'bogo':    return `${d.buy_qty || 1} + ${d.get_qty || 1}`;
    case 'bundle':  return `${(d.bundle_items || []).length}x ${d.bundle_price} ${c}`;
    case 'min_order': return d.reward_type === 'percent'
      ? `≥${d.min_total} → -${d.discount_value}%`
      : `≥${d.min_total} → -${d.discount_value} ${c}`;
    default: return d.discount_type === 'percent' ? `-${d.discount_value}%` : `-${d.discount_value} ${c}`;
  }
}

function dealScopeLine(d) {
  if (d.applies_to === 'item') {
    const it = allItems.find(i => i.id === d.item_id);
    return it ? t('scope_item') + ': ' + (it.name || '') : t('scope_item');
  }
  if (d.applies_to === 'category') {
    const cat = allCategories.find(i => i.id === d.category_id);
    return cat ? t('scope_category') + ': ' + (cat.name || '') : t('scope_category');
  }
  return t('scope_all');
}

function dealTypeChanged() {
  const type = gv('m-deal-type') || 'percent';
  const fields = {
    percent: ['percent', 'scope'], fixed: ['fixed', 'scope'],
    bogo: ['bogo'], bundle: ['bundle'], min_order: ['min_order']
  };
  document.querySelectorAll('#m-deal-fields .deal-fields').forEach(el => {
    const show = fields[type] && fields[type].includes(el.dataset.dt);
    el.style.display = show ? 'block' : 'none';
  });
}

function dealScopeChanged() {
  const scope = gv('m-deal-scope');
  document.getElementById('m-deal-item-wrap').style.display = scope === 'item' ? 'block' : 'none';
  document.getElementById('m-deal-cat-wrap').style.display = scope === 'category' ? 'block' : 'none';
}

function dealBundleItems() {
  return Array.from(document.querySelectorAll('#m-deal-fields .bundle-pick input:checked')).map(i => i.value);
}

async function saveDeal(id) {
  const dt = gv('m-deal-type');
  const scope = (dt === 'percent' || dt === 'fixed') ? (gv('m-deal-scope') || 'all') : (dt === 'bogo' ? 'item' : 'all');
  const data = {
    title: gv('m-deal-title'), title_ar: gv('m-deal-title-ar'),
    description: gv('m-deal-desc'), description_ar: gv('m-deal-desc-ar'),
    deal_type: dt, shop_id: currentShop.id,
    starts_at: gv('m-deal-start') || null, ends_at: gv('m-deal-end') || null,
    applies_to: scope, item_id: null, category_id: null,
    buy_qty: null, get_qty: null, min_total: null, reward_type: null,
    bundle_price: null, bundle_items: null,
    discount_value: 0, currency: currentShop.currency_default || 'SYP'
  };
  if (scope === 'item') data.item_id = gv('m-deal-item') || null;
  if (scope === 'category') data.category_id = gv('m-deal-cat') || null;
  if (dt === 'percent') data.discount_value = parseFloat(gv('m-deal-percent-value')) || 0;
  if (dt === 'fixed') { data.discount_value = parseFloat(gv('m-deal-fixed-value')) || 0; data.currency = gv('m-deal-fixed-currency'); }
  if (dt === 'bogo') { data.buy_qty = parseInt(gv('m-deal-buy')) || 1; data.get_qty = parseInt(gv('m-deal-get')) || 1; data.item_id = gv('m-deal-item-list') || null; }
  if (dt === 'bundle') { data.bundle_items = dealBundleItems(); data.bundle_price = parseFloat(gv('m-deal-bundle-price')) || 0; data.currency = gv('m-deal-bundle-currency'); }
  if (dt === 'min_order') { data.min_total = parseFloat(gv('m-deal-min')) || 0; data.reward_type = gv('m-deal-reward-type'); data.discount_value = parseFloat(gv('m-deal-reward-value')) || 0; }
  let error;
  if (id) {
    ({ error } = await sb.from('deals').update(data).eq('id', id));
  } else {
    ({ error } = await sb.from('deals').insert(data));
  }
  if (error) return toast(t('error') + ': ' + error.message, true);
  closeModal();
  showTab('deals');
  toast(id ? t('deal_updated') : t('deal_created'));
}

async function toggleDeal(id, val) {
  await sb.from('deals').update({ is_active: val }).eq('id', id);

  toast(t('deal_deleted'));
}

async function toggleCurrency(c) {
  let currencies = currentShop.currencies || ['SYP'];
  if (currencies.includes(c)) {
    currencies = currencies.filter(x => x !== c);
  } else {
    currencies.push(c);
  }
  await sb.from('shops').update({ currencies }).eq('id', currentShop.id);
  currentShop.currencies = currencies;
  // If removed currency was default, switch to first available
  if (!currencies.includes(currentShop.currency_default) && currencies.length > 0) {
    await sb.from('shops').update({ currency_default: currencies[0] }).eq('id', currentShop.id);
    currentShop.currency_default = currencies[0];
  }
  showTab('currencies');
  toast(t('currencies_updated'));
}

async function updateDefaultCurrency() {
  const val = gv('s-default-cur');
  await sb.from('shops').update({ currency_default: val }).eq('id', currentShop.id);
  currentShop.currency_default = val;
  toast(t('default_currency_updated'));
}

async function toggleCurrencySelector() {
  const val = document.getElementById('s-show-cur-sel').checked;
  await sb.from('shops').update({ show_currency_selector: val }).eq('id', currentShop.id);
  currentShop.show_currency_selector = val;
}

// ─── ORDERS ─────────────────────────────────────────────────
// RLS: owner can SELECT orders for their shop (bigserial id desc = newest first).
// Paginated via .range() so the list can grow without unbounded memory.
async function loadOrders(reset) {
  if (reset) { ordersAll = []; orderHasMore = true; }
  if (!orderHasMore) { renderOrderRows(); return; }
  const from = ordersAll.length;
  const to = from + ORDER_PAGE - 1;
  const { data, error } = await sb.from('orders')
    .select('*')
    .eq('shop_id', currentShop.id)
    .order('id', { ascending: false })
    .range(from, to);
  if (error) return toast(t('error') + ': ' + error.message, true);
  const rows = data || [];
  ordersAll = ordersAll.concat(rows);
  orderHasMore = rows.length === ORDER_PAGE;
  renderOrderRows();
}

function filterOrders() {
  let list = ordersAll;
  const q = orderQuery.trim().toLowerCase();
  if (q) list = list.filter(o => String(o.id).includes(q));
  if (orderFilter === 'today') {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    list = list.filter(o => new Date(o.created_at) >= start);
  }
  return list;
}

function orderRowHTML(o) {
  const loc = lang === 'ar' ? 'ar-SY' : 'en-GB';
  const dt = new Date(o.created_at).toLocaleString(loc, { dateStyle: 'short', timeStyle: 'short' });
  const cur = o.currency || 'SYP';
  const items = (o.items || []).map(it => {
    const nm = lang === 'ar' ? (it.name_ar || it.name) : it.name;
    return `<div class="ln"><span class="lname">${esc(nm)} × ${it.qty}</span><span>${esc(it.unit_price)} ${cur}</span></div>`;
  }).join('');
  const offers = (o.offers || []).map(off => {
    const nm = lang === 'ar' ? (off.summary || off.title_ar || off.title) : (off.title || off.summary);
    return `<div class="ln off"><span class="lname">${esc(nm)}</span><span class="neg">−${esc(off.savings)} ${cur}</span></div>`;
  }).join('');
  const noteHtml = o.note ? `<div class="order-note-inline">${t('note')}: ${esc(o.note)}</div>` : '';
  return `
    <tr>
      <td data-label="${t('order_no')}"><span class="order-id">#${o.id}</span></td>
      <td data-label="${t('date')}"><small>${esc(dt)}</small></td>
      <td data-label="${t('items_label')}"><div class="order-lines">${items}${noteHtml}</div></td>
      <td data-label="${t('offers')}">${offers ? `<div class="order-lines">${offers}</div>` : '<span style="color:var(--text3)">—</span>'}</td>
      <td data-label="${t('subtotal')}">${esc(o.subtotal)} ${cur}</td>
      <td data-label="${t('discount')}"><span class="neg">−${esc(o.discount)} ${cur}</span></td>
      <td data-label="${t('total')}"><strong>${esc(o.total)} ${cur}</strong></td>
    </tr>`;
}

function renderOrderRows() {
  const tbody = document.getElementById('orders-tbody');
  if (!tbody) return;
  const list = filterOrders();
  const count = document.getElementById('order-count');
  if (count) count.textContent = `${t('showing')} ${list.length} ${t('of')} ${ordersAll.length}${orderHasMore ? '+' : ''}`;
  const more = document.getElementById('order-more-wrap');
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty">${ordersAll.length ? t('no_orders_match') : t('no_orders')}</td></tr>`;
    if (more) more.innerHTML = '';
    return;
  }
  tbody.innerHTML = list.map(orderRowHTML).join('');
  if (more) more.innerHTML = orderHasMore
    ? `<button class="btn btn-ghost" onclick="loadOrders(false)">${t('load_more')}</button>`
    : '';
}

async function renderOrdersTab() {
  loadOrders(true);
  return `
    <h3>${t('tab_orders')}</h3>
    <div class="item-toolbar">
      <input class="item-search" id="order-search" placeholder="${t('orders_search')}" value="${esc(orderQuery)}" oninput="orderQuery=this.value; renderOrderRows();">
      <select id="order-filter" onchange="orderFilter=this.value; renderOrderRows();">
        <option value="all" ${orderFilter==='all'?'selected':''}>${t('orders_all')}</option>
        <option value="today" ${orderFilter==='today'?'selected':''}>${t('orders_today')}</option>
      </select>
      <button class="btn btn-ghost" onclick="loadOrders(true)">⟳ ${t('refresh')}</button>
      <span class="item-count" id="order-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>${t('order_no')}</th><th>${t('date')}</th><th>${t('items_label')}</th><th>${t('offers')}</th><th>${t('subtotal')}</th><th>${t('discount')}</th><th>${t('total')}</th></tr></thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>
    <div id="order-more-wrap" style="text-align:center"></div>
  `;
}

// ─── HELPERS ────────────────────────────────────────────────
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function gv(id) { return document.getElementById(id)?.value?.trim() ?? ''; }
function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}
function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
</script>
