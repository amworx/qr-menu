// ─── REVIEWS (P2.9 customer satisfaction survey) ────────────
let reviewsAll = [];
let reviewHasMore = true;
let reviewQuery = '';
let reviewFilter = 'all';   // 'all' | '5' | '4' | '3' | '2' | '1'
let reviewSort = 'newest';  // 'newest' | 'oldest' | 'high' | 'low'
const REVIEW_PAGE = 200;
let reviewFetchToken = 0;   // guards against out-of-order responses (race fixes)

async function loadReviews(reset) {
  const token = ++reviewFetchToken;
  if (reset) { reviewsAll = []; reviewHasMore = true; }
  if (!reviewHasMore) { renderReviewRows(); return; }
  const from = reviewsAll.length;
  // fetch page+1 rows: the extra row tells us whether more pages exist,
  // avoiding the off-by-one where an exact-multiple total leaves a phantom "Load more"
  const to = from + REVIEW_PAGE;
  const { data, error } = await sb.from('surveys')
    .select('*')
    .eq('shop_id', currentShop.id)
    .order('created_at', { ascending: false })
    .range(from, to);
  if (error) return toast(t('error') + ': ' + error.message, true);
  if (token !== reviewFetchToken) return;      // a newer load started; drop stale response
  const rows = (data || []).slice(0, REVIEW_PAGE);
  reviewsAll = reviewsAll.concat(rows);
  reviewHasMore = (data || []).length > REVIEW_PAGE;
  renderReviewRows();
}

function filterReviews() {
  let list = reviewsAll;
  const q = reviewQuery.trim().toLowerCase();
  if (q) list = list.filter(r => String(r.rating).includes(q) || (r.comment || '').toLowerCase().includes(q));
  if (reviewFilter !== 'all') list = list.filter(r => String(r.rating) === reviewFilter);
  if (reviewSort === 'oldest') list = [...list].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  else if (reviewSort === 'high') list = [...list].sort((a, b) => (b.rating || 0) - (a.rating || 0) || (new Date(b.created_at) - new Date(a.created_at)));
  else if (reviewSort === 'low') list = [...list].sort((a, b) => (a.rating || 0) - (b.rating || 0) || (new Date(b.created_at) - new Date(a.created_at)));
  else list = [...list].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  return list;
}

function reviewStarsHTML(rating) {
  const full = '★'.repeat(rating || 0);
  const empty = '★'.repeat(Math.max(0, 5 - (rating || 0)));
  return `<span class="rev-stars"><span class="on">${full}</span><span class="off">${empty}</span></span>`;
}

function reviewRowHTML(r) {
  const loc = lang === 'ar' ? 'ar-SY' : 'en-GB';
  const dt = new Date(r.created_at).toLocaleString(loc, { dateStyle: 'short', timeStyle: 'short' });
  const comment = (r.comment || '').trim()
    ? `<div class="rev-comment">${esc(r.comment)}</div>`
    : `<div class="rev-comment" style="color:var(--text3);font-style:italic">${t('no_comment')}</div>`;
  return `
    <tr>
      <td data-label="${t('rating')}">${reviewStarsHTML(r.rating)} <small style="color:var(--text2)">${r.rating}/5</small></td>
      <td data-label="${t('comment')}">${comment}</td>
      <td data-label="${t('date')}"><span class="rev-date">${esc(dt)}</span></td>
      <td data-label="${t('actions')}">
        <button class="btn btn-ghost btn-sm" onclick="deleteReview('${r.id}')">${t('delete')}</button>
      </td>
    </tr>`;
}

function renderReviewSummary() {
  const d = reviewDistro();
  const avgEl = document.getElementById('rev-avg');
  const avgStarsEl = document.getElementById('rev-avg-stars');
  const totalEl = document.getElementById('rev-total');
  const barsEl = document.getElementById('rev-bars');
  if (avgEl) avgEl.innerHTML = reviewsAll.length ? d.avg.toFixed(1) + ' <small style="font-size:13px">/ 5</small>' : '— <small style="font-size:13px">/ 5</small>';
  if (avgStarsEl) avgStarsEl.innerHTML = reviewsAll.length ? reviewStarsHTML(Math.round(d.avg)) : '';
  if (totalEl) totalEl.textContent = reviewsAll.length;
  if (barsEl) barsEl.innerHTML = reviewsAll.length ? d.rows : `<div style="color:var(--text3);font-size:13px;text-align:center;padding:10px">${t('no_reviews')}</div>`;
}

function renderReviewRows() {
  const tbody = document.getElementById('reviews-tbody');
  if (!tbody) return;
  const list = filterReviews();
  const count = document.getElementById('review-count');
  if (count) count.textContent = `${t('showing')} ${list.length} ${t('of')} ${reviewsAll.length}${reviewHasMore ? '+' : ''}`;
  const more = document.getElementById('review-more-wrap');
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="empty">${reviewsAll.length ? t('no_reviews_match') : t('no_reviews')}</td></tr>`;
  } else {
    tbody.innerHTML = list.map(reviewRowHTML).join('');
  }
  // Always keep "Load more" reachable while more pages exist — even when the
  // current filter yields no rows (matches may appear on later pages).
  if (more) more.innerHTML = reviewHasMore && reviewsAll.length
    ? `<button class="btn btn-ghost" onclick="loadReviews(false)">${t('load_more')}</button>`
    : '';
  renderReviewSummary();
}

function reviewDistro() {
  const buckets = [0, 0, 0, 0, 0];
  reviewsAll.forEach(r => { const i = Math.min(Math.max(parseInt(r.rating) || 0, 1), 5) - 1; buckets[i]++; });
  const total = reviewsAll.length || 1;
  const avg = reviewsAll.length ? (reviewsAll.reduce((s, r) => s + (parseInt(r.rating) || 0), 0) / reviewsAll.length) : 0;
  const rows = buckets.map((n, i) => {
    const star = 5 - i;
    const pct = Math.round((n / total) * 100);
    return `<div class="rev-bar-row"><span>${star}★</span><div class="rev-bar-track"><div class="rev-bar-fill" style="width:${pct}%"></div></div><span>${n}</span></div>`;
  }).join('');
  return { avg, total: reviewsAll.length, rows };
}

async function renderReviewsTab() {
  loadReviews(true);
  const d = reviewDistro();
  return `
    <h3>${t('tab_reviews')}</h3>
    <div class="rev-summary">
      <div class="rev-stat">
        <div class="v" id="rev-avg">${reviewsAll.length ? d.avg.toFixed(1) : '—'} <small style="font-size:13px">/ 5</small></div>
        <div class="l">${t('avg_rating')}</div>
        <div class="rev-stars" id="rev-avg-stars" style="margin-top:6px">${reviewsAll.length ? reviewStarsHTML(Math.round(d.avg)) : ''}</div>
      </div>
      <div class="rev-stat">
        <div class="v" id="rev-total">${reviewsAll.length}</div>
        <div class="l">${t('total_reviews')}</div>
      </div>
      <div class="rev-bars" id="rev-bars">
        ${reviewsAll.length ? d.rows : `<div style="color:var(--text3);font-size:13px;text-align:center;padding:10px">${t('no_reviews')}</div>`}
      </div>
    </div>
    <div class="item-toolbar">
      <input class="item-search" id="review-search" placeholder="${t('reviews_search')}" value="${esc(reviewQuery)}" oninput="reviewQuery=this.value; renderReviewRows();">
      <select id="review-rating-filter" aria-label="${t('rating')}" onchange="reviewFilter=this.value; renderReviewRows();">
        <option value="all" ${reviewFilter==='all'?'selected':''}>${t('rating_all')}</option>
        ${[5,4,3,2,1].map(n => `<option value="${n}" ${reviewFilter===String(n)?'selected':''}>${n}★</option>`).join('')}
      </select>
      <select id="review-sort" aria-label="${t('sort')}" onchange="reviewSort=this.value; renderReviewRows();">
        <option value="newest" ${reviewSort==='newest'?'selected':''}>${t('sort_newest')}</option>
        <option value="oldest" ${reviewSort==='oldest'?'selected':''}>${t('sort_oldest')}</option>
        <option value="high" ${reviewSort==='high'?'selected':''}>${t('sort_high')}</option>
        <option value="low" ${reviewSort==='low'?'selected':''}>${t('sort_low')}</option>
      </select>
      <button class="btn btn-ghost" onclick="loadReviews(true)"><i data-lucide="refresh-cw"></i> ${t('refresh')}</button>
      <span class="item-count" id="review-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>${t('rating')}</th><th>${t('comment')}</th><th>${t('date')}</th><th></th></tr></thead>
        <tbody id="reviews-tbody"></tbody>
      </table>
    </div>
    <div id="review-more-wrap" style="text-align:center"></div>
  `;
}

async function deleteReview(id) {
  if (!confirm(t('delete_review_q'))) return;
  const { error } = await sb.from('surveys').delete().eq('id', id);
  if (error) return toast(t('error') + ': ' + error.message, true);
  reviewsAll = reviewsAll.filter(r => String(r.id) !== String(id));
  renderReviewRows();   // updates table + summary without a full reload
  toast(t('review_deleted'));
}

// ─── USAGE & ALERTS ──────────────────────────────────────────
function renderUsageTab() {
  return `
    <h3>${t('tab_usage')}</h3>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px">
        <p style="font-size:13px;color:var(--text2)">${t('usage_subtitle')}</p>
        <button class="btn btn-ghost" onclick="loadUsageStats()"><i data-lucide="refresh-cw"></i> ${t('usage_refresh')}</button>
      </div>
      <div id="usage-alerts" style="margin-top:10px"></div>
    </div>
    <div id="usage-body">
      <div class="empty">${t('usage_loading')}</div>
    </div>
  `;
}

let usageLoadedOnce = false;
async function loadUsageStats() {
  const body = document.getElementById('usage-body');
  if (!body) return;
  body.innerHTML = `<div class="empty">${t('usage_loading')}</div>`;

  // GitHub Pages repo size (public API — no auth needed). Fail soft.
  let github = null;
  try {
    const r = await fetch('https://api.github.com/repos/amworx/qr-menu');
    if (r.ok) {
      const j = await r.json();
      github = { size_mb: Math.round((j.size || 0) / 1024 * 100) / 100, limit_mb: 1024 };
    }
  } catch (e) { /* offline / blocked — treat as unknown */ }

  // Owner-gated RPC: returns null for non-owners, stats for the owner.
  const { data: usage, error } = await sb.rpc('get_usage_stats');
  if (error || !usage) {
    body.innerHTML = `<div class="empty">${t('usage_error')}${error ? ' — ' + esc(error.message) : ''}</div>`;
    document.getElementById('usage-alerts').innerHTML =
      `<div class="alert critical">⚠ ${t('usage_error_owner')}</div>`;
    return;
  }

  renderUsageBoard(usage, github);
  usageLoadedOnce = true;
}

function renderUsageBoard(u, g) {
  const body = document.getElementById('usage-body');
  const dbPct = Math.min(100, Math.round(u.db_size_mb / u.db_limit_mb * 100));
  const mauPct = Math.min(100, Math.round(u.users_active_30d / u.mau_limit * 100));
  const ghPct = g ? Math.min(100, Math.round(g.size_mb / g.limit_mb * 100)) : null;

  // Level thresholds: <80% ok, 80–94% warning, >=95% critical
  const lvl = p => p >= 95 ? 'critical' : p >= 80 ? 'warning' : 'ok';
  const barColor = p => p >= 95 ? 'var(--danger)' : p >= 80 ? 'var(--accent)' : 'var(--success)';

  const alerts = [];
  if (lvl(dbPct) !== 'ok') alerts.push({ level: lvl(dbPct), text: `${t('usage_database')}: ${dbPct}%` });
  if (lvl(mauPct) !== 'ok') alerts.push({ level: lvl(mauPct), text: `${t('usage_mau')}: ${mauPct}%` });
  if (g && lvl(ghPct) !== 'ok') alerts.push({ level: lvl(ghPct), text: `${t('usage_repo_size')}: ${ghPct}%` });

  document.getElementById('usage-alerts').innerHTML = alerts.length
    ? alerts.map(a => `<div class="alert ${a.level}">⚠ ${esc(a.text)} — ${t('usage_' + a.level)}</div>`).join('')
    : `<div class="alert ok">✓ ${t('usage_no_alerts')}</div>`;

  // Table rows (exclude pg catalog noise — only public tables with data)
  const tables = Object.entries(u.row_counts || {})
    .filter(([name, count]) => count > 0)
    .sort((a, b) => b[1] - a[1]);

  body.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">

      <div class="card">
        <h4>${t('usage_database')}</h4>
        <div style="font-size:13px;color:var(--text2);margin-bottom:6px">
          ${u.db_size_mb} MB ${t('usage_limit_of')} ${u.db_limit_mb} MB
        </div>
        <div class="usage-bar"><div class="usage-fill" style="width:${dbPct}%;background:${barColor(dbPct)}"></div></div>
        <span class="usage-pct" style="color:${barColor(dbPct)}">${dbPct}% · ${t('usage_' + lvl(dbPct))}</span>
      </div>

      <div class="card">
        <h4>${t('usage_mau')}</h4>
        <div style="font-size:13px;color:var(--text2);margin-bottom:6px">
          ${u.users_active_30d} ${t('usage_limit_of')} ${u.mau_limit}
        </div>
        <div class="usage-bar"><div class="usage-fill" style="width:${mauPct}%;background:${barColor(mauPct)}"></div></div>
        <span class="usage-pct" style="color:${barColor(mauPct)}">${mauPct}% · ${t('usage_' + lvl(mauPct))}</span>
      </div>

      <div class="card">
        <h4>${t('usage_repo_size')}</h4>
        ${g
          ? `<div style="font-size:13px;color:var(--text2);margin-bottom:6px">${g.size_mb} MB ${t('usage_limit_of')} ${g.limit_mb} MB</div>
             <div class="usage-bar"><div class="usage-fill" style="width:${ghPct}%;background:${barColor(ghPct)}"></div></div>
             <span class="usage-pct" style="color:${barColor(ghPct)}">${ghPct}% · ${t('usage_' + lvl(ghPct))}</span>`
          : `<div style="font-size:13px;color:var(--text2)">${t('usage_na')}</div>`}
      </div>

      <div class="card">
        <h4>${t('usage_tables')}</h4>
        <table style="width:100%;font-size:13px">
          <thead><tr><th></th><th></th></tr></thead>
          <tbody>
            ${tables.map(([name, count]) => `
              <tr><td style="color:var(--text2)">${esc(name)}</td><td style="text-align:right;font-weight:600">${count}</td></tr>`).join('') || `<tr><td style="color:var(--text2)">—</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
    <div style="font-size:12px;color:var(--text3);margin-top:4px;text-align:right">
      ${t('usage_updated')}: ${new Date().toLocaleString(lang === 'ar' ? 'ar' : 'en-US')}
    </div>
  `;
}

// ─── HELPERS ────────────────────────────────────────────────
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function gv(id) { return document.getElementById(id)?.value?.trim() ?? ''; }
function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.innerHTML = '<i data-lucide="' + (isError ? 'circle-alert' : 'circle-check-big') + '"></i><span>' + String(msg).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) + '</span>';
  t.className = 'toast show' + (isError ? ' error' : '');
  refreshIcons();
  setTimeout(() => t.className = 'toast', 3000);
}
function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
</script>
</body>
</html>
