<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QR Menu — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
      --text:#f8fafc;--text2:#94a3b8;--text3:#64748b;
      --accent:#f59e0b;--accent2:#d97706;
      --success:#22c55e;--danger:#ef4444;--info:#3b82f6;
      --line:#334155;--radius:10px;
    }
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    a{color:var(--accent);text-decoration:none}
    button{cursor:pointer;font-family:inherit}
    input,select,textarea{font-family:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:14px;width:100%}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
    textarea{resize:vertical;min-height:60px}
    label{font-size:12px;color:var(--text2);margin-bottom:4px;display:block;font-weight:500}

    /* Auth */
    #auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .auth-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:40px;width:100%;max-width:400px}
    .auth-card h1{font-size:20px;margin-bottom:4px}
    .auth-card p{color:var(--text2);font-size:13px;margin-bottom:24px}
    .auth-card .otp-group{display:flex;gap:8px}
    .auth-card .otp-group input{flex:1}
    .auth-card .otp-group button{white-space:nowrap;padding:8px 16px;background:var(--accent);color:#000;border:none;border-radius:6px;font-weight:600;font-size:14px}
    .auth-card .otp-group button:disabled{opacity:.5}
    .auth-card .verify-btn{width:100%;margin-top:12px;padding:10px;background:var(--success);color:#000;border:none;border-radius:6px;font-weight:600;font-size:14px}
    .auth-card .error{color:var(--danger);font-size:13px;margin-top:8px}

    /* Dashboard */
    #dashboard{display:none;min-height:100vh}
    .dash-header{background:var(--bg2);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .dash-header h2{font-size:16px;font-weight:600}
    .dash-header .user-info{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text2)}
    .dash-header .logout-btn{padding:6px 12px;background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:6px;font-size:12px}
    .dash-body{display:flex;min-height:calc(100vh - 53px)}
    .sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--line);padding:16px 0;flex-shrink:0}
    .sidebar button{display:block;width:100%;text-align:left;padding:10px 20px;background:none;color:var(--text2);border:none;font-size:13px;font-weight:500}
    .sidebar button:hover,.sidebar button.active{background:var(--bg3);color:var(--text)}
    .sidebar button.active{border-left:3px solid var(--accent);padding-left:17px}
    .main-content{flex:1;padding:24px;overflow-y:auto}
    .main-content h3{font-size:18px;font-weight:600;margin-bottom:16px}
    .main-content h4{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--text2)}

    /* Cards & Tables */
    .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
    .card-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .card-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
    .field{margin-bottom:12px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;padding:8px 12px;color:var(--text2);font-weight:500;border-bottom:1px solid var(--line)}
    td{padding:8px 12px;border-bottom:1px solid var(--line)}
    tr:hover td{background:rgba(255,255,255,.03)}

    /* Buttons */
    .btn{padding:8px 16px;border:none;border-radius:6px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
    .btn-primary{background:var(--accent);color:#000}
    .btn-success{background:var(--success);color:#000}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--line)}
    .btn-sm{padding:5px 10px;font-size:12px}
    .btn-group{display:flex;gap:8px;margin-top:16px}

    /* Toggle */
    .toggle{position:relative;width:40px;height:22px;display:inline-block}
    .toggle input{opacity:0;width:0;height:0}
    .toggle .slider{position:absolute;inset:0;background:var(--bg3);border-radius:11px;cursor:pointer;transition:.2s}
    .toggle .slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
    .toggle input:checked+.slider{background:var(--success)}
    .toggle input:checked+.slider::before{transform:translateX(18px)}

    /* Currency chips */
    .currency-chips{display:flex;gap:6px;flex-wrap:wrap}
    .currency-chip{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;border:1px solid var(--line);color:var(--text2);cursor:pointer;transition:.15s}
    .currency-chip.on{background:var(--accent);color:#000;border-color:var(--accent)}

    /* Toast */
    .toast{position:fixed;bottom:20px;right:20px;background:var(--success);color:#000;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:.3s;pointer-events:none}
    .toast.show{opacity:1}
    .toast.error{background:var(--danger);color:#fff}

    /* Empty state */
    .empty{text-align:center;padding:40px;color:var(--text3);font-size:14px}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
    .modal{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
    .modal h3{margin-bottom:16px}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

    /* Loading */
    .spinner{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-overlay{position:absolute;inset:0;background:rgba(15,23,42,.8);display:flex;align-items:center;justify-content:center;z-index:50;border-radius:var(--radius)}

    /* Responsive */
    @media(max-width:768px){
      .sidebar{display:none}
      .dash-body{flex-direction:column}
      .main-content{padding:16px}
      .card-row,.card-row-3{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

<!-- ═══════════════ AUTH SCREEN ═══════════════ -->
<div id="auth-screen">
  <div class="auth-card">
    <h1>QR Menu Admin</h1>
    <p>Enter your email to receive a secure sign-in link.</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="you@email.com" value="amworxx@gmail.com">
    </div>
    <div id="otp-section" style="display:none">
      <div class="field">
        <label>One-Time Code</label>
        <input type="text" id="auth-otp" placeholder="123456" maxlength="6">
      </div>
      <button class="verify-btn" id="verify-btn" onclick="verifyOTP()">Verify &amp; Login</button>
      <p style="font-size:12px;color:#94a3b8;margin-top:8px">Check your inbox — click the sign-in link in the email to open this dashboard.</p>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px;padding:10px" id="send-otp-btn" onclick="sendOTP()">Send OTP Code</button>
    <div class="error" id="auth-error"></div>
  </div>
</div>

<!-- ═══════════════ DASHBOARD ═══════════════ -->
<div id="dashboard">
  <div class="dash-header">
    <h2>QR Menu Admin</h2>
    <div class="user-info">
      <span id="user-email"></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="dash-body">
    <nav class="sidebar">
      <button class="active" onclick="showTab('shop')" data-tab="shop">Shop Settings</button>
      <button onclick="showTab('categories')" data-tab="categories">Categories</button>
      <button onclick="showTab('items')" data-tab="items">Menu Items</button>
      <button onclick="showTab('deals')" data-tab="deals">Deals &amp; Offers</button>
      <button onclick="showTab('currencies')" data-tab="currencies">Currencies</button>
    </nav>
    <div class="main-content" id="main-content">
      <!-- Dynamic content injected here -->
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ═══════════════ MODAL ═══════════════ -->
<div class="modal-overlay" id="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ─── Supabase Client ───────────────────────────────────────
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let currentShop = null;
let allCategories = [];
let allItems = [];

// ─── AUTH ───────────────────────────────────────────────────
async function sendOTP() {
  const email = document.getElementById('auth-email').value.trim();
  if (!email) return showAuthError('Enter your email');
  const btn = document.getElementById('send-otp-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Sending...';
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: 'https://amworx.github.io/qr-menu/admin.html' }
  });
  btn.disabled = false; btn.textContent = 'Send OTP Code';
  if (error) return showAuthError(error.message);
  document.getElementById('otp-section').style.display = 'block';
  document.getElementById('auth-otp').focus();
  showAuthError(''); // clear
}

async function verifyOTP() {
  const email = document.getElementById('auth-email').value.trim();
  const otp = document.getElementById('auth-otp').value.trim();
  if (!otp) return showAuthError('Enter the 6-digit code');
  const btn = document.getElementById('verify-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Verifying...';
  const { data, error } = await sb.auth.verifyOtp({ email, token: otp, type: 'email' });
  btn.disabled = false; btn.textContent = 'Verify & Login';
  if (error) return showAuthError(error.message);
  currentUser = data.user;
  showDashboard();
}

function showAuthError(msg) {
  document.getElementById('auth-error').textContent = msg;
}

// Enter key support
document.getElementById('auth-otp').addEventListener('keydown', e => { if (e.key === 'Enter') verifyOTP(); });
document.getElementById('auth-email').addEventListener('keydown', e => { if (e.key === 'Enter') sendOTP(); });

// ─── INIT ───────────────────────────────────────────────────
(async () => {
  // A sign-in link from Supabase may land here with ?token= (magic link) or ?code= (PKCE)
  const params = new URLSearchParams(window.location.search);
  const urlToken = params.get('token');
  const urlCode = params.get('code');
  let session = null;
  try {
    if (urlToken) {
      const type = params.get('type') || 'magiclink';
      const email = params.get('email') || '';
      const { error } = await sb.auth.verifyOtp({ email, token: urlToken, type });
      if (error) showAuthError(error.message);
      else session = (await sb.auth.getSession()).data.session;
    } else if (urlCode) {
      const { error } = await sb.auth.exchangeCodeForSession(urlCode);
      if (error) showAuthError(error.message);
      else session = (await sb.auth.getSession()).data.session;
    } else {
      session = (await sb.auth.getSession()).data.session;
    }
  } catch (e) { showAuthError(e.message); }
  if (session?.user) {
    currentUser = session.user;
    showDashboard();
  }
  if (urlToken || urlCode) history.replaceState(null, '', location.pathname + location.hash);
})();

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session?.user) {
    currentUser = session.user;
    showDashboard();
  }
});

async function logout() {
  await sb.auth.signOut();
  currentUser = null; currentShop = null;
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

// ─── DASHBOARD ──────────────────────────────────────────────
async function showDashboard() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('user-email').textContent = currentUser.email;

  // Load or create shop
  const { data: shops } = await sb.from('shops').select('*').eq('owner_email', currentUser.email).limit(1);
  if (!shops || shops.length === 0) {
    // Create default shop for this email
    const { data: newShop } = await sb.from('shops').insert({
      owner_email: currentUser.email,
      name: 'My Shop',
      name_ar: 'متجري',
      whatsapp: '',
      currency_default: 'SYP',
      currencies: ['SYP', 'USD', 'TRY']
    }).select().single();
    currentShop = newShop;
  } else {
    currentShop = shops[0];
  }

  // Load categories
  const { data: cats } = await sb.from('categories').select('*').eq('shop_id', currentShop.id).order('sort_order');
  allCategories = cats || [];

  // Load items with prices
  const { data: items } = await sb.from('items').select('*, item_prices(*)').eq('shop_id', currentShop.id).order('sort_order');
  allItems = items || [];

  showTab('shop');
}

// ─── TABS ───────────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll('.sidebar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const c = document.getElementById('main-content');
  switch(tab) {
    case 'shop': c.innerHTML = renderShopTab(); break;
    case 'categories': c.innerHTML = renderCategoriesTab(); break;
    case 'items': c.innerHTML = renderItemsTab(); break;
    case 'deals': c.innerHTML = renderDealsTab(); break;
    case 'currencies': c.innerHTML = renderCurrenciesTab(); break;
  }
}

// ─── SHOP SETTINGS ──────────────────────────────────────────
function renderShopTab() {
  const s = currentShop;
  return `
    <h3>Shop Settings</h3>
    <div class="card">
      <h4>General</h4>
      <div class="card-row">
        <div class="field"><label>Shop Name (EN)</label><input id="s-name" value="${esc(s.name)}"></div>
        <div class="field"><label>Shop Name (AR)</label><input id="s-name-ar" value="${esc(s.name_ar)}" dir="rtl"></div>
      </div>
      <div class="card-row">
        <div class="field"><label>Tagline (EN)</label><input id="s-tagline" value="${esc(s.tagline)}"></div>
        <div class="field"><label>Tagline (AR)</label><input id="s-tagline-ar" value="${esc(s.tagline_ar)}" dir="rtl"></div>
      </div>
      <div class="field"><label>Logo URL</label><input id="s-logo" value="${esc(s.logo_url)}" placeholder="https://..."></div>
    </div>
    <div class="card">
      <h4>Contact</h4>
      <div class="card-row-3">
        <div class="field"><label>WhatsApp (with country code)</label><input id="s-whatsapp" value="${esc(s.whatsapp)}" placeholder="963992656853"></div>
        <div class="field"><label>Phone</label><input id="s-phone" value="${esc(s.phone)}"></div>
        <div class="field"><label>Email</label><input id="s-email" value="${esc(s.email)}"></div>
      </div>
      <div class="card-row">
        <div class="field"><label>Address (EN)</label><input id="s-address" value="${esc(s.address)}"></div>
        <div class="field"><label>Address (AR)</label><input id="s-address-ar" value="${esc(s.address_ar)}" dir="rtl"></div>
      </div>
    </div>
    <div class="card">
      <h4>Branding</h4>
      <div class="card-row-3">
        <div class="field"><label>Primary Color</label><input type="color" id="s-color" value="${s.primary_color || '#D97706'}" style="height:36px;padding:2px"></div>
        <div class="field"><label>Accent Color</label><input type="color" id="s-accent" value="${s.accent_color || '#92400E'}" style="height:36px;padding:2px"></div>
        <div class="field"><label>Footer Text</label><input id="s-footer" value="${esc(s.footer_text)}"></div>
      </div>
    </div>
    <div class="card">
      <h4>Currency</h4>
      <div class="card-row">
        <div class="field">
          <label>Default Currency</label>
          <select id="s-default-currency">
            ${['SYP','USD','TRY'].map(c => `<option value="${c}" ${s.currency_default===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Show Currency Selector</label>
          <label class="toggle" style="margin-top:4px">
            <input type="checkbox" id="s-show-currency" ${s.show_currency_selector ? 'checked' : ''}>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="saveShop()">Save Changes</button>
    </div>
  `;
}

async function saveShop() {
  const updates = {
    name: gv('s-name'), name_ar: gv('s-name-ar'),
    tagline: gv('s-tagline'), tagline_ar: gv('s-tagline-ar'),
    logo_url: gv('s-logo'),
    whatsapp: gv('s-whatsapp'), phone: gv('s-phone'), email: gv('s-email'),
    address: gv('s-address'), address_ar: gv('s-address-ar'),
    primary_color: gv('s-color'), accent_color: gv('s-accent'),
    footer_text: gv('s-footer'),
    currency_default: gv('s-default-currency'),
    show_currency_selector: document.getElementById('s-show-currency').checked
  };
  const { error } = await sb.from('shops').update(updates).eq('id', currentShop.id);
  if (error) return toast('Error: ' + error.message, true);
  Object.assign(currentShop, updates);
  toast('Shop settings saved');
}

// ─── CATEGORIES ─────────────────────────────────────────────
function renderCategoriesTab() {
  return `
    <h3>Categories</h3>
    <div class="btn-group" style="margin-top:0;margin-bottom:16px">
      <button class="btn btn-primary" onclick="openCategoryModal()">+ New Category</button>
    </div>
    <table>
      <thead><tr><th>Order</th><th>Name (EN)</th><th>Name (AR)</th><th>Active</th><th></th></tr></thead>
      <tbody>
        ${allCategories.map(c => `
          <tr>
            <td>${c.sort_order}</td>
            <td>${esc(c.name)}</td>
            <td dir="rtl">${esc(c.name_ar)}</td>
            <td><label class="toggle"><input type="checkbox" ${c.is_active?'checked':''} onchange="toggleCategory('${c.id}','is_active',this.checked)"><span class="slider"></span></label></td>
            <td>
              <button class="btn btn-ghost btn-sm" onclick="openCategoryModal('${c.id}')">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteCategory('${c.id}')">Delete</button>
            </td>
          </tr>
        `).join('')}
        ${allCategories.length===0 ? '<tr><td colspan="5" class="empty">No categories yet. Create one to get started.</td></tr>' : ''}
      </tbody>
    </table>
  `;
}

function openCategoryModal(id) {
  const cat = id ? allCategories.find(c => c.id === id) : null;
  document.getElementById('modal-content').innerHTML = `
    <h3>${cat ? 'Edit Category' : 'New Category'}</h3>
    <div class="field"><label>Name (EN)</label><input id="m-cat-name" value="${cat ? esc(cat.name) : ''}"></div>
    <div class="field"><label>Name (AR)</label><input id="m-cat-name-ar" value="${cat ? esc(cat.name_ar) : ''}" dir="rtl"></div>
    <div class="field"><label>Sort Order</label><input type="number" id="m-cat-sort" value="${cat ? cat.sort_order : (allCategories.length + 1) * 10}"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCategory('${id || ''}')">Save</button>
    </div>
  `;
  document.getElementById('modal-overlay').style.display = 'flex';
}

async function saveCategory(id) {
  const data = { name: gv('m-cat-name'), name_ar: gv('m-cat-name-ar'), sort_order: parseInt(gv('m-cat-sort')) || 0, shop_id: currentShop.id };
  let error;
  if (id) {
    ({ error } = await sb.from('categories').update(data).eq('id', id));
  } else {
    ({ error } = await sb.from('categories').insert(data));
  }
  if (error) return toast('Error: ' + error.message, true);
  closeModal();
  const { data: cats } = await sb.from('categories').select('*').eq('shop_id', currentShop.id).order('sort_order');
  allCategories = cats || [];
  showTab('categories');
  toast(id ? 'Category updated' : 'Category created');
}

async function toggleCategory(id, field, val) {
  await sb.from('categories').update({ [field]: val }).eq('id', id);
  const c = allCategories.find(x => x.id === id);
  if (c) c[field] = val;
}

async function deleteCategory(id) {
  if (!confirm('Delete this category? Items in it will become uncategorized.')) return;
  await sb.from('categories').delete().eq('id', id);
  allCategories = allCategories.filter(c => c.id !== id);
  showTab('categories');
  toast('Category deleted');
}

// ─── MENU ITEMS ─────────────────────────────────────────────
function renderItemsTab() {
  return `
    <h3>Menu Items</h3>
    <div class="btn-group" style="margin-top:0;margin-bottom:16px">
      <button class="btn btn-primary" onclick="openItemModal()">+ New Item</button>
    </div>
    <table>
      <thead><tr><th>Order</th><th>Name</th><th>Category</th><th>Available</th><th>Featured</th><th>Prices</th><th></th></tr></thead>
      <tbody>
        ${allItems.map(item => {
          const cat = allCategories.find(c => c.id === item.category_id);
          const prices = (item.item_prices || []).map(p => p.is_visible ? `${p.currency} ${p.price}` : `<s>${p.currency} ${p.price}</s>`).join(' · ');
          return `
          <tr>
            <td>${item.sort_order}</td>
            <td>${esc(item.name)}<br><small style="color:var(--text3)">${esc(item.name_ar)}</small></td>
            <td>${cat ? esc(cat.name) : '<span style="color:var(--text3)">—</span>'}</td>
            <td><label class="toggle"><input type="checkbox" ${item.is_available?'checked':''} onchange="toggleItem('${item.id}','is_available',this.checked)"><span class="slider"></span></label></td>
            <td><label class="toggle"><input type="checkbox" ${item.is_featured?'checked':''} onchange="toggleItem('${item.id}','is_featured',this.checked)"><span class="slider"></span></label></td>
            <td style="font-size:12px">${prices || '<span style="color:var(--text3)">—</span>'}</td>
            <td>
              <button class="btn btn-ghost btn-sm" onclick="openItemModal('${item.id}')">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteItem('${item.id}')">Delete</button>
            </td>
          </tr>`;
        }).join('')}
        ${allItems.length===0 ? '<tr><td colspan="7" class="empty">No items yet. Add your first menu item.</td></tr>' : ''}
      </tbody>
    </table>
  `;
}

function openItemModal(id) {
  const item = id ? allItems.find(i => i.id === id) : null;
  const existingPrices = item ? (item.item_prices || []).reduce((o, p) => ({ ...o, [p.currency]: p.price }), {}) : {};
  const visiblePrices = item ? (item.item_prices || []).reduce((o, p) => ({ ...o, [p.currency]: p.is_visible }), {}) : {};
  const currencies = currentShop.currencies || ['SYP'];

  document.getElementById('modal-content').innerHTML = `
    <h3>${item ? 'Edit Item' : 'New Item'}</h3>
    <div class="card-row">
      <div class="field"><label>Name (EN)</label><input id="m-item-name" value="${item ? esc(item.name) : ''}"></div>
      <div class="field"><label>Name (AR)</label><input id="m-item-name-ar" value="${item ? esc(item.name_ar) : ''}" dir="rtl"></div>
    </div>
    <div class="card-row">
      <div class="field"><label>Description (EN)</label><textarea id="m-item-desc">${item ? esc(item.description) : ''}</textarea></div>
      <div class="field"><label>Description (AR)</label><textarea id="m-item-desc-ar" dir="rtl">${item ? esc(item.description_ar) : ''}</textarea></div>
    </div>
    <div class="card-row">
      <div class="field">
        <label>Category</label>
        <select id="m-item-cat">
          <option value="">— None —</option>
          ${allCategories.map(c => `<option value="${c.id}" ${item?.category_id===c.id?'selected':''}>${c.name}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Sort Order</label><input type="number" id="m-item-sort" value="${item ? item.sort_order : (allItems.length + 1) * 10}"></div>
    </div>
    <div class="field"><label>Image URL</label><input id="m-item-img" value="${item ? esc(item.image_url) : ''}" placeholder="https://..."></div>
    <div class="field">
      <label style="margin-bottom:8px">Prices</label>
      ${currencies.map(c => `
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
          <span style="font-size:13px;font-weight:600;width:40px">${c}</span>
          <input type="number" step="0.01" id="m-price-${c}" value="${existingPrices[c] || ''}" placeholder="0" style="flex:1">
          <label class="toggle" title="Show/Hide ${c} on menu">
            <input type="checkbox" id="m-price-vis-${c}" ${visiblePrices[c] !== false ? 'checked' : ''}>
            <span class="slider"></span>
          </label>
        </div>
      `).join('')}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveItem('${id || ''}')">Save</button>
    </div>
  `;
  document.getElementById('modal-overlay').style.display = 'flex';
}

async function saveItem(id) {
  const itemData = {
    name: gv('m-item-name'), name_ar: gv('m-item-name-ar'),
    description: gv('m-item-desc'), description_ar: gv('m-item-desc-ar'),
    category_id: gv('m-item-cat') || null,
    sort_order: parseInt(gv('m-item-sort')) || 0,
    image_url: gv('m-item-img'),
    shop_id: currentShop.id
  };

  let itemId = id;
  if (id) {
    const { error } = await sb.from('items').update(itemData).eq('id', id);
    if (error) return toast('Error: ' + error.message, true);
  } else {
    const { data, error } = await sb.from('items').insert(itemData).select().single();
    if (error) return toast('Error: ' + error.message, true);
    itemId = data.id;
  }

  // Upsert prices
  const currencies = currentShop.currencies || ['SYP'];
  for (const c of currencies) {
    const priceInput = document.getElementById(`m-price-${c}`);
    const visInput = document.getElementById(`m-price-vis-${c}`);
    if (!priceInput) continue;
    const price = parseFloat(priceInput.value) || 0;
    const isVisible = visInput?.checked ?? true;
    if (price > 0 || id) {
      await sb.from('item_prices').upsert({
        item_id: itemId, currency: c, price, is_visible: isVisible
      }, { onConflict: 'item_id,currency' });
    }
  }

  closeModal();
  // Reload items
  const { data: items } = await sb.from('items').select('*, item_prices(*)').eq('shop_id', currentShop.id).order('sort_order');
  allItems = items || [];
  showTab('items');
  toast(id ? 'Item updated' : 'Item created');
}

async function toggleItem(id, field, val) {
  await sb.from('items').update({ [field]: val }).eq('id', id);
  const item = allItems.find(x => x.id === id);
  if (item) item[field] = val;
}

async function deleteItem(id) {
  if (!confirm('Delete this item?')) return;
  await sb.from('items').delete().eq('id', id);
  allItems = allItems.filter(i => i.id !== id);
  showTab('items');
  toast('Item deleted');
}

// ─── DEALS ──────────────────────────────────────────────────
async function renderDealsTab() {
  const { data: deals } = await sb.from('deals').select('*').eq('shop_id', currentShop.id).order('sort_order');
  return `
    <h3>Deals &amp; Offers</h3>
    <div class="btn-group" style="margin-top:0;margin-bottom:16px">
      <button class="btn btn-primary" onclick="openDealModal()">+ New Deal</button>
    </div>
    <table>
      <thead><tr><th>Title</th><th>Discount</th><th>Valid</th><th>Active</th><th></th></tr></thead>
      <tbody>
        ${(deals||[]).map(d => `
          <tr>
            <td>${esc(d.title)}<br><small style="color:var(--text3)">${esc(d.title_ar)}</small></td>
            <td>${d.discount_type==='percent' ? d.discount_value+'%' : d.discount_value+' '+d.currency}</td>
            <td><small>${d.starts_at ? new Date(d.starts_at).toLocaleDateString() : '—'} → ${d.ends_at ? new Date(d.ends_at).toLocaleDateString() : '∞'}</small></td>
            <td><label class="toggle"><input type="checkbox" ${d.is_active?'checked':''} onchange="toggleDeal('${d.id}',this.checked)"><span class="slider"></span></label></td>
            <td>
              <button class="btn btn-ghost btn-sm" onclick="openDealModal('${d.id}')">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteDeal('${d.id}')">Delete</button>
            </td>
          </tr>
        `).join('')}
        ${(!deals||deals.length===0) ? '<tr><td colspan="5" class="empty">No deals yet.</td></tr>' : ''}
      </tbody>
    </table>
  `;
}

async function openDealModal(id) {
  let deal = null;
  if (id) {
    const { data } = await sb.from('deals').select('*').eq('id', id).single();
    deal = data;
  }
  document.getElementById('modal-content').innerHTML = `
    <h3>${deal ? 'Edit Deal' : 'New Deal'}</h3>
    <div class="card-row">
      <div class="field"><label>Title (EN)</label><input id="m-deal-title" value="${deal ? esc(deal.title) : ''}"></div>
      <div class="field"><label>Title (AR)</label><input id="m-deal-title-ar" value="${deal ? esc(deal.title_ar) : ''}" dir="rtl"></div>
    </div>
    <div class="card-row">
      <div class="field"><label>Description (EN)</label><textarea id="m-deal-desc">${deal ? esc(deal.description) : ''}</textarea></div>
      <div class="field"><label>Description (AR)</label><textarea id="m-deal-desc-ar" dir="rtl">${deal ? esc(deal.description_ar) : ''}</textarea></div>
    </div>
    <div class="card-row-3">
      <div class="field">
        <label>Discount Type</label>
        <select id="m-deal-type">
          <option value="percent" ${deal?.discount_type==='percent'?'selected':''}>Percent (%)</option>
          <option value="fixed" ${deal?.discount_type==='fixed'?'selected':''}>Fixed Amount</option>
        </select>
      </div>
      <div class="field"><label>Value</label><input type="number" step="0.01" id="m-deal-value" value="${deal ? deal.discount_value : ''}"></div>
      <div class="field">
        <label>Currency (for fixed)</label>
        <select id="m-deal-currency">
          ${(currentShop.currencies||['SYP']).map(c => `<option value="${c}" ${deal?.currency===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="card-row">
      <div class="field"><label>Starts At</label><input type="date" id="m-deal-start" value="${deal?.starts_at ? deal.starts_at.split('T')[0] : ''}"></div>
      <div class="field"><label>Ends At</label><input type="date" id="m-deal-end" value="${deal?.ends_at ? deal.ends_at.split('T')[0] : ''}"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveDeal('${id || ''}')">Save</button>
    </div>
  `;
  document.getElementById('modal-overlay').style.display = 'flex';
}

async function saveDeal(id) {
  const data = {
    title: gv('m-deal-title'), title_ar: gv('m-deal-title-ar'),
    description: gv('m-deal-desc'), description_ar: gv('m-deal-desc-ar'),
    discount_type: gv('m-deal-type'), discount_value: parseFloat(gv('m-deal-value')) || 0,
    currency: gv('m-deal-currency'),
    starts_at: gv('m-deal-start') || null, ends_at: gv('m-deal-end') || null,
    shop_id: currentShop.id
  };
  let error;
  if (id) {
    ({ error } = await sb.from('deals').update(data).eq('id', id));
  } else {
    ({ error } = await sb.from('deals').insert(data));
  }
  if (error) return toast('Error: ' + error.message, true);
  closeModal();
  showTab('deals');
  toast(id ? 'Deal updated' : 'Deal created');
}

async function toggleDeal(id, val) {
  await sb.from('deals').update({ is_active: val }).eq('id', id);
}

async function deleteDeal(id) {
  if (!confirm('Delete this deal?')) return;
  await sb.from('deals').delete().eq('id', id);
  showTab('deals');
  toast('Deal deleted');
}

// ─── CURRENCIES ─────────────────────────────────────────────
function renderCurrenciesTab() {
  const currencies = currentShop.currencies || ['SYP'];
  return `
    <h3>Currency Settings</h3>
    <div class="card">
      <h4>Enabled Currencies</h4>
      <p style="font-size:13px;color:var(--text2);margin-bottom:12px">Toggle which currencies are available in your shop. Disabled currencies will be hidden from the menu and admin.</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        ${['SYP','USD','TRY'].map(c => `
          <label class="currency-chip ${currencies.includes(c)?'on':''}" onclick="toggleCurrency('${c}')" style="cursor:pointer;padding:8px 16px;font-size:13px">
            <input type="checkbox" ${currencies.includes(c)?'checked':''} style="display:none"> ${c}
          </label>
        `).join('')}
      </div>
    </div>
    <div class="card">
      <h4>Default Display Currency</h4>
      <p style="font-size:13px;color:var(--text2);margin-bottom:12px">This is the primary currency shown on the menu.</p>
      <select id="s-default-cur" style="max-width:200px" onchange="updateDefaultCurrency()">
        ${currencies.map(c => `<option value="${c}" ${currentShop.currency_default===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <div class="card">
      <h4>Currency Selector</h4>
      <p style="font-size:13px;color:var(--text2);margin-bottom:12px">Allow customers to switch between currencies on the menu.</p>
      <label class="toggle">
        <input type="checkbox" id="s-show-cur-sel" ${currentShop.show_currency_selector ? 'checked' : ''} onchange="toggleCurrencySelector()">
        <span class="slider"></span>
      </label>
      <span style="font-size:13px;margin-left:8px">${currentShop.show_currency_selector ? 'Visible' : 'Hidden'}</span>
    </div>
  `;
}

async function toggleCurrency(c) {
  let currencies = currentShop.currencies || ['SYP'];
  if (currencies.includes(c)) {
    currencies = currencies.filter(x => x !== c);
  } else {
    currencies.push(c);
  }
  await sb.from('shops').update({ currencies }).eq('id', currentShop.id);
  currentShop.currencies = currencies;
  // If removed currency was default, switch to first available
  if (!currencies.includes(currentShop.currency_default) && currencies.length > 0) {
    await sb.from('shops').update({ currency_default: currencies[0] }).eq('id', currentShop.id);
    currentShop.currency_default = currencies[0];
  }
  showTab('currencies');
  toast('Currencies updated');
}

async function updateDefaultCurrency() {
  const val = gv('s-default-cur');
  await sb.from('shops').update({ currency_default: val }).eq('id', currentShop.id);
  currentShop.currency_default = val;
  toast('Default currency updated');
}

async function toggleCurrencySelector() {
  const val = document.getElementById('s-show-cur-sel').checked;
  await sb.from('shops').update({ show_currency_selector: val }).eq('id', currentShop.id);
  currentShop.show_currency_selector = val;
}

// ─── HELPERS ────────────────────────────────────────────────
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function gv(id) { return document.getElementById(id)?.value?.trim() ?? ''; }
function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}
function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
</script>
</body>
</html>
