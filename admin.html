<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QR Menu — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind Play CDN (repo has no build step) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ember: { 50:'#fff8ed', 100:'#ffefd5', 200:'#fed7aa', 300:'#fdba74', 400:'#fb923c', 500:'#f97316', 600:'#ea580c', 700:'#c2410c' },
            ink: { 900:'#0b1120', 800:'#111b2f', 700:'#1e293b' }
          },
          fontFamily: { sans: ['Cairo','Inter','system-ui','sans-serif'] }
        }
      }
    }
  </script>
  <!-- Lucide icons (web build, https://lucide.dev/icons/) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0f1e;--bg2:#111a30;--bg3:#1c2742;
      --text:#f4f6fb;--text2:#9aa7c4;--text3:#64748b;
      --accent:#f97316;--accent2:#ea580c;
      --success:#22c55e;--danger:#ef4444;--info:#38bdf8;
      --primary:#8b5cf6;
      --line:rgba(148,163,184,.16);--radius:16px;
      --card:rgba(17,26,48,.7);--card2:rgba(30,41,66,.72);
      --border:rgba(148,163,184,.14);--border2:rgba(148,163,184,.24);
      --header-h:70px;
      --glow-ember:rgba(249,115,22,.13);
      --glow-violet:rgba(139,92,246,.10);
    }
    /* Ambient background glow */
    body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
      radial-gradient(900px 500px at 85% -10%,var(--glow-ember),transparent 60%),
      radial-gradient(800px 460px at -10% 20%,var(--glow-violet),transparent 55%),
      radial-gradient(600px 600px at 50% 120%,var(--glow-ember),transparent 60%)}
    /* Scrollbars — thin pill design matching the theme */
    *{scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.35) transparent}
    *::-webkit-scrollbar{width:9px;height:9px}
    *::-webkit-scrollbar-track{background:transparent}
    *::-webkit-scrollbar-thumb{background:rgba(148,163,184,.35);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
    *::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.6);border:2px solid transparent;background-clip:padding-box}
    *::-webkit-scrollbar-corner{background:transparent}
    body{font-family:'Cairo','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;letter-spacing:-.1px}
    a{color:var(--accent);text-decoration:none}
    button{cursor:pointer;font-family:inherit}
    input,select,textarea{font-family:inherit;background:rgba(10,15,30,.55);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 13px;font-size:14px;width:100%;transition:border-color .2s,box-shadow .2s}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.15)}
    textarea{resize:vertical;min-height:60px}
    label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block;font-weight:600}

    /* Auth */
    #auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .auth-card{background:linear-gradient(180deg,rgba(28,39,66,.78),rgba(17,26,48,.88));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border2);border-radius:20px;padding:40px;width:100%;max-width:400px;box-shadow:0 24px 60px -12px rgba(0,0,0,.55);animation:popIn .35s ease both}
    .auth-card h1{font-size:22px;margin-bottom:6px;font-weight:800;letter-spacing:-.2px}
    .auth-card p{color:var(--text2);font-size:13px;margin-bottom:26px}
    .auth-card .login-btn{width:100%;margin-top:14px;padding:12px;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s;box-shadow:0 10px 24px -10px rgba(249,115,22,.5)}
    .auth-card .login-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 14px 30px -10px rgba(249,115,22,.6)}
    .auth-card .login-btn:disabled{opacity:.55;cursor:not-allowed}
    .auth-card .login-btn svg{width:16px;height:16px;flex-shrink:0}
    .auth-card .error{color:var(--danger);font-size:13px;margin-top:10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:8px 12px}

    /* Dashboard */
    #dashboard{display:none;min-height:100vh}
    .dash-header{background:rgba(10,15,30,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .dash-header h2{font-size:16px;font-weight:800;letter-spacing:-.2px}
    .dash-brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1 1 auto}
    .dash-header .user-info{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text2)}
    .dash-header .logout-btn{padding:7px 14px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:10px;font-size:12px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
    .dash-header .logout-btn:hover{border-color:var(--danger);color:var(--danger)}
    .dash-header .logout-btn svg{width:15px;height:15px;flex-shrink:0}
    .dash-body{display:flex;min-height:calc(100vh - 53px)}
    .sidebar{width:224px;background:rgba(17,26,48,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-inline-end:1px solid var(--border);padding:14px 0;flex-shrink:0;overflow-y:auto}
    .sidebar button{display:flex;align-items:center;gap:11px;width:100%;text-align:start;padding:10px 18px;background:none;color:var(--text2);border:none;font-size:13px;font-weight:600;border-inline-start:3px solid transparent;transition:color .15s,background .15s}
    .sidebar button svg{width:18px;height:18px;flex-shrink:0}
    .sidebar button:hover{background:rgba(148,163,184,.08);color:var(--text)}
    .sidebar button:hover svg{color:var(--accent)}
    .sidebar button.active{background:linear-gradient(90deg,rgba(249,115,22,.16),transparent);color:var(--text);border-inline-start-color:var(--accent)}
    .sidebar button.active svg{color:var(--accent)}
    .main-content{flex:1;padding:26px;overflow-y:auto}
    .main-content>div{animation:fadeUp .35s ease both}
    .main-content h3{font-size:19px;font-weight:800;margin-bottom:18px;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
    .main-content h4{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--text2)}

    /* Cards & Tables */
    .card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:0 8px 24px -16px rgba(0,0,0,.5);transition:border-color .2s,box-shadow .2s}
    .card:hover{border-color:var(--border2);box-shadow:0 14px 34px -18px rgba(0,0,0,.6)}
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:16px;border:1px solid var(--border);border-radius:14px;background:rgba(10,15,30,.25)}
    .table-wrap table{margin-bottom:0}
    .card-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .card-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
    .outlet-row{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:10px;align-items:end;padding:14px;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;background:var(--card2)}
    .outlet-del{align-self:end;height:36px;width:36px;justify-content:center}
    .checkbox{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;user-select:none;transition:color .15s}
    .checkbox:hover{color:var(--text)}
    .allergen-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .allergen-cell{padding:9px 12px;border:1px solid var(--border);border-radius:12px;background:var(--card2)}
    @media (max-width:520px){.allergen-grid{grid-template-columns:1fr}}

    /* Store location (P3.1) */
    .loc-tools{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:12px}
    .loc-tools input{min-width:0}
    .shop-map{height:320px;border-radius:14px;border:1px solid var(--border);overflow:hidden;position:relative;z-index:0;box-shadow:0 10px 30px -18px rgba(0,0,0,.6)}
    .shop-map .leaflet-container{font-family:'Cairo','Inter',system-ui,sans-serif}
    .shop-map .leaflet-control-attribution{font-size:9px}
    .loc-pin-row{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
    .loc-pin-coord{font-size:12px;color:var(--text2)}
    .loc-pin-coord b{color:var(--text);font-family:ui-monospace,monospace}
    .loc-fallback{padding:20px;text-align:center;color:var(--text2);font-size:13px}
    .dl-inline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .dl-inline svg{width:13px;height:13px;flex-shrink:0}
    @media (max-width:520px){.loc-tools{grid-template-columns:1fr}}

    /* Variant editor (P1.6) */
    .var-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
    .var-row{display:grid;grid-template-columns:1fr 1fr 30px;gap:6px;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px}
    .var-row input{width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:rgba(10,15,30,.55);font-size:12.5px;color:var(--text);min-width:0}
    .var-prices{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .mv-del{width:30px;height:30px;border-radius:8px;background:var(--card2);border:1px solid var(--border2);color:var(--text2);cursor:pointer;font-size:13px;transition:all .15s}
    .mv-del:hover{border-color:var(--danger);color:var(--danger);transform:scale(1.05)}
    .mv-del svg{width:14px;height:14px}
    .btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}

    /* Hours editor (P1.11) */
    .hours-list{display:flex;flex-direction:column;gap:8px}
    .hours-row{display:grid;grid-template-columns:1fr 96px 20px 96px;gap:8px;align-items:center;padding:10px 12px;background:var(--card2);border:1px solid var(--border);border-radius:12px}
    .hours-day{font-size:12.5px;font-weight:700;color:var(--text2)}
    .hours-row input{width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:8px;background:rgba(10,15,30,.55);font-size:12.5px;color:var(--text);min-width:0;font-family:inherit}
    .hours-sep{text-align:center;color:var(--text3);font-size:13px}
    @media (max-width:520px){.hours-row{grid-template-columns:1fr 88px 16px 88px;gap:6px}}
    .checkbox input{accent-color:var(--accent);width:16px;height:16px}
    .field{margin-bottom:14px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:start;padding:11px 16px;color:var(--text2);font-weight:600;border-bottom:1px solid var(--border);background:rgba(148,163,184,.05);white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
    td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
    tbody tr{transition:background .12s}
    tbody tr:hover td{background:rgba(249,115,22,.05)}
    tbody tr:last-child td{border-bottom:none}

    /* Buttons */
    .btn{padding:9px 16px;border:none;border-radius:10px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
    .btn svg{width:15px;height:15px;flex-shrink:0}
    .btn:active{transform:scale(.97)}
    .btn-primary{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;box-shadow:0 8px 20px -10px rgba(249,115,22,.55)}
    .btn-primary:hover{box-shadow:0 12px 26px -10px rgba(249,115,22,.65)}
    .btn-success{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 8px 20px -10px rgba(34,197,94,.5)}
    .btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 8px 20px -10px rgba(239,68,68,.5)}
    .btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
    .btn-ghost:hover{color:var(--text);border-color:var(--accent)}
    .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
    .btn-group{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}

    /* Item toolbar (search / filter / sort) */
    .item-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
    .item-toolbar .item-search{flex:1;min-width:180px}
    .item-toolbar select{min-width:120px;flex:0 1 auto}
    .item-count{font-size:12px;color:var(--text2);margin-inline-start:auto;white-space:nowrap;font-weight:600}

    /* Orders tab */
    .order-lines{display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:1.55;color:var(--text2);min-width:160px}
    .order-lines .ln{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
    .order-lines .lname{flex:1;min-width:0}
    .order-lines .off .lname{color:var(--success)}
    .order-lines .neg{color:var(--success);white-space:nowrap;font-weight:700}
    .order-id{font-weight:800;color:var(--accent);font-size:13px;white-space:nowrap}
    .order-note-inline{font-style:italic;color:var(--text3);margin-top:4px;max-width:220px;overflow-wrap:break-word}

    /* Reviews tab (P2.9) */
    .rev-summary{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch;margin-bottom:16px}
    .rev-stat{flex:1 1 180px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;backdrop-filter:blur(8px)}
    .rev-stat .v{font-size:28px;font-weight:900;background:linear-gradient(135deg,#fb923c,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
    .rev-stat .l{font-size:12px;color:var(--text2);margin-top:3px;font-weight:600}
    .rev-stars{color:#f5b301;letter-spacing:2px;font-size:14px}
    .rev-stars .off{color:var(--bg3)}
    .rev-bars{flex:2 1 280px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(8px)}
    .rev-bar-row{display:grid;grid-template-columns:34px 1fr 44px;gap:10px;align-items:center;font-size:12px;color:var(--text2);font-weight:600}
    .rev-bar-track{height:8px;border-radius:6px;background:var(--bg3);overflow:hidden}
    .rev-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#f97316,#fb923c);transition:width .6s ease}
    .rev-comment{white-space:pre-wrap;overflow-wrap:break-word;max-width:340px;color:var(--text)}
    .rev-date{color:var(--text3);font-size:12px;white-space:nowrap}

    /* Usage & Alerts board */
    .usage-bar{height:10px;border-radius:6px;background:var(--bg3);overflow:hidden;margin:4px 0 6px;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
    .usage-fill{height:100%;border-radius:6px;transition:width .5s ease}
    .usage-pct{font-size:12px;font-weight:800}
    .alert{padding:10px 14px;border-radius:12px;font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:flex-start;gap:8px;animation:fadeUp .3s ease both}
    .alert.ok{background:rgba(34,197,94,.1);color:#34d399;border:1px solid rgba(34,197,94,.3)}
    .alert.warning{background:rgba(245,158,11,.1);color:#fbbf24;border:1px solid rgba(245,158,11,.35)}
    .alert.critical{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.4)}

    /* Deal modal dynamic fields */
    .deal-fields{display:none}
    .bundle-pick{display:flex;flex-wrap:wrap;gap:8px}
    .bundle-pick label.chip{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);border:1px solid var(--border2);border-radius:20px;padding:7px 14px;cursor:pointer;background:var(--card2);transition:all .15s}
    .bundle-pick label.chip input{width:auto}
    .bundle-pick label.chip:hover{border-color:var(--accent)}
    .bundle-pick label.chip:has(input:checked){background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;border-color:transparent;box-shadow:0 6px 16px -8px rgba(249,115,22,.7)}
    .deal-note{font-size:12px;color:var(--text2);margin:-6px 0 10px}
    .deal-preview{margin:12px 0 4px;padding:12px 14px;border:1px dashed var(--border2);border-radius:14px;background:var(--card2);display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
    .deal-preview.muted{color:var(--text2);border-style:solid}
    .deal-preview .dp-ex{font-size:11px;color:var(--text2);width:100%}
    .deal-preview .dp-cell{display:flex;flex-direction:column;gap:2px}
    .deal-preview .dp-cell small{font-size:10.5px;color:var(--text2)}
    .deal-preview .dp-strike{text-decoration:line-through;color:var(--text2);font-weight:600}
    .deal-preview .dp-new b{color:var(--accent2);font-size:15px}
    .deal-preview .dp-arrow{color:var(--text3)}
    .deal-preview .dp-save{background:rgba(16,185,129,.12);color:#10b981;font-weight:800;border-radius:10px;padding:3px 8px}

    /* Language toggle */
    .auth-lang-row{display:flex;justify-content:flex-end;margin-bottom:10px}
    .lang-btn{padding:5px 14px;border:1px solid var(--border2);border-radius:20px;background:transparent;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
    .lang-btn:hover{color:var(--text);border-color:var(--accent);transform:translateY(-1px)}
    .lang-btn svg{width:14px;height:14px;flex-shrink:0}

    /* Toggle */
    .toggle{position:relative;width:40px;height:22px;display:inline-block;flex-shrink:0}
    .toggle input{opacity:0;width:0;height:0}
    .toggle .slider{position:absolute;inset:0;background:var(--bg3);border-radius:11px;cursor:pointer;transition:.25s}
    .toggle .slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s}
    .toggle input:checked+.slider{background:linear-gradient(135deg,#22c55e,#16a34a)}
    .toggle input:checked+.slider::before{transform:translateX(18px)}

    /* Currency chips */
    .currency-chips{display:flex;gap:6px;flex-wrap:wrap}
    .currency-chip{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid var(--border2);color:var(--text2);cursor:pointer;transition:.15s}
    .currency-chip:hover{border-color:var(--accent);color:var(--text)}
    .currency-chip.on{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;border-color:transparent;box-shadow:0 5px 14px -8px rgba(249,115,22,.7)}

    /* Toast */
    .toast{position:fixed;bottom:22px;right:22px;background:var(--bg2);border:1px solid rgba(34,197,94,.45);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;opacity:0;transform:translateY(16px);transition:.3s;pointer-events:none;box-shadow:0 14px 36px -12px rgba(0,0,0,.6);display:flex;align-items:center;gap:8px;max-width:min(92vw,360px)}
    .toast.show{opacity:1;transform:translateY(0)}
    .toast.error{background:var(--bg2);border-color:rgba(239,68,68,.5)}
    .toast svg{width:17px;height:17px;flex-shrink:0}
    .toast.ok{color:#f4f6fb}
    .toast .ok-ic{color:var(--success)}
    .toast.error .err-ic{color:var(--danger)}

    /* Empty state */
    .empty{text-align:center;padding:48px 24px;color:var(--text3);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(5,8,18,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease both}
    .modal{background:linear-gradient(180deg,rgba(28,39,66,.92),rgba(17,26,48,.96));border:1px solid var(--border2);border-radius:18px;padding:26px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 28px 70px -18px rgba(0,0,0,.7);animation:popIn .28s cubic-bezier(.34,1.4,.64,1) both}
    .modal h3{margin-bottom:18px;font-size:17px;font-weight:800}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}

    /* Loading */
    .spinner{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Motion */
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes popIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
    }

    /* Mobile tab bar */
    .mobile-tabs{display:none;background:rgba(10,15,30,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:8px;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;position:static}

    .mobile-tabs button:hover{border-color:var(--accent)}

    /* Responsive */
    @media(max-width:768px){
      .sidebar{display:none}
      .mobile-tabs{display:flex;position:sticky;top:var(--header-h,104px);z-index:90}
      .dash-body{flex-direction:column}
      .main-content{padding:16px;overflow-x:hidden}
      .card-row,.card-row-3{grid-template-columns:1fr}
      .outlet-row{grid-template-columns:1fr 1fr}

      /* Header wraps to two tidy rows on phones (title on top, actions below) */
      .dash-header{flex-wrap:wrap;gap:6px;padding:10px 16px}
      .dash-header h2{width:100%;font-size:15px}
      .dash-header .user-info{justify-content:flex-end;flex-wrap:wrap;gap:10px}
      .dash-header .logout-btn{padding:8px 14px}
      .lang-btn{padding:6px 14px}
      :root{--header-h:104px}

      /* Prevent iOS auto-zoom on small inputs */
      input,select,textarea{font-size:16px}

      /* Tables become stacked cards */
      .table-wrap{overflow:visible;margin-bottom:12px}
      .table-wrap table,.table-wrap thead,.table-wrap tbody,.table-wrap tr,.table-wrap td{display:block}
      .table-wrap thead{display:none}
      .table-wrap tbody{display:flex;flex-direction:column;gap:12px}
      .table-wrap tr{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:4px 14px}

      .table-wrap td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:none;padding:9px 0;font-size:15px}
      .table-wrap td::before{content:attr(data-label);font-size:11px;font-weight:600;color:var(--text2);flex-shrink:0;letter-spacing:.3px}
      .table-wrap td:last-child{justify-content:flex-start;flex-wrap:wrap}
      .table-wrap td:last-child::before{width:100%;margin-bottom:2px}
      .table-wrap td.empty{display:flex;justify-content:center;padding:26px;font-size:14px;color:var(--text3)}
      .table-wrap td.empty::before{content:none}

      /* Touch-friendly buttons + full-width modal */
      .btn{padding:10px 16px;min-height:42px}
      .btn-sm{min-height:38px;padding:8px 14px;font-size:13px}
      .modal-overlay{padding:12px}

      .item-toolbar input,.item-toolbar select{flex:1 1 100%}
      .item-count{margin-inline-start:0}

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t('app_title');
  const header = document.querySelector('.dash-header');
  if (header && header.getBoundingClientRect().height > 0) document.documentElement.style.setProperty('--header-h', (Math.round(header.getBoundingClientRect().height) + 1) + 'px');
  const langBtns = ['auth-lang-btn', 'dash-lang-btn'];
  langBtns.forEach(id => { const b = document.getElementById(id); if (b) b.innerHTML = '<i data-lucide="globe"></i><span>' + (lang === 'ar' ? 'EN' : 'AR') + '</span>'; });

  const t1 = document.getElementById('auth-title');   if (t1) t1.textContent = t('app_title');
  const t2 = document.getElementById('auth-sub');     if (t2) t2.textContent = t('auth_sub');
  const t3 = document.getElementById('auth-email-label'); if (t3) t3.textContent = t('email');
  const t4 = document.getElementById('dash-title');   if (t4) t4.textContent = t('app_title');

  const t6 = document.getElementById('logout-btn');   if (t6) t6.innerHTML = '<i data-lucide="log-out"></i> ' + t('logout');

  if (document.getElementById('dashboard').style.display === 'block' && currentTab && currentShop) showTab(currentTab);

// ─── AUTH ───────────────────────────────────────────────────
// Interim email-only login: the edge function verifies the email server-side
// against the shop owner, mints a magic-link token, exchanges it server-side,
// and hands back a ready access/refresh pair — no email is ever sent.
// This creates a real Supabase session (auth.email() = typed email) so RLS works.
async function loginWithEmail() {
  const email = document.getElementById('auth-email').value.trim();
  if (!email) return showAuthError(t('enter_admin_email'));
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> ' + t('signing_in');
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-login-gate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t('login_failed'));
    const { error } = await sb.auth.setSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Math.floor(Date.now() / 1000) + (data.expires_in || 3600),
    });
    if (error) throw new Error(error.message);
    currentUser = (await sb.auth.getSession()).data.session?.user;
    if (!currentUser) throw new Error(t('session_not_created'));
    showDashboard();
    return;
  } catch (e) {
    showAuthError(e.message || t('login_failed'));
  }
  btn.disabled = false; btn.innerHTML = t('login');
}

function showAuthError(msg) {
  const map = {
    'This email is not the admin': { en: 'This email is not the admin', ar: 'هذا البريد الإلكتروني ليس بريد المشرف' },
    'Email address is required':   { en: 'Email address is required', ar: 'البريد الإلكتروني مطلوب' }
  };
  document.getElementById('auth-error').textContent = (map[msg] && map[msg][lang]) || msg;
}

// Enter key support
document.getElementById('auth-email').addEventListener('keydown', e => { if (e.key === 'Enter') loginWithEmail(); });

// ─── INIT ───────────────────────────────────────────────────
(async () => {
  // A sign-in link from Supabase may land here with ?token= (magic link) or ?code= (PKCE)
  const params = new URLSearchParams(window.location.search);
  const urlToken = params.get('token');
  const urlCode = params.get('code');
  let session = null;
  try {
    if (urlToken) {
      const type = params.get('type') || 'magiclink';
      const email = params.get('email') || '';
      const { error } = await sb.auth.verifyOtp({ email, token: urlToken, type });
      if (error) showAuthError(error.message);
      else session = (await sb.auth.getSession()).data.session;
    } else if (urlCode) {
      const { error } = await sb.auth.exchangeCodeForSession(urlCode);
      if (error) showAuthError(error.message);
      else session = (await sb.auth.getSession()).data.session;
    } else {
      session = (await sb.auth.getSession()).data.session;
    }
  } catch (e) { showAuthError(e.message); }
  if (session?.user) {
    currentUser = session.user;
    showDashboard();
  }
  if (urlToken || urlCode) history.replaceState(null, '', location.pathname + location.hash);
})();

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session?.user) {
    currentUser = session.user;
    showDashboard();
  }
});

async function logout() {
  await sb.auth.signOut();
  currentUser = null; currentShop = null;
  dashboardPromise = null;
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  applyLang();
}

// ─── DASHBOARD ──────────────────────────────────────────────
let dashboardPromise = null;
async function showDashboard() {
  // loginWithEmail + onAuthStateChange(SIGNED_IN) can race and both reach the
  // "no shop yet → create" branch, producing duplicate default shops. Serialize.
  if (dashboardPromise) return dashboardPromise;
  dashboardPromise = (async () => {
  applyLang();
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('user-email').textContent = currentUser.email;

  // Restore the persisted tab's highlight synchronously — BEFORE any await — so a
  // refresh never flashes back to the first (hardcoded-active) tab while shop data
  // is still loading. The real content render happens at the end via showTab(savedTab).
  // (Edited: the previously hardcoded-first-tab flash on every refresh is gone.)
  const dashTabs = ['shop', 'categories', 'items', 'deals', 'badges', 'allergens', 'orders', 'reviews', 'currencies', 'usage'];
  let savedTab = 'orders';
  try {
    const st = localStorage.getItem('qm-admin-tab');
    if (st && dashTabs.includes(st)) savedTab = st;
  } catch (e) {}
  document.querySelectorAll('.sidebar button, .mobile-tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === savedTab));

  // Load or create shop
  const { data: shops } = await sb.from('shops').select('*').eq('owner_email', currentUser.email).limit(1);
  if (!shops || shops.length === 0) {
    // Create default shop for this email
    const { data: newShop } = await sb.from('shops').insert({
      owner_email: currentUser.email,
      name: 'My Shop',
      name_ar: 'متجري',
      whatsapp: '',
      currency_default: 'SYP',
      currencies: ['SYP', 'USD', 'TRY']
    }).select().single();
    currentShop = newShop;
  } else {
    currentShop = shops[0];
  }

  // Load categories
  const { data: cats } = await sb.from('categories').select('*').eq('shop_id', currentShop.id).order('sort_order');
  allCategories = cats || [];

  // Load items with prices
  const { data: items } = await sb.from('items').select('*, item_prices(*)').eq('shop_id', currentShop.id).order('sort_order');
  allItems = items || [];

  // Load outlets (P2.8)
  const { data: outs } = await sb.from('outlets').select('*').eq('shop_id', currentShop.id).order('sort_order');
  allOutlets = outs || [];

  // Load badge + allergen catalogs (P3)
  const { data: badges } = await sb.from('shop_badges').select('*').eq('shop_id', currentShop.id).order('sort_order');
  allShopBadges = badges || [];
  const { data: allgs } = await sb.from('shop_allergens').select('*').eq('shop_id', currentShop.id).order('sort_order');
  allShopAllergens = allgs || [];

  // Nav highlight was already restored synchronously at the top (before the awaits)
  // so the first paint shows the saved tab — no flash to the hardcoded-first tab.
  // Now render the actual tab content; showTab re-applies the highlight harmlessly.
  showTab(savedTab);
  })();
  return dashboardPromise;
}

// ─── TABS ───────────────────────────────────────────────────
let tabRenderNonce = 0; // guards slow async tab renders from overwriting a newer tab
function showTab(tab) {
  currentTab = tab;
  try { localStorage.setItem('qm-admin-tab', tab); } catch (e) {}
  const nonce = ++tabRenderNonce;
  document.querySelectorAll('.sidebar button, .mobile-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const c = document.getElementById('main-content');
  const header = document.querySelector('.dash-header');
  if (header && header.getBoundingClientRect().height > 0)
    document.documentElement.style.setProperty('--header-h', (Math.round(header.getBoundingClientRect().height) + 1) + 'px');
  switch(tab) {
    case 'shop': c.innerHTML = renderShopTab(); shopLocInit(); break;
    case 'categories': c.innerHTML = renderCategoriesTab(); break;
    case 'items': c.innerHTML = renderItemsTab(); renderItemRows(); break;
    case 'deals': c.innerHTML = `<div class="empty">${t('loading_deals')}</div>`; renderDealsTab().then(html => { if (nonce === tabRenderNonce) c.innerHTML = html; }); break;
    case 'badges': c.innerHTML = renderBadgesTab(); break;
    case 'allergens': c.innerHTML = renderAllergensTab(); break;
    case 'orders': c.innerHTML = `<div class="empty">${t('loading_orders')}</div>`; renderOrdersTab().then(html => { if (nonce === tabRenderNonce) c.innerHTML = html; }); break;
    case 'reviews': c.innerHTML = `<div class="empty">${t('loading_reviews')}</div>`; renderReviewsTab().then(html => { if (nonce === tabRenderNonce) c.innerHTML = html; }); break;
    case 'currencies': c.innerHTML = renderCurrenciesTab(); break;
    case 'usage': c.innerHTML = renderUsageTab(); loadUsageStats(); break;
  }
}

async function saveShop() {
  const latRaw = (document.getElementById('s-lat')?.value || '').trim();
  const lngRaw = (document.getElementById('s-lng')?.value || '').trim();
  const updates = {
    name: gv('s-name'), name_ar: gv('s-name-ar'),
    tagline: gv('s-tagline'), tagline_ar: gv('s-tagline-ar'),
    logo_url: gv('s-logo'),
    whatsapp: gv('s-whatsapp'), phone: gv('s-phone'), email: gv('s-email'),
    address: gv('s-address'), address_ar: gv('s-address-ar'),
    location_lat: latRaw ? parseFloat(latRaw) : null,
    location_lng: lngRaw ? parseFloat(lngRaw) : null,
    about: gv('s-about'), about_ar: gv('s-about-ar'),
    instagram: gv('s-instagram'), facebook: gv('s-facebook'), tripadvisor: gv('s-tripadvisor'),
    legal_note: gv('s-legal-note'), legal_note_ar: gv('s-legal-note-ar'),
    wifi_name: gv('s-wifi-name'), wifi_pass: gv('s-wifi-pass'),
    hours: collectHours(),
    primary_color: gv('s-color'), accent_color: gv('s-accent'),
    footer_text: gv('s-footer'),
    currency_default: gv('s-default-currency'),
    show_currency_selector: document.getElementById('s-show-currency').checked
  };
  const { error } = await sb.from('shops').update(updates).eq('id', currentShop.id);
  if (error) return toast(t('error') + ': ' + error.message, true);
  Object.assign(currentShop, updates);
  // P2.8: persist outlet rows (insert/update/delete) after the shop row
  const outErr = await saveOutlets();
  if (outErr) return toast(t('error') + ': ' + outErr.message, true);
  toast(t('shop_settings_saved'));
}

// P3.1 — store location map (Leaflet + OSM tiles + Nominatim)
let shopMap = null, shopMarker = null;

function shopLocInit() {
  const el = document.getElementById('shop-map');
  if (!el) return;
  if (shopMap) { shopMap.remove(); shopMap = null; shopMarker = null; }
  const lat = parseFloat(document.getElementById('s-lat')?.value) || 33.5138;
  const lng = parseFloat(document.getElementById('s-lng')?.value) || 36.2765;
  if (!window.L) { el.innerHTML = `<div class="loc-fallback">${t('map_unavailable')}</div>`; return; }
  shopMap = L.map(el, { attributionControl: true }).setView([lat, lng], 16);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(shopMap);
  if (document.getElementById('s-lat').value) {
    shopMarker = L.marker([lat, lng], { draggable: true }).addTo(shopMap);
    shopMarker.on('dragend', () => shopLocPicked(shopMarker.getLatLng()));
  }
  shopMap.on('click', e => shopLocPicked(e.latlng));
  setTimeout(() => { if (shopMap) shopMap.invalidateSize(); }, 250);
}

function shopLocPicked(ll) {
  const latEl = document.getElementById('s-lat'), lngEl = document.getElementById('s-lng');
  if (!latEl || !lngEl || !shopMap || !window.L) return;
  latEl.value = ll.lat.toFixed(6); lngEl.value = ll.lng.toFixed(6);
  const latTxt = document.getElementById('s-lat-txt'), lngTxt = document.getElementById('s-lng-txt');
  if (latTxt) latTxt.textContent = ll.lat.toFixed(5);
  if (lngTxt) lngTxt.textContent = ll.lng.toFixed(5);
  if (!shopMarker) {
    shopMarker = L.marker(ll, { draggable: true }).addTo(shopMap);
    shopMarker.on('dragend', () => shopLocPicked(shopMarker.getLatLng()));
  } else {
    shopMarker.setLatLng(ll);
  }
  shopLocReverse(ll.lat, ll.lng);
}

async function shopLocReverse(lat, lng) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=ar,en`);
    const j = await r.json();
    const nm = j.display_name || '';
    if (!nm) return;
    const a = document.getElementById('s-address'), ar = document.getElementById('s-address-ar');
    if (a && !a.value.trim()) a.value = nm;
    if (ar && !ar.value.trim()) ar.value = nm;
  } catch (e) { /* reverse geocode is non-critical */ }
}

async function shopLocSearch() {
  const q = (document.getElementById('s-loc-search')?.value || '').trim();
  if (!q || !window.L) return;
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    const j = await r.json();
    if (j && j[0]) shopLocPicked({ lat: parseFloat(j[0].lat), lng: parseFloat(j[0].lon) });
    else toast(t('no_results'), true);
  } catch (e) { toast(t('geo_fail'), true); }
}

function shopLocGeolocate() {
  if (!window.L) return;
  if (!navigator.geolocation) return toast(t('geo_fail'), true);
  navigator.geolocation.getCurrentPosition(
    p => shopLocPicked({ lat: p.coords.latitude, lng: p.coords.longitude }),
    () => toast(t('geo_denied'), true),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function shopLocClear() {
  document.getElementById('s-lat').value = '';
  document.getElementById('s-lng').value = '';
  const latTxt = document.getElementById('s-lat-txt'), lngTxt = document.getElementById('s-lng-txt');
  if (latTxt) latTxt.textContent = t('pin_not_set');
  if (lngTxt) lngTxt.textContent = t('pin_not_set');
  if (shopMarker && shopMap) { shopMap.removeLayer(shopMarker); shopMarker = null; }
}

function outletsEditorRows(list) {
  if (!list || list.length === 0) {
    return `<p style="font-size:12px;color:var(--text2)">${t('outlets_hint')}</p>`;

      <div class="field"><label>${t('outlet_name_ar')}</label><input class="o-name-ar" value="${esc(o.name_ar || '')}" dir="rtl"></div>
      <div class="field"><label>${t('outlet_whatsapp')}</label><input class="o-wa" value="${esc(o.whatsapp || '')}" dir="ltr" placeholder="963..."></div>
      <div class="field"><label>${t('outlet_active')}</label>
        <label class="toggle" style="margin-top:4px"><input type="checkbox" class="o-active" ${o.is_active ? 'checked' : ''}><span class="slider"></span></label>
      </div>
      <button class="btn btn-danger outlet-del" type="button" onclick="removeOutletRow(this)" title="${t('outlet_remove')}"><i data-lucide="x"></i></button>
    </div>`).join('');

function addOutletRow() {
  const wrap = document.getElementById('s-outlets');
  const empty = document.querySelector('#s-outlets p');
  if (empty) empty.remove();
  wrap.insertAdjacentHTML('beforeend', outletsEditorRows([{ id: '', name: '', name_ar: '', whatsapp: '', is_active: true }]));
}
function removeOutletRow(btn) {
  const row = btn.closest('.outlet-row');
  const oid = row?.dataset?.oid;
  if (oid) removedOutletIds.push(oid);
  row?.remove();
  const wrap = document.getElementById('s-outlets');
  if (!wrap.querySelector('.outlet-row')) {
    wrap.innerHTML = `<p style="font-size:12px;color:var(--text2)">${t('outlets_hint')}</p>`;
  }
}
let outletsSaving = false;
async function saveOutlets() {
  if (outletsSaving) return null; // guard double-click while inserts are in flight
  outletsSaving = true;
  try {
    const rows = [...document.querySelectorAll('#s-outlets .outlet-row')];
    let idx = 0;
    for (const row of rows) {
      const name = row.querySelector('.o-name').value.trim();
      const name_ar = row.querySelector('.o-name-ar').value.trim();
      const whatsapp = row.querySelector('.o-wa').value.trim();
      if (!name && !name_ar) continue; // skip blank rows
      const payload = { name, name_ar, whatsapp, is_active: row.querySelector('.o-active').checked, sort_order: idx++ };
      const id = row.dataset.oid || null;
      if (id) {
        const { error } = await sb.from('outlets').update(payload).eq('id', id);
        if (error) return error;
      } else {
        const { error } = await sb.from('outlets').insert({ ...payload, shop_id: currentShop.id });
        if (error) return error;
      }
    }
    for (const oid of removedOutletIds) {
      const { error } = await sb.from('outlets').delete().eq('id', oid);
      if (error) return error;
    }
    removedOutletIds = [];
    // Re-render rows so saved rows carry their DB ids (otherwise a later delete
    // of a just-added row is silently skipped because data-oid is empty).
    const { data: outs } = await sb.from('outlets').select('*').eq('shop_id', currentShop.id).order('sort_order');
    allOutlets = outs || [];
    const wrap = document.getElementById('s-outlets');
    if (wrap) wrap.innerHTML = outletsEditorRows(allOutlets);
    return null;
  } finally {
    outletsSaving = false;
  }
}

  const h = Array.isArray(s.hours) ? s.hours : [];
  return days.map((d, i) => {

function renderItemsTab() {
  return `

      </select>
      <select id="item-sort" onchange="itemSort=this.value; itemShown=${ITEM_PAGE}; renderItemRows();">
        <option value="order" ${itemSort==='order'?'selected':''}>${t('sort_order_asc')}</option>
        <option value="name" ${itemSort==='name'?'selected':''}>${t('sort_name')}</option>
        <option value="price_low" ${itemSort==='price_low'?'selected':''}>${t('sort_price_low')}</option>
        <option value="price_high" ${itemSort==='price_high'?'selected':''}>${t('sort_price_high')}</option>
      </select>
      <span class="item-count" id="item-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>${t('order')}</th><th>${t('name')}</th><th>${t('category')}</th><th>${t('available')}</th><th>${t('featured')}</th><th>${t('badges')}</th><th>${t('prices')}</th><th></th></tr></thead>
        <tbody id="items-tbody"></tbody>
      </table>
    </div>
    <div id="item-more-wrap" style="text-align:center"></div>
  `;
}

function filteredItems() {
  const q = itemQuery.trim().toLowerCase();
  let list = allItems.filter(i => {
    if (itemCat && i.category_id !== itemCat) return false;
    if (!q) return true;
    return [i.name, i.name_ar, i.description, i.description_ar].join(' ').toLowerCase().includes(q);
  });
  const priceOf = i => { const p = (i.item_prices || []).find(p => p.currency === currentShop.currency_default); return p ? Number(p.price) : 0; };
  if (itemSort === 'name') list = [...list].sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  else if (itemSort === 'price_low') list = [...list].sort((a, b) => priceOf(a) - priceOf(b));
  else if (itemSort === 'price_high') list = [...list].sort((a, b) => priceOf(b) - priceOf(a));
  else list = [...list].sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  return list;
}

function renderItemRows() {
  const tbody = document.getElementById('items-tbody');
  if (!tbody) return;
  const list = filteredItems();
  const slice = list.slice(0, itemShown);
  const count = document.getElementById('item-count');
  if (count) count.textContent = `${t('showing')} ${slice.length} ${t('of')} ${list.length}`;
  const more = document.getElementById('item-more-wrap');
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty">${t('no_match')}</td></tr>`;
    if (more) more.innerHTML = '';
    return;
  }
  tbody.innerHTML = slice.map(item => {
    const cat = allCategories.find(c => c.id === item.category_id);
    const prices = (item.item_prices || []).map(p => p.is_visible ? `${p.currency} ${p.price}` : `<s>${p.currency} ${p.price}</s>`).join(' · ');
    return `
      <tr>
        <td data-label="${t('order')}">${item.sort_order}</td>
        <td data-label="${t('name')}">${esc(item.name)}<br><small style="color:var(--text3)">${esc(item.name_ar)}</small></td>
        <td data-label="${t('category')}">${cat ? esc(cat.name) : '<span style="color:var(--text3)">—</span>'}</td>
        <td data-label="${t('available')}"><label class="toggle"><input type="checkbox" ${item.is_available?'checked':''} onchange="toggleItem('${item.id}','is_available',this.checked)"><span class="slider"></span></label></td>
        <td data-label="${t('featured')}"><label class="toggle"><input type="checkbox" ${item.is_featured?'checked':''} onchange="toggleItem('${item.id}','is_featured',this.checked)"><span class="slider"></span></label></td>
        <td data-label="${t('badges')}">
          ${[
            item.is_new ? `<span style="display:inline-block;background:var(--success);color:#000;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;margin:1px">${t('new_badge')}</span>` : '',
            item.popular ? `<span style="display:inline-block;background:var(--accent);color:#000;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;margin:1px">${t('popular')}</span>` : '',
            item.chef_choice ? `<span style="display:inline-block;background:#c026d3;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;margin:1px">${t('chef_choice')}</span>` : '',
            ...(item.custom_badges || []).map(bid => {
              const b = allShopBadges.find(x => x.id === bid);
              return b ? `<span style="display:inline-block;background:${esc(b.color)};color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;margin:1px">${esc(b.emoji || '')} ${esc(b.label)}</span>` : '';
            })
          ].join('') || '<span style="color:var(--text3)">—</span>'}
        </td>
        <td data-label="${t('prices')}" style="font-size:12px">${prices || '<span style="color:var(--text3)">—</span>'}</td>
        <td data-label="${t('actions')}">
          <button class="btn btn-ghost btn-sm" onclick="openItemModal('${item.id}')">${t('edit')}</button>
          <button class="btn btn-danger btn-sm" onclick="deleteItem('${item.id}')">${t('delete')}</button>
        </td>
      </tr>`;

    <button type="button" class="mv-del" title="${t('remove_variant') || 'Remove'}" onclick="this.closest('.var-row').remove()"><i data-lucide="x"></i></button>
    <div class="var-prices">
      <input class="mv-SYP" type="number" step="0.01" placeholder="SYP" value="${val('SYP')}">
      <input class="mv-USD" type="number" step="0.01" placeholder="USD" value="${val('USD')}">
      <input class="mv-TRY" type="number" step="0.01" placeholder="TRY" value="${val('TRY')}">
    </div>
  </div>`;
}
function addVariantRow() {
  const list = document.getElementById('m-variants');
  if (list) list.insertAdjacentHTML('beforeend', variantRowHTML(null));
  else openItemModal(currentItemId || null);
}
function collectVariants() {
  return [...document.querySelectorAll('.var-row')].map(r => {
    const name = r.querySelector('.mv-en').value.trim();
    const name_ar = r.querySelector('.mv-ar').value.trim();
    const prices = {};
    ['SYP', 'USD', 'TRY'].forEach(c => {
      const v = r.querySelector('.mv-' + c).value;
      if (v !== '') prices[c] = Number(v);
    });
    if (!name && !name_ar && Object.keys(prices).length === 0) return null;
    return { name, name_ar, prices };
  }).filter(Boolean);
}

async function saveItem(id) {
  const itemData = {
    name: gv('m-item-name'), name_ar: gv('m-item-name-ar'),
    description: gv('m-item-desc'), description_ar: gv('m-item-desc-ar'),
    category_id: gv('m-item-cat') || null,
    sort_order: parseInt(gv('m-item-sort')) || 0,
    image_url: gv('m-item-img'),
    kcal: gv('m-item-kcal') === '' ? null : parseInt(gv('m-item-kcal')),
    prep_time_min: gv('m-item-prep') === '' ? null : parseInt(gv('m-item-prep')),
    popular: document.getElementById('m-item-popular')?.checked ?? false,
    chef_choice: document.getElementById('m-item-chef')?.checked ?? false,
    is_new: document.getElementById('m-item-new')?.checked ?? false,
    custom_badges: [...document.querySelectorAll('#m-custom-badges-grid input:checked')].map(i => i.value),
    allergens: [...document.querySelectorAll('#m-allergens-grid input:checked')].map(i => i.value),
    variants: collectVariants(),
    shop_id: currentShop.id
  };

  let itemId = id;
  if (id) {
    const { error } = await sb.from('items').update(itemData).eq('id', id);
    if (error) return toast(t('error') + ': ' + error.message, true);
  } else {
    const { data, error } = await sb.from('items').insert(itemData).select().single();
    if (error) return toast(t('error') + ': ' + error.message, true);
    itemId = data.id;
  }

  // Upsert prices, then prune rows whose currency was removed or whose price was cleared
  const currencies = currentShop.currencies || ['SYP'];
  const { data: existingRows } = await sb.from('item_prices').select('*').eq('item_id', itemId);
  const existingByCur = {};
  (existingRows || []).forEach(r => { existingByCur[r.currency] = r; });
  for (const c of currencies) {
    const priceInput = document.getElementById(`m-price-${c}`);
    const visInput = document.getElementById(`m-price-vis-${c}`);
    if (!priceInput) continue;
    const price = parseFloat(priceInput.value);
    const isVisible = visInput?.checked ?? true;
    if (price > 0) {
      await sb.from('item_prices').upsert({
        item_id: itemId, currency: c, price, is_visible: isVisible
      }, { onConflict: 'item_id,currency' });
    } else if (existingByCur[c]) {
      // Price cleared in the editor → delete the row instead of writing a misleading 0
      await sb.from('item_prices').delete().eq('item_id', itemId).eq('currency', c);
    }
  }
  // Remove orphan price rows for currencies that are no longer enabled on the shop
  for (const r of (existingRows || [])) {
    if (!currencies.includes(r.currency)) {
      await sb.from('item_prices').delete().eq('item_id', itemId).eq('currency', r.currency);
    }
  }

  closeModal();
  // Reload items
  const { data: items } = await sb.from('items').select('*, item_prices(*)').eq('shop_id', currentShop.id).order('sort_order');
  allItems = items || [];
  showTab('items');
  toast(id ? t('item_updated') : t('item_created'));
}

async function toggleItem(id, field, val) {
  const { error } = await sb.from('items').update({ [field]: val }).eq('id', id);
  if (error) return toast(t('error') + ': ' + error.message, true);
  const item = allItems.find(x => x.id === id);
  if (item) item[field] = val;
}

async function deleteItem(id) {
  if (!confirm(t('delete_item_q'))) return;
  const { error } = await sb.from('items').delete().eq('id', id);
  if (error) return toast(t('error') + ': ' + error.message, true);
  allItems = allItems.filter(i => i.id !== id);
  showTab('items');
  toast(t('item_deleted'));
}

// ─── DEALS ──────────────────────────────────────────────────
function dealLabel(d) {
  const c = d.currency || currentShop.currency_default || 'SYP';
  switch (d.deal_type) {
    case 'percent': return `-${d.discount_value}%`;
    case 'fixed':   return `-${d.discount_value} ${c}`;
    case 'bogo':    return `${d.buy_qty || 1} + ${d.get_qty || 1}`;
    case 'bundle':  return `${(d.bundle_items || []).length}x ${d.bundle_price} ${c}`;
    case 'min_order': return d.reward_type === 'percent'
      ? `≥${d.min_total} → -${d.discount_value}%`
      : `≥${d.min_total} → -${d.discount_value} ${c}`;
    default: return d.discount_type === 'percent' ? `-${d.discount_value}%` : `-${d.discount_value} ${c}`;
  }
}

function dealScopeLine(d) {
  if (d.applies_to === 'item') {
    const it = allItems.find(i => i.id === d.item_id);
    return it ? t('scope_item') + ': ' + (it.name || '') : t('scope_item');
  }
  if (d.applies_to === 'category') {
    const cat = allCategories.find(i => i.id === d.category_id);
    return cat ? t('scope_category') + ': ' + (cat.name || '') : t('scope_category');
  }
  return t('scope_all');
}

function dealTypeChanged() {

  const fields = {
    percent: ['percent', 'scope'], fixed: ['fixed', 'scope'],
    bogo: ['bogo'], bundle: ['bundle'], min_order: ['min_order']
  };
  document.querySelectorAll('#m-deal-fields .deal-fields').forEach(el => {
    const show = fields[type] && fields[type].includes(el.dataset.dt);
    el.style.display = show ? 'block' : 'none';
  });
  updateDealPreview();
}

function dealScopeChanged() {
  const scope = gv('m-deal-scope');
  document.getElementById('m-deal-item-wrap').style.display = scope === 'item' ? 'block' : 'none';
  document.getElementById('m-deal-cat-wrap').style.display = scope === 'category' ? 'block' : 'none';

// ─── DEAL PRICE PREVIEW (price after discount) ────────────
function adminItemPrice(id, cur) {
  const it = allItems.find(i => i.id === id);
  if (!it) return 0;
  const p = (it.item_prices || []).find(p => p.currency === cur && p.is_visible);
  return p ? (Number(p.price) || 0) : 0;
}
function pfmt(n) {
  return (Math.round(Number(n) * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 0 });
}
function dealPreviewPair(t, orig, np, cur, ok, example) {
  if (!ok) return `<div class="deal-preview muted">${t('preview_hint')}</div>`;
  const o = Number(orig) || 0, n = Number(np) || 0;
  const save = Math.max(o - n, 0);
  return `
    <div class="deal-preview">
      ${example ? `<span class="dp-ex">${t('preview_example')}</span>` : ''}
      <span class="dp-cell"><small>${t('orig_price')}</small><b class="dp-strike">${pfmt(o)} ${cur}</b></span>
      <span class="dp-arrow">→</span>
      <span class="dp-cell dp-new"><small>${t('new_price')}</small><b>${pfmt(n)} ${cur}</b></span>
      ${save > 0 ? `<span class="dp-save">−${pfmt(save)} ${cur}</span>` : ''}
    </div>`;
}
function updateDealPreview() {
  const el = document.getElementById('m-deal-preview');
  if (!el) return;
  const dt = gv('m-deal-type') || 'percent';
  const defCur = currentShop.currency_default || 'SYP';
  if (dt === 'bundle') {
    const cur = gv('m-deal-bundle-currency') || defCur;
    const ids = dealBundleItems();
    const orig = ids.reduce((s, id) => s + adminItemPrice(id, cur), 0);
    const np = parseFloat(gv('m-deal-bundle-price')) || 0;
    el.innerHTML = dealPreviewPair(t, orig, np, cur, ids.length > 0 && np > 0, false);
  } else if (dt === 'bogo') {
    const u = adminItemPrice(gv('m-deal-item-list'), defCur);
    const buy = parseInt(gv('m-deal-buy')) || 1, get = parseInt(gv('m-deal-get')) || 1;
    el.innerHTML = dealPreviewPair(t, (buy + get) * u, buy * u, defCur, !!gv('m-deal-item-list') && u > 0, false);
  } else if (dt === 'percent') {
    const v = Math.min(parseFloat(gv('m-deal-percent-value')) || 0, 100);
    const orig = 100000;
    el.innerHTML = dealPreviewPair(t, orig, orig * (1 - v / 100), defCur, v > 0, true);
  } else if (dt === 'fixed') {
    const cur = gv('m-deal-fixed-currency') || defCur;
    const v = parseFloat(gv('m-deal-fixed-value')) || 0;
    const orig = 100000;
    el.innerHTML = dealPreviewPair(t, orig, Math.max(orig - v, 0), cur, v > 0, true);
  } else if (dt === 'min_order') {
    const base = parseFloat(gv('m-deal-min')) || 0;
    const v = parseFloat(gv('m-deal-reward-value')) || 0;
    const pct = gv('m-deal-reward-type') !== 'fixed';
    const np = pct ? base * (1 - Math.min(v, 100) / 100) : Math.max(base - v, 0);
    el.innerHTML = dealPreviewPair(t, base, np, defCur, base > 0 && v > 0, true);
  }
}

function dealBundleItems() {
  return Array.from(document.querySelectorAll('#m-deal-fields .bundle-pick input:checked')).map(i => i.value);
}

async function saveDeal(id) {
  const dt = gv('m-deal-type');
  const scope = (dt === 'percent' || dt === 'fixed') ? (gv('m-deal-scope') || 'all') : (dt === 'bogo' ? 'item' : 'all');
  const data = {
    title: gv('m-deal-title'), title_ar: gv('m-deal-title-ar'),
    description: gv('m-deal-desc'), description_ar: gv('m-deal-desc-ar'),
    deal_type: dt, shop_id: currentShop.id,
    starts_at: gv('m-deal-start') || null, ends_at: gv('m-deal-end') || null,
    applies_to: scope, item_id: null, category_id: null,
    buy_qty: null, get_qty: null, min_total: null, reward_type: null,
    bundle_price: null, bundle_items: null,
    discount_value: 0, currency: currentShop.currency_default || 'SYP'
  };
  if (scope === 'item') data.item_id = gv('m-deal-item') || null;
  if (scope === 'category') data.category_id = gv('m-deal-cat') || null;
  if (dt === 'percent') data.discount_value = Math.min(parseFloat(gv('m-deal-percent-value')) || 0, 100);
  if (dt === 'fixed') { data.discount_value = parseFloat(gv('m-deal-fixed-value')) || 0; data.currency = gv('m-deal-fixed-currency'); }
  if (dt === 'bogo') { data.buy_qty = parseInt(gv('m-deal-buy')) || 1; data.get_qty = parseInt(gv('m-deal-get')) || 1; data.item_id = gv('m-deal-item-list') || null; }
  if (dt === 'bundle') { data.bundle_items = dealBundleItems(); data.bundle_price = parseFloat(gv('m-deal-bundle-price')) || 0; data.currency = gv('m-deal-bundle-currency'); }
  if (dt === 'min_order') {
    data.min_total = parseFloat(gv('m-deal-min')) || 0;
    data.reward_type = gv('m-deal-reward-type');
    const rv = parseFloat(gv('m-deal-reward-value')) || 0;
    data.discount_value = data.reward_type === 'percent' ? Math.min(rv, 100) : rv;
  }
  let error;
  if (id) {
    ({ error } = await sb.from('deals').update(data).eq('id', id));
  } else {
    ({ error } = await sb.from('deals').insert(data));
  }
  if (error) return toast(t('error') + ': ' + error.message, true);
  closeModal();
  showTab('deals');
  toast(id ? t('deal_updated') : t('deal_created'));
}

async function toggleDeal(id, val) {
  const { error } = await sb.from('deals').update({ is_active: val }).eq('id', id);
  if (error) return toast(t('error') + ': ' + error.message, true);
}

async function deleteDeal(id) {
  if (!confirm(t('delete_deal_q'))) return;
  const { error } = await sb.from('deals').delete().eq('id', id);
  if (error) return toast(t('error') + ': ' + error.message, true);
  showTab('deals');
  toast(t('deal_deleted'));
}

let currencyToggling = false;
async function toggleCurrency(c) {
  if (currencyToggling) return; // guard double-click race
  currencyToggling = true;
  try {
    let currencies = currentShop.currencies || ['SYP'];
    if (currencies.includes(c)) {
      if (currencies.length <= 1) {
        toast(t('last_currency_error'), true);
        return;
      }
      currencies = currencies.filter(x => x !== c);
    } else {
      currencies.push(c);
    }
    const { error } = await sb.from('shops').update({ currencies }).eq('id', currentShop.id);
    if (error) return toast(t('error') + ': ' + error.message, true);
    currentShop.currencies = currencies;
    // If removed currency was default, switch to first available
    if (!currencies.includes(currentShop.currency_default) && currencies.length > 0) {
      const { error: defErr } = await sb.from('shops').update({ currency_default: currencies[0] }).eq('id', currentShop.id);
      if (defErr) return toast(t('error') + ': ' + defErr.message, true);
      currentShop.currency_default = currencies[0];
    }
    showTab('currencies');
    toast(t('currencies_updated'));
  } finally {
    currencyToggling = false;
  }
}

async function updateDefaultCurrency() {
  const val = gv('s-default-cur');
  await sb.from('shops').update({ currency_default: val }).eq('id', currentShop.id);

async function toggleCurrencySelector() {

}

// ─── ORDERS ─────────────────────────────────────────────────
// RLS: owner can SELECT orders for their shop (bigserial id desc = newest first).
// Paginated via .range() so the list can grow without unbounded memory.
async function loadOrders(reset) {
  if (reset) { ordersAll = []; orderHasMore = true; orderFetchToken++; }
  if (!orderHasMore) { renderOrderRows(); return; }
  const token = orderFetchToken;
  const from = ordersAll.length;
  const to = from + ORDER_PAGE; // fetch one extra row to detect "has more" without an extra empty call
  const { data, error } = await sb.from('orders')
    .select('*')
    .eq('shop_id', currentShop.id)
    .order('id', { ascending: false })
    .range(from, to);
  if (error) return toast(t('error') + ': ' + error.message, true);
  if (token !== orderFetchToken) return; // a reset happened while we were fetching — drop stale rows
  const rows = data || [];
  ordersAll = ordersAll.concat(rows.slice(0, ORDER_PAGE));
  orderHasMore = rows.length > ORDER_PAGE;
  renderOrderRows();
}

function filterOrders() {
  let list = ordersAll;
  const q = orderQuery.trim().toLowerCase();
  if (q) list = list.filter(o => String(o.id).includes(q));
  if (orderFilter === 'today') {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    list = list.filter(o => new Date(o.created_at) >= start);
  }
  if (orderStatusFilter !== 'all') list = list.filter(o => (o.status || 'new') === orderStatusFilter);
  return list;
}

function statusLabel(st) { return t('st_' + (st || 'new')); }
function statusBadge(st) {
  const map = { new: 'var(--primary)', confirmed: '#0ea5e9', preparing: '#f59e0b', ready: '#10b981', delivered: '#6b7280', cancelled: '#ef4444' };
  return `<span class="st-badge" style="background:${map[st] || map.new};color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap">${statusLabel(st)}</span>`;
}

// Status change (owner-managed; RLS owner update)
async function updateOrderStatus(id, val) {
  const { error } = await sb.from('orders').update({ status: val }).eq('id', id);
  if (error) return toast(t('error') + ': ' + error.message, true);
  const o = ordersAll.find(x => String(x.id) === String(id));
  if (o) o.status = val;
  renderOrderRows();
  toast(t('status_updated'));
}

// Reply to the customer who placed the order. If their phone is stored,
// offer a pre-filled WhatsApp message (wa.me); otherwise copy a summary.
function openReplyModal(id) {
  const o = ordersAll.find(x => String(x.id) === String(id));
  if (!o) return;
  document.getElementById('modal-content').innerHTML = `
    <h3>${t('reply_to_customer')} <span class="order-id">#${o.id}</span></h3>
    <div class="field">
      <label>${t('customer_phone')}</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="m-reply-phone" value="${esc(o.customer_phone || '')}" dir="ltr" placeholder="963...">
        <button class="btn btn-ghost btn-sm" onclick="copyReplyPhone()">${t('copy')}</button>
      </div>
    </div>
    <div class="field"><label>${t('reply_msg')}</label><textarea id="m-reply-text" rows="3">${lang === 'ar' ? 'مرحباً، بخصوص طلبك رقم ' + o.id + ' — ' : 'Hello, regarding your order #' + o.id + ' — '}</textarea></div>
    <p style="font-size:12px;color:var(--text2)">${lang === 'ar' ? `الطلب الحالي: ${statusLabel(o.status || 'new')} — الإجمالي ${esc(o.total)} ${esc(o.currency || 'SYP')}` : `Current status: ${statusLabel(o.status || 'new')} — Total ${esc(o.total)} ${esc(o.currency || 'SYP')}`}</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn btn-primary" onclick="sendReply('${o.id}')">${t('send_whatsapp')}</button>
    </div>
  `;
  document.getElementById('modal-overlay').style.display = 'flex';
}

function copyReplyPhone() {
  const v = gv('m-reply-phone');
  if (!v) return toast(t('reply_no_phone'), true);
  navigator.clipboard?.writeText(v)
    .then(() => toast(t('copied')))
    .catch(() => toast(t('copy_failed'), true));
}

function sendReply(id) {
  const o = ordersAll.find(x => String(x.id) === String(id));
  const phone = gv('m-reply-phone').replace(/\D/g, '');
  const msg = document.getElementById('m-reply-text').value.trim();
  if (!phone) return toast(t('reply_no_phone'), true);
  const text = msg || (lang === 'ar' ? 'مرحباً، بخصوص طلبك رقم ' + id : 'Hello, regarding your order #' + id);
  // BMP-safe WhatsApp text (surrogate pairs stripped, like the public flow)
  const safe = text.replace(/[\uD800-\uDFFF]/g, '');
  window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(safe), '_blank');
  // Persist the reply phone back on the order for future use
  if (o && o.customer_phone !== phone) {
    sb.from('orders').update({ customer_phone: phone }).eq('id', id)
      .then(({ error }) => { if (!error && o) o.customer_phone = phone; })
      .catch(() => { /* the reply still opened; phone just isn't persisted */ });
  }
  closeModal();
}

            ${ORDER_STATUSES.map(s => `<option value="${s}" ${(o.status || 'new')===s?'selected':''}>${t('st_' + s)}</option>`).join('')}
          </select>
        </div>
      </td>
      <td data-label="${t('items_label')}"><div class="order-lines">${items}${noteHtml}${dlHtml}</div></td>

      <td data-label="${t('subtotal')}">${esc(o.subtotal)} ${cur}</td>

function renderOrderRows() {
  const tbody = document.getElementById('orders-tbody');
  if (!tbody) return;
  const list = filterOrders();
  const count = document.getElementById('order-count');
  if (count) count.textContent = `${t('showing')} ${list.length} ${t('of')} ${ordersAll.length}${orderHasMore ? '+' : ''}`;
  const more = document.getElementById('order-more-wrap');
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="9" class="empty">${ordersAll.length ? t('no_orders_match') : t('no_orders')}</td></tr>`;
    // Keep the Load More button even when the current filter matches nothing —
    // the user may have more rows to page through.
    if (more) more.innerHTML = orderHasMore && ordersAll.length
      ? `<button class="btn btn-ghost" onclick="loadOrders(false)">${t('load_more')}</button>`
      : '';
    return;
  }
  tbody.innerHTML = list.map(orderRowHTML).join('');
  if (more) more.innerHTML = orderHasMore
    ? `<button class="btn btn-ghost" onclick="loadOrders(false)">${t('load_more')}</button>`
    : '';
}
