    // ─── PRICING ENGINE ─────────────────────────────────────
    function itemHasVariants(item) { return !!item && Array.isArray(item.variants) && item.variants.length > 0; }
    // Price of a specific variant in the active currency (null when unset)
    function variantPrice(item, idx) {
      if (!itemHasVariants(item)) return null;
      const v = item.variants[idx];
      if (!v || !v.prices) return null;
      const p = v.prices[activeCurrency];
      return p == null ? null : (Number(p) || 0);
    }
    function itemUnitPrice(id) {
      const item = items.find(i => i.id === id);
      if (itemHasVariants(item) && selectedVariants[id] != null) {
        const vp = variantPrice(item, selectedVariants[id]);
        if (vp != null) return vp;
      }
      const p = (item?.item_prices || []).find(x => x.currency === activeCurrency && x.is_visible);
      return p ? Number(p.price) || 0 : 0;
    }
    // Card price cell: "From X" when the item has variants, plain price otherwise (P1.6)
    function cardPriceHTML(item) {
      if (!itemHasVariants(item)) {
        const p = (item.item_prices || []).find(x => x.currency === activeCurrency && x.is_visible);
        return p ? `<span class="item-price">${formatPrice(p.price, activeCurrency)}</span>` : `<span class="item-price"></span>`;
      }
      const prices = item.variants.map((_, i) => variantPrice(item, i)).filter(p => p != null);
      if (!prices.length) return `<span class="item-price"></span>`;
      const min = Math.min(...prices);
      const label = lang === 'ar' ? 'من' : 'From';
      return `<span class="item-price price-from">${label} ${formatPrice(min, activeCurrency)}</span>`;
    }
    // All prices of an item's variants in the active currency, or null when the item has none
    function itemVariantPrices(item) {
      return itemHasVariants(item) ? item.variants.map((_, i) => variantPrice(item, i)) : null;
    }
    function cartSubtotal() {
      return Object.entries(cart).reduce((s, [id, qty]) => s + itemUnitPrice(id) * qty, 0);
    }
    // Subtotal of the scope a deal applies to (item / category / all)
    function scopeSubtotalValue(d) {
      if (d.applies_to === 'item') return (cart[d.item_id] || 0) * itemUnitPrice(d.item_id);
      if (d.applies_to === 'category') {
        return Object.entries(cart).reduce((s, [id, qty]) => {
          const item = items.find(i => i.id === id);
          if (!item || item.category_id !== d.category_id) return s;
          return s + itemUnitPrice(id) * qty;
        }, 0);
      }
      return cartSubtotal();
    }
    // Discount amount (in activeCurrency) a single deal produces for the current cart
    function dealSavings(d) {
      if (!d) return 0;
      const subtotal = cartSubtotal();
      const dt = d.deal_type || d.discount_type || 'percent';
      const val = Number(d.discount_value) || 0;
      if (dt === 'percent') return subtotal > 0 ? scopeSubtotalValue(d) * val / 100 : 0;
      if (dt === 'fixed') {
        if (d.currency && d.currency !== activeCurrency) return 0;
        return Math.min(val, scopeSubtotalValue(d));
      }
      if (dt === 'bogo') {
        const qty = cart[d.item_id] || 0;
        const buy = Number(d.buy_qty) || 1, get = Number(d.get_qty) || 1;
        if (qty < buy + get) return 0;
        return Math.floor(qty / (buy + get)) * get * itemUnitPrice(d.item_id);
      }
      if (dt === 'bundle') {
        const ids = (d.bundle_items || []).map(x => (typeof x === 'string' ? x : (x.id || x)));
        if (!ids.length || !ids.every(id => (cart[id] || 0) >= 1)) return 0;
        if (d.currency && d.currency !== activeCurrency) return 0;
        const itemsSum = ids.reduce((s, id) => s + itemUnitPrice(id), 0);
        return Math.max(itemsSum - (Number(d.bundle_price) || 0), 0);
      }
      if (dt === 'min_order') {
        if (subtotal < (Number(d.min_total) || 0)) return 0;
        if ((d.reward_type || 'percent') === 'fixed') {
          if (d.currency && d.currency !== activeCurrency) return 0;
          return Math.min(val, subtotal);
        }
        return subtotal * val / 100;
      }
      return 0;
    }
    // Price the customer pays for a deal after discount (null when not determinable for the current cart)
    function dealAfterValue(d) {
      if (!d) return null;
      const dt = d.deal_type || d.discount_type || 'percent';
      const subtotal = cartSubtotal();
      if (dt === 'bundle') {
        if (d.currency && d.currency !== activeCurrency) return null;
        const bp = Number(d.bundle_price) || 0;
        return bp > 0 ? bp : null;
      }
      if (dt === 'bogo') {
        if (!d.item_id) return null;
        const u = itemUnitPrice(d.item_id);
        if (!u) return null;
        return (Number(d.buy_qty) || 1) * u;
      }
      const s = dealSavings(d);
      if (s <= 0) return null;
      if (dt === 'percent' || dt === 'fixed') return Math.max(scopeSubtotalValue(d) - s, 0);
      if (dt === 'min_order') return Math.max(subtotal - s, 0);
      return null;
    }
    // Full order snapshot used by the FAB, the sheet and the WhatsApp message
    function computeOrder() {
      const itemsList = [], offers = [];
      for (const [id, qty] of Object.entries(cart)) {
        const item = items.find(i => i.id === id);
        if (!item) continue;
        const unit = itemUnitPrice(id);
        const v = (itemHasVariants(item) && selectedVariants[id] != null) ? item.variants[selectedVariants[id]] : null;
        itemsList.push({ id, name: item.name || '', name_ar: item.name_ar || '', qty, unit_price: unit, note: cartNotes[id] || '', variant: v ? { name: v.name || '', name_ar: v.name_ar || '' } : null });
      }
      for (const id of Object.keys(cartOffers)) {
        const d = deals.find(x => x.id === id);
        if (!d) continue;
        const av = dealAfterValue(d);
        offers.push({ id, title: d.title || '', title_ar: d.title_ar || '', summary: dealSummary(d), savings: Math.round(dealSavings(d) * 100) / 100, value: av == null ? null : Math.round(av * 100) / 100 });
      }
      const subtotal = cartSubtotal();
      const discountLines = offers.filter(o => o.savings > 0)
        .map(o => ({ id: o.id, title: o.title, title_ar: o.title_ar, amount: o.savings }));
      const discount = Math.min(discountLines.reduce((s, x) => s + x.amount, 0), subtotal);
      const total = Math.max(subtotal - discount, 0);
      return { itemsList, offers, subtotal, discountLines, discount, total };
    }

    function updateCartBar() {
      const fab = document.getElementById('cart-fab');
      const o = computeOrder();
      const totalItems = Object.values(cart).reduce((s, q) => s + q, 0);
      const offerCount = Object.values(cartOffers).length;
      if (totalItems === 0 && offerCount === 0) { fab.classList.remove('visible'); document.getElementById('cart-count').textContent = '0'; document.getElementById('cart-total').textContent = '0'; return; }
      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total');
      countEl.textContent = totalItems + offerCount;
      if (totalItems === 0 && offerCount > 0) {
        // Offers-only cart: show the determinable after-discount value (bundle/BOGO),
        // otherwise guide the customer to add items — never a misleading 0.
        let standalone = 0;
        for (const off of o.offers) { if (off.value != null && off.value > 0) standalone += off.value; }
        if (standalone > 0) {
          totalEl.classList.remove('cart-total-hint');
          totalEl.textContent = formatPrice(standalone, activeCurrency);
        } else {
          totalEl.classList.add('cart-total-hint');
          totalEl.textContent = lang === 'ar' ? 'أضف أصنافاً' : 'Add items';
        }
      } else {
        totalEl.classList.remove('cart-total-hint');
        totalEl.textContent = formatPrice(o.total, activeCurrency);
      }
      fab.classList.add('visible');
    }

    // Order sheet
    let orderMode = localStorage.getItem('qm-order-mode') || 'dinein';
    let tableLabel = ''; // P2.7: from ?table=<id>
    function setOrderMode(m) { orderMode = m; try { localStorage.setItem('qm-order-mode', m); } catch (e) {} renderOrderSheet(); }
    function setOutlet(id) { selectedOutletId = id; try { localStorage.setItem('qm-outlet-id', id); } catch (e) {} }
    function selectedOutlet() { return outlets.find(o => o.id === selectedOutletId) || outlets[0] || null; }
    function outletLabel(o) { if (!o) return ''; return lang === 'ar' ? (o.name_ar || o.name) : (o.name || o.name_ar); }

    // P3.1 — delivery location (map + address)
    let deliveryLat = null, deliveryLng = null, deliveryAddr = '';
    let dlMap = null, dlMarker = null;
    try {
      deliveryLat = parseFloat(localStorage.getItem('qm-dlat')) || null;
      deliveryLng = parseFloat(localStorage.getItem('qm-dlng')) || null;
      deliveryAddr = localStorage.getItem('qm-dladdr') || '';
    } catch (e) {}

    function dlInit() {
      const el = document.getElementById('dl-map');
      if (dlMap) { try { dlMap.remove(); } catch (e) {} dlMap = null; dlMarker = null; }
      if (!el) return;
      if (!window.L) {
        el.outerHTML = `<div class="dl-fallback">${lang === 'ar' ? 'تعذّر تحميل الخريطة — اكتب العنوان في الحقل أعلاه' : 'Map could not load — type the address above instead'}</div>`;
        return;
      }
      const home = (deliveryLat != null)
        ? [deliveryLat, deliveryLng]
        : ((shop.location_lat != null && shop.location_lng != null) ? [shop.location_lat, shop.location_lng] : [33.5138, 36.2765]);
      dlMap = L.map(el, { attributionControl: true }).setView(home, deliveryLat != null ? 16 : 14);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(dlMap);
      if (deliveryLat != null) {
        dlMarker = L.marker([deliveryLat, deliveryLng], { draggable: true }).addTo(dlMap);
        dlMarker.on('dragend', () => dlPicked(dlMarker.getLatLng()));
      }
      dlMap.on('click', e => dlPicked(e.latlng));
      setTimeout(() => { if (dlMap) dlMap.invalidateSize(); }, 250);
    }

    function dlPicked(ll) {
      deliveryLat = ll.lat; deliveryLng = ll.lng;
      try {
        localStorage.setItem('qm-dlat', deliveryLat);
        localStorage.setItem('qm-dlng', deliveryLng);
      } catch (e) {}
      if (!dlMarker) {
        dlMarker = L.marker(ll, { draggable: true }).addTo(dlMap);
        dlMarker.on('dragend', () => dlPicked(dlMarker.getLatLng()));
      } else {
        dlMarker.setLatLng(ll);
      }
      dlReverse(ll.lat, ll.lng);
    }

    async function dlReverse(lat, lng) {
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=ar,en`);
        const j = await r.json();
        const nm = j.display_name || '';
        const inp = document.getElementById('dl-address');
        if (nm && inp && !inp.value.trim()) {
          deliveryAddr = nm; inp.value = nm;
          try { localStorage.setItem('qm-dladdr', nm); } catch (e) {}
        }
      } catch (e) { /* reverse geocode is non-critical */ }
    }

    function deliveryGeo() {
      if (!navigator.geolocation) { toast(lang === 'ar' ? 'متصفحك لا يدعم تحديد الموقع' : 'Your browser does not support geolocation', true); return; }
      navigator.geolocation.getCurrentPosition(
        p => dlPicked({ lat: p.coords.latitude, lng: p.coords.longitude }),
        () => toast(lang === 'ar' ? 'تم رفض إذن الموقع' : 'Location permission denied', true),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function openOrderSheet() {
      document.getElementById('order-modal').classList.add('visible');
      renderOrderSheet();
    }
    function closeOrderSheet() { document.getElementById('order-modal').classList.remove('visible'); }

    function renderOrderSheet() {
      const sheet = document.getElementById('order-sheet');
      const totalItems = Object.values(cart).reduce((s, q) => s + q, 0);
      const offerCount = Object.values(cartOffers).length;
      const closeLabel = lang === 'ar' ? 'إغلاق' : 'Close';
      if (totalItems === 0 && offerCount === 0) {
        sheet.innerHTML = `
          <div class="sheet-head"><h3>${lang === 'ar' ? 'سلة الطلب' : 'Your Order'}</h3>
          <button class="sheet-close" onclick="closeOrderSheet()"><i class="fa-solid fa-xmark"></i></button></div>
          <div class="empty-msg"><span class="big"><i class="fa-solid fa-cart-shopping"></i></span>${lang === 'ar' ? 'السلة فارغة — أضف عناصر من القائمة' : 'Cart is empty — add items from the menu'}</div>`;
        return;
      }
      const o = computeOrder();

      // Order mode toggle (P2.6)
      const modeLabel = lang === 'ar' ? 'نوع الطلب' : 'Order type';
      const tableRow = tableLabel
        ? `<div class="om-row"><span class="om-label">${lang === 'ar' ? 'الطاولة' : 'Table'}</span><span class="table-chip"><i class="fa-solid fa-chair"></i> ${esc(tableLabel)}</span></div>`
        : '';
      const branchRow = outlets.length >= 2
        ? `<div class="om-row"><span class="om-label">${lang === 'ar' ? 'الفرع' : 'Branch'}</span>
            <select id="outlet-select" class="om-select" aria-label="${lang === 'ar' ? 'اختر الفرع' : 'Select branch'}" onchange="setOutlet(this.value)">
              ${outlets.map(o => `<option value="${o.id}" ${o.id === selectedOutletId ? 'selected' : ''}>${esc(lang === 'ar' ? (o.name_ar || o.name) : (o.name || o.name_ar))}</option>`).join('')}
            </select></div>`
        : '';
      const modeHtml = `<div class="om-row">
        <span class="om-label">${modeLabel}</span>
        <div class="om-toggle" role="group" aria-label="${modeLabel}">
          <button class="om-btn ${orderMode === 'dinein' ? 'active' : ''}" onclick="setOrderMode('dinein')" aria-pressed="${orderMode === 'dinein'}"><i class="fa-solid fa-utensils"></i> ${lang === 'ar' ? 'في المكان' : 'Dine-in'}</button>
          <button class="om-btn ${orderMode === 'takeaway' ? 'active' : ''}" onclick="setOrderMode('takeaway')" aria-pressed="${orderMode === 'takeaway'}"><i class="fa-solid fa-bag-shopping"></i> ${lang === 'ar' ? 'سفري' : 'Takeaway'}</button>
          <button class="om-btn ${orderMode === 'delivery' ? 'active' : ''}" onclick="setOrderMode('delivery')" aria-pressed="${orderMode === 'delivery'}"><i class="fa-solid fa-truck-fast"></i> ${lang === 'ar' ? 'توصيل' : 'Delivery'}</button>
        </div>
      </div>`;

      // P3.1 — delivery location block (map + address). Rendered only when mode==='delivery'.
      const deliveryBlock = orderMode === 'delivery'
        ? `<div class="dl-block">
            <div class="dl-addr-wrap">
              <input id="dl-address" class="om-select" dir="auto" placeholder="${lang === 'ar' ? 'حدّد الموقع على الخريطة أو اكتب العنوان' : 'Pick the location on the map or type the address'}" value="${esc(deliveryAddr)}" oninput="deliveryAddr=this.value" aria-label="${lang === 'ar' ? 'عنوان التوصيل' : 'Delivery address'}">
              <button class="dl-loc-btn" type="button" onclick="deliveryGeo()" aria-label="${lang === 'ar' ? 'استخدام موقعي الحالي' : 'Use my current location'}" title="${lang === 'ar' ? 'موقعي الحالي' : 'My location'}"><i class="fa-solid fa-location-crosshairs"></i></button>
            </div>
            <div class="dl-map" id="dl-map" dir="ltr"></div>
            <div class="dl-hint"><i class="fa-solid fa-circle-info"></i> ${lang === 'ar' ? 'انقر على الخريطة أو اسحب المؤشر لتحديد نقطة التوصيل' : 'Tap the map or drag the pin to set the delivery point'}</div>
          </div>`
        : '';

      let rows = '';
      for (const [id, qty] of Object.entries(cart)) {
        const item = items.find(i => i.id === id);
        if (!item) continue;
        const name = lang === 'ar' ? (item.name_ar || item.name) : item.name;
        const sub = lang === 'ar' ? (item.name || '') : (item.name_ar || '');
        const v = (itemHasVariants(item) && selectedVariants[id] != null) ? item.variants[selectedVariants[id]] : null;
        const vName = v ? (lang === 'ar' ? (v.name_ar || v.name) : (v.name || v.name_ar)) : '';
        const unit = itemUnitPrice(id);
        rows += `
          <div class="order-line">
            <div class="ol-name">${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ''}${vName ? `<small class="ol-variant">${esc(vName)}</small>` : ''}</div>
            <div class="ol-price">${formatPrice(unit * qty, activeCurrency)}</div>
            ${stepperHTML(id, qty)}
            <button class="ol-remove" onclick="removeItem('${id}')" aria-label="${lang === 'ar' ? 'إزالة العنصر' : 'Remove item'}"><i class="fa-solid fa-xmark"></i></button>
          </div>`;
      }

      const subtotalLabel = lang === 'ar' ? 'المجموع الفرعي' : 'Subtotal';
      const totalLabel = lang === 'ar' ? 'المجموع' : 'Total';
      const noteLabel = lang === 'ar' ? 'ملاحظات الطلب (اختياري)' : 'Order notes (optional)';
      const waLabel = lang === 'ar' ? 'إرسال الطلب عبر واتساب' : 'Send Order via WhatsApp';

      let offerRows = '';
      for (const [id] of Object.entries(cartOffers)) {
        const d = deals.find(x => x.id === id);
        if (!d) continue;
        const title = lang === 'ar' ? (d.title_ar || d.title) : d.title;
        const off = o.offers.find(x => x.id === id);
        const hasValue = off && off.value != null && off.value > 0;
        const priceHtml = hasValue
          ? `<div class="ol-price">${formatPrice(off.value, activeCurrency)}</div>`
          : (off && off.savings > 0
              ? `<div class="ol-price ol-save">−${formatPrice(off.savings, activeCurrency)}</div>`
              : `<div class="ol-price ol-muted">—</div>`);
        offerRows += `
          <div class="order-line offer-line">
            <div class="ol-name">🎁 ${esc(title)}<small>${esc(dealSummary(d))}</small></div>
            ${priceHtml}
            <button class="ol-remove" onclick="removeOffer('${id}')" aria-label="${lang === 'ar' ? 'إزالة العرض' : 'Remove offer'}"><i class="fa-solid fa-xmark"></i></button>
          </div>`;
      }

      const discRows = o.discountLines.map(l => {
        const t = lang === 'ar' ? (l.title_ar || l.title) : l.title;
        return `<div class="order-disc-row"><span class="disc-name">🎁 ${esc(t)}</span><span class="disc-amt">−${formatPrice(l.amount, activeCurrency)}</span></div>`;
      }).join('');

      const totalHtml = o.discount > 0
        ? `<div class="order-sub-row"><span>${subtotalLabel}</span><span>${formatPrice(o.subtotal, activeCurrency)}</span></div>
          ${discRows}
          <div class="order-total-row"><span>${totalLabel}</span><span>${formatPrice(o.total, activeCurrency)}</span></div>`
        : `<div class="order-total-row"><span>${totalLabel}</span><span>${formatPrice(o.subtotal, activeCurrency)}</span></div>`;

      sheet.innerHTML = `
        <div class="sheet-head"><h3>${lang === 'ar' ? 'مراجعة الطلب' : 'Review Order'}</h3>
        <button class="sheet-close" onclick="closeOrderSheet()"><i class="fa-solid fa-xmark"></i></button></div>
        ${rows}
        ${offerRows}
        ${totalHtml}
        ${deliveryBlock}
        <div class="om-foot">${branchRow}${tableRow}${modeHtml}</div>
        <input class="order-note order-phone" id="order-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="${lang === 'ar' ? 'رقم هاتفك (اختياري)' : 'Your phone (optional)'}" value="${esc(customerPhone)}">
        <textarea class="order-note" id="order-note" placeholder="${noteLabel}"></textarea>
        <button class="order-whatsapp" onclick="sendWhatsApp()"><i class="fa-brands fa-whatsapp"></i> ${waLabel}</button>`;
      if (orderMode === 'delivery') dlInit();
    }

    // WhatsApp + order record
    async function sendWhatsApp() {
      const o = computeOrder();
      const totalItems = Object.values(cart).reduce((s, q) => s + q, 0);
      const offerCount = Object.values(cartOffers).length;
      if (totalItems === 0 && offerCount === 0) return;
      const btn = document.querySelector('.order-whatsapp');
      const waLabel = lang === 'ar' ? 'إرسال الطلب عبر واتساب' : 'Send Order via WhatsApp';
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ' + (lang === 'ar' ? 'جارٍ تجهيز الطلب...' : 'Preparing order...'); }

      let orderNo = null;
      const note = document.getElementById('order-note')?.value?.trim() || '';
      const customerPhoneInput = document.getElementById('order-phone')?.value?.trim() || '';
      if (customerPhoneInput) { customerPhone = customerPhoneInput; try { localStorage.setItem('qm-phone', customerPhoneInput); } catch (e) {} }
      // P3.1 — delivery requires a pin on the map
      if (orderMode === 'delivery' && (deliveryLat == null || deliveryLng == null)) {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-brands fa-whatsapp"></i> ' + waLabel; }
        toast(lang === 'ar' ? 'حدّد موقع التوصيل على الخريطة أولاً' : 'Set the delivery location on the map first', true);
        return;
      }
      try {
        const { data, error } = await sb.from('orders').insert({
          shop_id: shop.id,
          currency: activeCurrency,
          subtotal: Math.round(o.subtotal * 100) / 100,
          discount: Math.round(o.discount * 100) / 100,
          total: Math.round(o.total * 100) / 100,
          items: o.itemsList,
          offers: o.offers,
          discount_lines: o.discountLines,
          note,
          order_mode: orderMode,
          table_label: tableLabel,
          outlet_id: (selectedOutlet() || {}).id || null,
          outlet_label: outletLabel(selectedOutlet()),
          customer_phone: customerPhoneInput,
          delivery_address: orderMode === 'delivery' ? deliveryAddr : '',
          delivery_lat: orderMode === 'delivery' ? deliveryLat : null,
          delivery_lng: orderMode === 'delivery' ? deliveryLng : null
        }).select('id').single();
        if (!error && data && data.id) orderNo = data.id;
      } catch (e) { /* keep client-only fallback below */ }
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-brands fa-whatsapp"></i> ' + waLabel; }

      const displayNo = orderNo || ('T' + String(Date.now()).slice(-6));
      const lines = [];
      lines.push(lang === 'ar' ? `*طلب جديد #${displayNo} — ${shop.name}*` : `*New Order #${displayNo} — ${shop.name}*`);
      const outl = selectedOutlet();
      if (outlets.length && outl) lines.push(`${lang === 'ar' ? 'الفرع' : 'Branch'}: ${outletLabel(outl)}`);
      lines.push(orderMode === 'takeaway'
        ? (lang === 'ar' ? 'طلب سفري (TAKEAWAY)' : 'Takeaway (TAKEAWAY)')
        : orderMode === 'delivery'
          ? (lang === 'ar' ? 'توصيل (DELIVERY)' : 'Delivery (DELIVERY)')
          : (lang === 'ar' ? 'في المكان (DINE-IN)' : 'Dine-in (DINE-IN)'));
      if (orderMode === 'delivery') {
        if (deliveryAddr.trim()) lines.push(`${lang === 'ar' ? 'العنوان' : 'Address'}: ${deliveryAddr}`);
        if (deliveryLat != null) lines.push(`${lang === 'ar' ? 'الموقع على الخريطة' : 'Map'}: https://www.google.com/maps?q=${deliveryLat},${deliveryLng}`);
      }
      if (tableLabel) lines.push(`${lang === 'ar' ? 'الطاولة' : 'Table'}: ${tableLabel}`);
      if (customerPhone) lines.push(`${lang === 'ar' ? 'الهاتف' : 'Phone'}: ${customerPhone}`);
      lines.push('');
      for (const [id, qty] of Object.entries(cart)) {
        const item = items.find(i => i.id === id);
        if (!item) continue;
        const name = lang === 'ar' ? (item.name_ar || item.name) : item.name;
        const unit = itemUnitPrice(id);
        const v = (itemHasVariants(item) && selectedVariants[id] != null) ? item.variants[selectedVariants[id]] : null;
        const vName = v ? (lang === 'ar' ? (v.name_ar || v.name) : (v.name || v.name_ar)) : '';
        const note = cartNotes[id] ? ` (${lang === 'ar' ? 'ملاحظة' : 'note'}: ${cartNotes[id]})` : '';
        lines.push(`• ${name}${vName ? ` (${vName})` : ''} × ${qty} — ${formatPrice(unit * qty, activeCurrency)}${note}`);
      }
      for (const id of Object.keys(cartOffers)) {
        const d = deals.find(x => x.id === id);
        if (!d) continue;
        const title = lang === 'ar' ? (d.title_ar || d.title) : d.title;
        const off = o.offers.find(x => x.id === id);
        const tag = off && off.savings > 0 ? ` (−${formatPrice(off.savings, activeCurrency)})` : '';
        lines.push(`★ ${title} — ${dealSummary(d)}${tag}`);
      }
      lines.push('');
      const subtotalLabel = lang === 'ar' ? 'المجموع الفرعي' : 'Subtotal';
      let totalLabel;
      if (o.discount > 0) {
        lines.push(`${subtotalLabel}: ${formatPrice(o.subtotal, activeCurrency)}`);
        for (const l of o.discountLines) {
          const t = lang === 'ar' ? (l.title_ar || l.title) : l.title;
          lines.push(`★ ${t}: −${formatPrice(l.amount, activeCurrency)}`);
        }
        totalLabel = lang === 'ar' ? 'الإجمالي بعد الخصم' : 'Total after discount';
      } else {
        totalLabel = lang === 'ar' ? 'المجموع' : 'Total';
      }
      lines.push(`${totalLabel}: *${formatPrice(o.total, activeCurrency)}*`);
      if (note) { lines.push(''); lines.push(`${lang === 'ar' ? 'ملاحظات' : 'Notes'}: ${note}`); }
      // WhatsApp's wa.me redirect drops non-BMP (emoji) characters, so strip
      // surrogate pairs from titles/notes but keep a BMP-safe star marker.
      const msg = encodeURIComponent(lines.join('\n').replace(/[\uD800-\uDFFF]/g, ''));
      const phone = (outl && outl.whatsapp ? outl.whatsapp : shop.whatsapp)?.replace(/[^0-9]/g, '') || '';
      window.open(phone ? `https://wa.me/${phone}?text=${msg}` : `https://wa.me/?text=${msg}`, '_blank');
      toast(orderNo
        ? (lang === 'ar' ? `تم إنشاء الطلب رقم #${orderNo}` : `Order #${orderNo} placed`)
        : (lang === 'ar' ? 'تم فتح واتساب' : 'WhatsApp opened'));
      // P2.9: ask for a rating shortly after the order leaves
      setTimeout(showSurvey, 900);
    }

    // ─── SURVEY (P2.9) ────────────────────────────────────────
    let surveyRating = 0;
    function showSurvey() {
      surveyRating = 0;
      renderSurvey();
      document.getElementById('survey-modal').classList.add('visible');
    }
    function closeSurvey() { document.getElementById('survey-modal').classList.remove('visible'); }
    function renderSurvey() {
      const card = document.getElementById('survey-card');
      const head = lang === 'ar' ? 'كيف كانت تجربتك؟' : 'How was your experience?';
      const sub = lang === 'ar' ? 'قيّم زيارتك — رأيك يساعدنا على التحسّن' : 'Rate your visit — your feedback helps us improve';
      const commentPh = lang === 'ar' ? 'ملاحظات (اختياري)' : 'Comment (optional)';
      const submit = lang === 'ar' ? 'إرسال التقييم' : 'Submit rating';
      const skip = lang === 'ar' ? 'لاحقاً' : 'Later';
      const stars = [1,2,3,4,5].map(n => `<button class="survey-star" onclick="setSurveyRating(${n})" aria-label="${n} star" aria-pressed="${n <= surveyRating}">★</button>`).join('');
      card.innerHTML = `
        <button class="sheet-close" style="position:absolute;top:10px;inset-inline-end:10px" onclick="closeSurvey()" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <div class="survey-head">${head}</div>
        <div class="survey-sub">${sub}</div>
        <div class="survey-stars">${stars}</div>
        <textarea class="survey-comment" id="survey-comment" placeholder="${commentPh}"></textarea>
        <button class="survey-submit" onclick="submitSurvey()">${submit}</button>
        <button class="survey-skip" onclick="closeSurvey()">${skip}</button>`;
      document.getElementById('survey-card').style.position = 'relative';
    }
    function setSurveyRating(n) {
      surveyRating = n;
      document.querySelectorAll('.survey-star').forEach((b, i) => {
        b.classList.toggle('on', i < n); b.setAttribute('aria-pressed', i < n ? 'true' : 'false');
      });
    }
    async function submitSurvey() {
      const rating = surveyRating;
      if (!rating) { toast(lang === 'ar' ? 'اختر عدد النجوم أولاً' : 'Pick a star rating first'); return; }
      const comment = document.getElementById('survey-comment')?.value?.trim() || '';
      const btn = document.querySelector('.survey-submit');
      if (btn) { btn.disabled = true; btn.textContent = lang === 'ar' ? 'جارٍ الإرسال…' : 'Sending…'; }
      try {
        const r = await fetch(`${SUPABASE_URL}/functions/v1/submit-survey`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
          body: JSON.stringify({ shop_id: shop.id, rating, comment })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) throw new Error(j.error || r.status);
        closeSurvey();
        toast(lang === 'ar' ? 'شكراً لتقييمك! 💛' : 'Thanks for your feedback! 💛');
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = lang === 'ar' ? 'إرسال التقييم' : 'Submit rating'; }
        toast(lang === 'ar' ? 'تعذّر الإرسال، حاول مجدداً' : 'Could not send — try again', true);
      }
    }

    // ─── HELPERS ────────────────────────────────────────────
    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function formatPrice(amount, currency) {
      const formatted = new Intl.NumberFormat(lang === 'ar' ? 'ar-SY' : 'en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(amount);
      return `${formatted} ${currency}`;
    }
    let toastTimer;
    // ─── CAMPAIGN (P2.10) ────────────────────────────────────
    // One-time promo landing modal per campaign. 'qm_campaign_seen' stores the
    // featured deal id so the same campaign never re-opens on this device,
    // while a NEW campaign (different featured deal) is shown again once.
    function showCampaign() {
      if (!deals.length) return;
      const d = deals[0];
      if (localStorage.getItem('qm_campaign_seen') === d.id) return;
      localStorage.setItem('qm_campaign_seen', d.id);
      renderCampaign(d);
      document.getElementById('campaign-modal').classList.add('visible');
    }
    function closeCampaign() { document.getElementById('campaign-modal').classList.remove('visible'); }
    function renderCampaign(d) {
      const card = document.getElementById('campaign-card');
      const title = lang === 'ar' ? (d.title_ar || d.title) : d.title;
      const desc = lang === 'ar' ? (d.description_ar || d.description) : d.description;
      const summary = dealSummary(d);
      const eyebrow = lang === 'ar' ? 'عرض خاص <i class="fa-solid fa-fire"></i>' : 'SPECIAL <i class="fa-solid fa-fire"></i>';
      const cta = lang === 'ar' ? 'اطلب الآن' : 'Order now';
      const skip = lang === 'ar' ? 'لاحقاً' : 'Later';
      const foot = lang === 'ar' ? 'يُضاف العرض تلقائياً إلى طلبك' : 'Tapping adds the offer to your order';
      card.innerHTML = `
        <button class="sheet-close" style="position:absolute;top:10px;inset-inline-end:10px" onclick="closeCampaign()" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <div class="promo-badge"><i class="fa-solid fa-fire"></i></div>
        <div class="promo-eyebrow">${eyebrow}</div>
        <div class="promo-title">${esc(title)}</div>
        ${desc ? `<div class="promo-desc">${esc(desc)}</div>` : ''}
        <span class="deal-badge"><i class="fa-solid fa-fire"></i> ${esc(summary)}</span>
        <button class="survey-submit" style="margin-top:14px" onclick="useCampaign('${d.id}')">${cta}</button>
        <button class="survey-skip" onclick="closeCampaign()">${skip}</button>
        <div class="promo-foot">${foot}</div>`;
      card.style.position = 'relative';
    }
    function useCampaign(id) {
      closeCampaign();
      toggleOffer(id); // toasts + re-renders the deals section + cart bar
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      closeProductSheet(); closeOrderSheet(); closeSearch(); closeInfo();
    });
  </script>
</body>
</html>
