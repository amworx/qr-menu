<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>QR Menu</title>
  <meta name="description" content="Browse the menu and order via WhatsApp.">
  <meta name="theme-color" content="#0d0a07">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Judy Joy">
  <link rel="canonical" id="canonical-link">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="QR Menu">
  <meta property="og:title" content="QR Menu">
  <meta property="og:description" content="Browse the menu and order via WhatsApp.">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="QR Menu">
  <meta name="twitter:description" content="Browse the menu and order via WhatsApp.">
  <meta name="twitter:image" content="">
  <script id="ld-json" type="application/ld+json">{}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    /* ═══ THEMES ═══ */
    :root[data-theme="dark"]{
      --bg:#0d0a07; --bg-soft:#151009; --card:#1a140d; --card2:#221a11;
      --text:#f5efe6; --text2:#b8a899; --text3:#83735f;
      --border:#2b2015; --border2:#3a2c1d;
      --primary:#e08a2e; --primary-2:#c96a12; --accent:#f5b14e;
      --primary-glow:rgba(224,138,46,.28);
      --wa:#25d366; --wa-dark:#1da851;
      --danger:#e05d4b;
      --shadow:0 8px 30px rgba(0,0,0,.45);
      --hero-grad:radial-gradient(120% 90% at 50% 0%, rgba(224,138,46,.16) 0%, rgba(13,10,7,0) 60%);
      --surface-grad:linear-gradient(180deg,#1a140d 0%,#151009 100%);
    }
    :root[data-theme="light"]{
      --bg:#faf5ee; --bg-soft:#f3ead9; --card:#fffdf8; --card2:#f8f0e2;
      --text:#291d12; --text2:#6f5c48; --text3:#a08c74;
      --border:#e8dcc8; --border2:#dccdb4;
      --primary:#c46a1b; --primary-2:#a6540f; --accent:#e08a2e;
      --primary-glow:rgba(196,106,27,.16);
      --wa:#1da851; --wa-dark:#128c3e;
      --danger:#d64545;
      --shadow:0 8px 30px rgba(120,80,30,.12);
      --hero-grad:radial-gradient(120% 90% at 50% 0%, rgba(224,138,46,.14) 0%, rgba(250,245,238,0) 60%);
      --surface-grad:linear-gradient(180deg,#fffdf8 0%,#faf5ee 100%);
    }

    /* Scrollbars — theme-aware, thin pill design (WebKit + Firefox) */
    :root[data-theme="dark"]{--scr-thumb:rgba(245,239,230,.18);--scr-thumb-hover:rgba(245,239,230,.34)}
    :root[data-theme="light"]{--scr-thumb:rgba(41,29,18,.18);--scr-thumb-hover:rgba(41,29,18,.34)}
    *{scrollbar-width:thin;scrollbar-color:var(--scr-thumb) transparent}
    *::-webkit-scrollbar{width:9px;height:9px}
    *::-webkit-scrollbar-track{background:transparent}
    *::-webkit-scrollbar-thumb{background:var(--scr-thumb);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
    *::-webkit-scrollbar-thumb:hover{background:var(--scr-thumb-hover);border:2px solid transparent;background-clip:padding-box}
    *::-webkit-scrollbar-corner{background:transparent}

    html{-webkit-text-size-adjust:100%}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; padding-bottom:110px;
      transition:background .3s ease,color .3s ease;
      -webkit-tap-highlight-color:transparent;
    }
    html[lang="ar"] body, html[lang="ar"] button, html[lang="ar"] input{font-family:'Noto Kufi Arabic',system-ui,sans-serif}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
    a{color:inherit;text-decoration:none}
    img{display:block}
    input{font-family:inherit}

    /* ═══ LOADING ═══ */
    .loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:14px}
    .loading-screen .cup{width:52px;height:52px;border:3px solid var(--border2);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;position:relative}
    .loading-screen .cup::after{content:'';position:absolute;inset:8px;border:2px solid var(--primary);border-radius:50%;opacity:.35}
    .loading-screen p{color:var(--text2);font-size:14px;letter-spacing:.3px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ═══ FLOATING CONTROLS (theme + lang) ═══ */
    .controls{
      position:fixed;inset-inline-end:14px;top:14px;z-index:60;
      display:flex;gap:8px;
      transition:opacity .22s ease,transform .22s ease;
    }
    .controls.fade{opacity:0;pointer-events:none;transform:translateY(-10px)}
    .ctl{
      width:40px;height:40px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:color-mix(in srgb,var(--card) 88%,transparent);
      border:1px solid var(--border2);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      font-size:17px;transition:transform .15s ease,background .2s ease;
      box-shadow:var(--shadow);
    }
    .ctl:hover{transform:scale(1.08)}
    .ctl.lang{font-size:12px;font-weight:700;color:var(--text);padding:0 12px;width:auto;border-radius:20px}
    .ctl.cur{font-size:11px;font-weight:800;color:var(--text);padding:0 11px;width:auto;border-radius:20px;letter-spacing:.4px;font-variant-numeric:tabular-nums}

    /* ═══ HERO (compact) ═══ */
    .hero{
      text-align:center;padding:48px 20px 18px;
      background:var(--surface-grad),var(--hero-grad);
      border-bottom:1px solid var(--border);
      position:relative;overflow:hidden;
    }
    .hero::before{
      content:'';position:absolute;inset:0;pointer-events:none;
      background-image:radial-gradient(var(--border2) 1px,transparent 1px);
      background-size:26px 26px;opacity:.18;
    }
    .hero-inner{position:relative}
    .hero .logo{width:54px;height:54px;border-radius:50%;object-fit:cover;margin:0 auto 10px;border:2px solid var(--primary);box-shadow:0 0 0 5px var(--primary-glow)}
    .hero h1{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
    .hero .tagline{color:var(--text2);font-size:12.5px}
    .hero .contact-row{display:flex;justify-content:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--text2);flex-wrap:wrap}
    .hero .contact-row a,.hero .contact-row span{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border);border-radius:20px;background:color-mix(in srgb,var(--card) 70%,transparent);color:var(--text);font-weight:600;font-size:11px}
    .hero .contact-row a:hover{border-color:var(--primary)}

    /* ═══ STICKY RAIL (categories) ═══ */
    .rail-wrap{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
    .rail-wrap::after{content:'';position:absolute;top:0;bottom:0;right:0;width:28px;z-index:2;pointer-events:none;background:linear-gradient(to left,var(--bg) 4%,transparent 100%)}
    html[dir="rtl"] .rail-wrap::after{right:auto;left:0;background:linear-gradient(to right,var(--bg) 4%,transparent 100%)}
    .cat-tabs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .cat-tabs::-webkit-scrollbar{display:none}
    .cat-tab{
      flex:0 0 auto;padding:11px 16px;border-radius:16px;border:1px solid var(--border);
      background:var(--card);color:var(--text2);font-size:13.5px;font-weight:700;white-space:nowrap;
      transition:.18s ease;
    }
    .cat-tab:active{transform:scale(.96)}
    .cat-tab.active{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:800}

    /* ═══ CATEGORY HERO (P1.7) ═══ */
    .cat-hero{
      position:relative;border-radius:18px;overflow:hidden;margin:10px 4px 0;
      min-height:128px;display:flex;align-items:flex-end;isolation:isolate;
      background:linear-gradient(180deg,var(--primary) 0%,var(--primary-2) 100%);
    }
    .cat-hero img.cat-hero-bg{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;
    }
    .cat-hero::after{
      content:'';position:absolute;inset:0;z-index:-1;
      background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72) 100%);
    }
    .cat-hero-inner{padding:18px 18px 16px;color:#fff;width:100%}
    .cat-hero-eyebrow{
      display:inline-flex;align-items:center;gap:6px;
      font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
      background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.28);
      padding:4px 10px;border-radius:999px;backdrop-filter:blur(6px);
    }
    .cat-hero-inner h2{margin:10px 0 0;font-size:24px;line-height:1.2}
    .cat-hero-inner p{margin:6px 0 0;font-size:13px;line-height:1.5;opacity:.94;max-width:46ch}

    /* ═══ DEALS (slim strip) ═══ */
    .deals-scroll{display:flex;gap:10px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
    .deals-scroll::-webkit-scrollbar{display:none}
    .deal-card{
      flex:0 0 auto;width:196px;border-radius:16px;padding:12px 14px;
      background:linear-gradient(135deg,var(--primary),var(--primary-2));
      color:#fff;position:relative;overflow:hidden;
      box-shadow:0 6px 18px var(--primary-glow);
      cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;-webkit-tap-highlight-color:transparent;
      display:flex;flex-direction:column;
    }
    .deal-card:active{transform:scale(.97)}
    .deal-card.added{outline:2px solid #fff;outline-offset:2px;box-shadow:0 0 0 4px var(--primary-glow), 0 6px 18px var(--primary-glow)}
    .deal-ribbon{position:absolute;top:0;inset-inline-start:12px;background:rgba(0,0,0,.22);color:#fff;font-size:9.5px;font-weight:800;padding:4px 9px;border-radius:0 0 10px 10px;letter-spacing:.5px}
    .deal-card h3{font-size:13.5px;font-weight:800;margin:10px 0 2px;line-height:1.3}
    .deal-card p{font-size:11px;opacity:.95;line-height:1.45;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .deal-badge{align-self:flex-start;display:inline-block;font-size:10px;font-weight:800;background:rgba(255,255,255,.2);padding:3px 9px;border-radius:12px;margin:6px 0 10px}
    .deal-add{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;margin-top:auto;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.28);padding:6px 15px;border-radius:20px;letter-spacing:.3px;transition:.15s ease}
    .deal-card.added .deal-add{background:rgba(255,255,255,.95);color:var(--primary)}

    /* ═══ MENU (editorial tickets) ═══ */
    .menu-wrap{max-width:1080px;margin:0 auto;padding:8px 14px}
    .section-label{display:flex;align-items:center;gap:10px;margin:10px 4px 8px;color:var(--text3);font-size:12px;font-weight:700;letter-spacing:1px}
    .section-label::after{content:'';flex:1;height:1px;background:var(--border)}
    .item-card{
      background:var(--card);border:1px solid var(--border);border-radius:20px;
      padding:14px 16px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start;
      transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
      position:relative;overflow:hidden;
    }
    .item-card:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:var(--shadow)}
    .item-card.featured{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary),0 8px 24px var(--primary-glow)}
    .item-card.featured::before{content:"\f005";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;top:8px;inset-inline-end:10px;color:var(--accent);font-size:12px}

    .item-media{flex-shrink:0;background:none;border:none;padding:0;cursor:pointer;border-radius:18px;line-height:0}
    .item-media:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
    .item-img{width:72px;height:72px;border-radius:18px;object-fit:cover;border:1px solid var(--border)}
    .item-img.ph{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,var(--card2),var(--border));display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--text3)}

    /* Favorites heart on cards (P2.1) */
    .fav-heart{position:absolute;top:12px;inset-inline-end:12px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.42);color:#fff;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:transform .15s ease,background .15s ease}
    .fav-heart:hover{transform:scale(1.12)}
    .fav-heart.on{background:rgba(190,24,93,.72)}

    /* Favorites rail (P2.1) */
    .fav-rail{display:none;padding:2px 16px 8px}
    .fav-rail.show{display:block}
    .fav-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--text2);margin-bottom:6px}
    .fav-head .clear-favs{margin-inline-start:auto;background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;font-weight:700}
    .fav-track{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
    .fav-track::-webkit-scrollbar{display:none}
    .fav-card{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:5px 8px 5px 5px;text-align:start;cursor:pointer;transition:border-color .18s ease}
    .fav-card:hover{border-color:var(--border2)}
    .fav-thumb{width:40px;height:40px;border-radius:10px;object-fit:cover;flex-shrink:0;background:linear-gradient(135deg,var(--card2),var(--border));display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text3);line-height:1}
    .fav-txt{min-width:0;display:flex;flex-direction:column}
    .fav-name{font-size:11.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:110px}
    .fav-price{font-size:10.5px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

    /* Similar products rail (P2.3) */
    .similar-sec{margin-top:6px;padding-bottom:6px}
    .similar-head{font-size:11.5px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
    .similar-track{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
    .similar-track::-webkit-scrollbar{display:none}

    .item-body{flex:1;min-width:0}
    .item-name-btn{background:none;border:none;padding:0;margin:0;color:inherit;font:inherit;cursor:pointer;text-align:start;min-width:0}
    .item-name-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
    .item-top{display:flex;align-items:baseline;gap:8px}
    .item-name{font-size:15.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-dots{flex:1;border-bottom:2px dotted var(--border2);transform:translateY(-4px);min-width:12px}
    .item-price{font-size:15.5px;font-weight:800;color:var(--primary);white-space:nowrap;font-variant-numeric:tabular-nums}
    .price-from{font-size:13.5px;font-weight:700;color:var(--text2)}
    .item-sub{display:flex;align-items:baseline;gap:8px;margin-top:2px}
    .item-name-ar{font-size:12.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
    .item-desc{font-size:12px;color:var(--text2);line-height:1.55;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

    /* kcal + prep meta (P1.4) */
    .item-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .item-meta span{font-size:10.5px;font-weight:700;color:var(--text3);background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}

    /* allergen icon chips (P1.5) */
    .allergen-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
    .allg-chip{font-size:13px;line-height:1;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--border);border-radius:50%;filter:saturate(.9)}

    .badge-feat{display:inline-block;font-size:9.5px;font-weight:800;background:var(--primary);color:#fff;padding:2px 8px;border-radius:10px;margin-inline-start:8px;letter-spacing:.3px;transform:translateY(-1px)}

    /* Item badges (P1.3) — New / Popular / Chef's Choice */
    .badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .badge-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.4px;padding:3px 9px;border-radius:999px;color:#fff}
    .badge-chip.b-new{background:#16a34a}
    .badge-chip.b-popular{background:var(--primary)}
    .badge-chip.b-chef{background:#c026d3}

    /* Stepper */
    .stepper{
      display:inline-flex;align-items:center;gap:4px;margin-top:8px;
      background:var(--card2);border:1px solid var(--border2);border-radius:30px;padding:4px;
      width:fit-content;
    }
    .stepper button{width:30px;height:30px;border-radius:50%;background:var(--card);border:1px solid var(--border2);color:var(--text);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.15s ease}
    .stepper button:active{transform:scale(.9)}
    .stepper button.minus:hover{border-color:var(--danger);color:var(--danger)}
    .stepper button.plus{background:var(--primary);border-color:var(--primary);color:#fff}
    .stepper button.plus:hover{background:var(--primary-2);border-color:var(--primary-2)}
    .stepper input{
      width:46px;text-align:center;background:transparent;border:none;color:var(--text);
      font-size:15px;font-weight:700;-moz-appearance:textfield;outline:none;
    }
    .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    .add-btn{
      display:inline-flex;align-items:center;gap:7px;margin-top:8px;
      padding:8px 18px;border-radius:30px;background:var(--primary);color:#fff;
      font-size:13px;font-weight:700;transition:.15s ease;box-shadow:0 4px 14px var(--primary-glow);
    }
    .add-btn:hover{background:var(--primary-2)}
    .add-btn:active{transform:scale(.95)}
    .add-btn span{font-size:16px;line-height:1}

    /* ═══ VIEW TOGGLE (grid view) ═══ */
    .items-col{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .items-col .item-card{flex-direction:column;align-items:stretch;gap:9px;padding:10px 12px 12px;margin-bottom:0;border-radius:16px}
    .items-col .item-media{width:100%}
    .items-col .item-img,.items-col .item-img.ph{width:100%;height:auto;aspect-ratio:1/1;border-radius:14px;font-size:30px}
    .items-col .item-top{flex-wrap:wrap;gap:4px 8px}
    .items-col .item-name{font-size:14px}
    .items-col .item-desc{-webkit-line-clamp:2;font-size:11.5px;margin-top:3px}
    .items-col .item-sub{margin-top:2px}
    .items-col .item-name-ar{font-size:11px}
    .items-col .item-body{display:flex;flex-direction:column}
    .items-col .item-card .add-btn,.items-col .stepper{margin-top:auto;width:100%;justify-content:center}
    .items-col .add-btn{height:40px;border-radius:14px;font-size:12.5px;margin-top:8px}
    .items-col .stepper{margin-top:8px}
    .items-col .badge-feat{display:none}
    .items-col .item-card.featured::before{display:none}
    .ctl.view{font-size:15px}

    /* ═══ FLOATING CART (bottom bar mobile / centered pill desktop) ═══ */
    .cart-fab{position:fixed;bottom:14px;left:12px;right:12px;z-index:55;display:none;filter:drop-shadow(var(--shadow));transform-origin:50% 100%}
    .cart-fab.visible{display:flex;justify-content:center;animation:pop .25s ease}
    .cart-pill{
      display:flex;align-items:center;justify-content:center;gap:14px;width:100%;max-width:560px;
      background:var(--text);color:var(--bg);padding:10px 12px 10px 18px;border-radius:26px;
    }
    .cart-count-wrap{display:flex;align-items:center;gap:8px}
    .cart-badge{background:var(--primary);color:#fff;font-weight:800;font-size:12px;min-width:26px;height:26px;border-radius:26px;display:flex;align-items:center;justify-content:center;padding:0 7px}
    .cart-total{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
    .cart-total-hint{font-size:12px;font-weight:700;opacity:.72}
    .cart-review{background:var(--primary);color:#fff;padding:12px 20px;border-radius:18px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;transition:.15s ease;white-space:nowrap}
    .cart-review:hover{background:var(--primary-2)}
    .cart-review:active{transform:scale(.96)}
    @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

    /* ═══ ORDER MODAL ═══ */
    .order-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
    .order-modal.visible{display:flex}
    .order-sheet{
      background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:520px;
      max-height:85vh;overflow-y:auto;padding:22px 20px calc(20px + env(safe-area-inset-bottom));
      animation:slideUp .3s ease;
    }
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .sheet-head h3{font-size:18px;font-weight:800}
    .sheet-close{width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:15px}
    .order-line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
    .order-line:last-of-type{border-bottom:none}
    .ol-name{flex:1;font-size:13.5px;font-weight:600;min-width:0}
    .ol-name small{display:block;color:var(--text3);font-weight:400;font-size:11px}
    .ol-name small.ol-variant{color:var(--primary);font-weight:700;font-size:11.5px}
    .ol-price{font-size:13.5px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;white-space:nowrap}
    .order-line.offer-line{background:var(--card2);border-radius:14px;padding:10px 12px;margin:8px 0;border-bottom:none}
    .order-line.offer-line .ol-name small{color:var(--primary);font-weight:600}
    .ol-remove{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--border2);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:13px;transition:.15s;cursor:pointer}
    .ol-remove:hover{border-color:var(--danger);color:var(--danger)}
    .order-total-row{display:flex;justify-content:space-between;padding:14px 0 4px;font-size:17px;font-weight:800;border-top:2px solid var(--border2);margin-top:6px;font-variant-numeric:tabular-nums}
    .order-sub-row{display:flex;justify-content:space-between;padding:10px 0 2px;font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
    .order-disc-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px;font-weight:700;color:#10b981;font-variant-numeric:tabular-nums;gap:10px}
    .order-disc-row .disc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .order-disc-row .disc-amt{white-space:nowrap}
    .ol-save{color:#10b981}
    .ol-muted{color:var(--text3);font-weight:600;opacity:.8}
    .order-note{width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--border2);border-radius:14px;background:var(--card2);font-size:13px;resize:none;min-height:64px;color:var(--text)}
    .order-note::placeholder{color:var(--text3)}
    .order-phone{margin-top:10px;min-height:46px;font-family:inherit}
    .order-whatsapp{width:100%;margin-top:12px;padding:15px;border:none;border-radius:16px;background:var(--wa);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;transition:.15s ease;box-shadow:0 6px 20px rgba(37,211,102,.3)}
    .order-whatsapp:hover{background:var(--wa-dark)}
    .order-whatsapp:disabled{opacity:.5;pointer-events:none}
    .om-row{display:flex;align-items:center;gap:12px;margin-top:14px}
    .om-label{font-size:11.5px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;flex:0 0 auto}
    .om-toggle{display:flex;gap:8px;flex:1}
    .om-btn{flex:1;padding:10px 8px;border-radius:12px;border:1px solid var(--border2);background:var(--card2);color:var(--text2);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s ease;font-family:inherit;white-space:nowrap}
    .om-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
    /* Delivery location (P3.1) */
    .dl-block{margin-top:10px;border:1px solid var(--border2);border-radius:16px;padding:12px;background:var(--card2)}
    .dl-addr-wrap{display:flex;gap:8px;align-items:center}
    .dl-addr-wrap input{flex:1;min-width:0}
    .dl-loc-btn{flex-shrink:0;padding:10px 12px;border-radius:12px;border:1px solid var(--border2);background:var(--card2);color:var(--text2);cursor:pointer;font-size:13px;font-family:inherit}
    .dl-loc-btn:active{transform:scale(.95)}
    .dl-map{position:relative;z-index:0;height:200px;border-radius:14px;border:1px solid var(--border2);margin-top:10px;overflow:hidden;direction:ltr}
    .dl-map .leaflet-control-attribution{font-size:9px}
    .dl-hint{font-size:11.5px;color:var(--text2);margin-top:8px;display:flex;align-items:center;gap:6px}
    .dl-fallback{padding:30px 12px;text-align:center;color:var(--text2);font-size:12.5px;border:1px solid var(--border2);border-radius:14px;margin-top:10px}
    .dir-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:12px 16px;background:var(--primary);color:#fff;border-radius:14px;font-size:14px;font-weight:700;text-decoration:none;transition:transform .15s ease,opacity .15s ease}
    .dir-btn:active{transform:scale(.97)}
    .table-chip{flex:1;padding:10px 14px;border-radius:12px;border:1px dashed var(--border2);background:var(--card2);color:var(--text1);font-size:13px;font-weight:800}
    .om-select{flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--border2);background:var(--card2);color:var(--text1);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;min-width:0}
    .survey-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:120;display:none;align-items:center;justify-content:center;padding:20px}
    .survey-modal.visible{display:flex}
    .survey-card{width:100%;max-width:340px;background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:22px 18px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
    .survey-head{font-size:16px;font-weight:800;margin-bottom:6px}
    .survey-sub{font-size:12px;color:var(--text3);margin-bottom:14px}
    .survey-stars{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
    .survey-star{font-size:30px;line-height:1;background:none;border:none;cursor:pointer;color:var(--border2);padding:2px;transition:color .12s ease, transform .12s ease}
    .survey-star.on{color:#f5b301}
    .survey-star:active{transform:scale(1.25)}
    .survey-comment{width:100%;min-height:64px;border:1px solid var(--border2);border-radius:12px;background:var(--card2);color:var(--text1);padding:10px;font-family:inherit;font-size:13px;resize:vertical;margin-bottom:12px;box-sizing:border-box}
    .survey-submit{width:100%;padding:12px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
    .survey-skip{display:inline-block;margin-top:10px;background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;text-decoration:underline}
    .promo-badge{font-size:44px;line-height:1;margin:2px 0 4px}
    .promo-eyebrow{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--primary);margin-bottom:8px}
    .promo-title{font-size:17px;font-weight:800;margin-bottom:8px}
    .promo-desc{font-size:13px;color:var(--text3);margin-bottom:16px;line-height:1.55}
    .promo-foot{margin-top:8px;font-size:11px;color:var(--text3)}

    /* ═══ PRODUCT DETAIL SHEET (P1.2) ═══ */
    .product-sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:520px;height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .3s ease}
    .pd-hero{position:relative;height:230px;flex:0 0 auto;background:var(--card2);overflow:hidden}
    .pd-hero img{width:100%;height:100%;object-fit:cover;display:block}
    .pd-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:64px}
    .pd-close{position:absolute;top:14px;inset-inline-end:14px;background:rgba(0,0,0,.45);color:#fff;width:36px;height:36px;z-index:2;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
    .pd-close:hover{background:rgba(0,0,0,.65)}
    .pd-share{inset-inline-end:58px}
    .pd-copy{inset-inline-end:102px}
    .pd-fav{inset-inline-end:146px}
    .pd-fav.on{background:rgba(190,24,93,.78)}
    .pd-body{padding:18px 20px 8px;overflow-y:auto;overscroll-behavior:contain;flex:1}
    .pd-body .badge-row{margin-top:0;margin-bottom:10px}
    .pd-name{font-size:21px;font-weight:800;line-height:1.25}
    .pd-sub{color:var(--text3);font-size:13px;margin-top:3px}
    .pd-desc{color:var(--text2);font-size:13.5px;line-height:1.65;margin-top:10px}
    .pd-item-meta{margin-top:12px}
    .pd-var-row{display:flex;flex-direction:column;gap:9px;margin-top:12px;border-top:1px dashed var(--border);padding-top:13px}
    .pd-var-group{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
    .pd-var{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px 12px;border:1.5px solid var(--border2);border-radius:14px;background:var(--card2);cursor:pointer;text-align:start;transition:.15s;font-family:inherit}
    .pd-var .pv-name{font-size:13px;font-weight:700;color:var(--text)}
    .pd-var .pv-price{font-size:12px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums}
    .pd-var.active{border-color:var(--primary);background:color-mix(in srgb, var(--primary) 12%, var(--card));box-shadow:0 0 0 1px var(--primary)}
    .pd-var:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
    .pd-label{display:block;font-size:11.5px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
    .pd-allg-row{display:flex;flex-direction:column;gap:9px;margin-top:12px;border-top:1px dashed var(--border);padding-top:13px}
    .pd-allg-list{display:flex;flex-wrap:wrap;gap:8px}
    .pd-allg-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:6px 12px}
    .pd-allg-none{font-size:12.5px;color:var(--text3);background:var(--card2);border:1px dashed var(--border);border-radius:10px;padding:8px 12px}
    .pd-note-wrap{margin-top:12px;border-top:1px dashed var(--border);padding-top:13px}
    .pd-note-wrap .order-note{margin-top:8px}
    .pd-actions{display:flex;align-items:center;gap:12px;padding:14px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--border);flex:0 0 auto;background:var(--card)}
    .pd-actions .stepper{width:auto;margin-top:0}
    .pd-add{flex:1;background:var(--primary);color:#fff;border:none;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:.15s;box-shadow:0 6px 20px rgba(0,0,0,.14)}
    .pd-add:hover{background:var(--primary-2)}
    .pd-add:active{transform:scale(.97)}
    .pd-add-price{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

    /* ═══ SEARCH OVERLAY (P1.8) ═══ */
    .search-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:110;display:none;align-items:flex-start;justify-content:center}
    .search-modal.visible{display:flex}
    .search-sheet{background:var(--card);width:100%;max-width:560px;margin-top:9vh;border-radius:24px;max-height:76vh;display:flex;flex-direction:column;overflow:hidden;animation:slideDown .25s ease;border:1px solid var(--border)}
    .search-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
    .search-input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--border2);border-radius:14px;padding:12px 14px;color:var(--text);font-size:15px;outline:none;font-family:inherit;font-variant-numeric:tabular-nums}
    .search-input:focus{border-color:var(--primary)}
    .search-input::placeholder{color:var(--text3)}
    .voice-btn{width:40px;height:40px;flex:0 0 auto;border-radius:50%;background:var(--card2);border:1px solid var(--border2);color:var(--text2);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease}
    .voice-btn:hover{color:var(--text)}
    .voice-btn.recording{background:rgba(239,68,68,.16);color:#ef4444;border-color:rgba(239,68,68,.5);animation:rec-pulse 1.2s infinite}
    @keyframes rec-pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.35)}50%{box-shadow:0 0 0 9px rgba(239,68,68,0)}}
    .search-body{overflow-y:auto;overscroll-behavior:contain;padding:6px 14px 16px}
    .search-group-title{font-size:11.5px;font-weight:800;letter-spacing:.6px;color:var(--text3);text-transform:uppercase;margin:12px 4px 6px}
    .search-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px;width:100%;text-align:start;cursor:pointer;background:transparent;border:none;transition:background .15s ease;font-family:inherit}
    .search-row:hover{background:var(--card2)}
    .search-row:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
    .sr-media{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:var(--card2)}
    .sr-media.ph{display:flex;align-items:center;justify-content:center;font-size:22px}
    .sr-info{flex:1;min-width:0}
    .sr-name{font-weight:700;font-size:14.5px;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .sr-name .badge-row{margin:0}
    .sr-sub{font-size:12px;color:var(--text3);margin-top:2px}
    .sr-price{flex:none;color:var(--primary);font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
    .sr-price .item-price{font-size:13.5px;font-weight:800;color:inherit}
    .sr-empty{text-align:center;padding:40px 16px;color:var(--text3);font-size:14px}
    @keyframes slideDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}

    /* ═══ INFO MODAL (P1.9) ═══ */
    .info-sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .3s ease}
    .info-body{overflow-y:auto;overscroll-behavior:contain;padding:18px 20px calc(20px + env(safe-area-inset-bottom))}
    .info-head{display:flex;align-items:center;gap:14px;padding:20px 20px 0}
    .info-logo{width:58px;height:58px;border-radius:18px;object-fit:cover;flex:none;background:var(--card2)}
    .info-logo.ph{display:flex;align-items:center;justify-content:center;font-size:26px}
    .info-title{font-size:19px;font-weight:800}
    .info-sub{font-size:12.5px;color:var(--text3);margin-top:2px}
    .info-section{margin-top:16px;border-top:1px dashed var(--border);padding-top:14px}
    .info-label{font-size:11.5px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .info-openchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.2px;text-transform:none;padding:4px 10px;border-radius:999px}
    .info-openchip.open{background:rgba(34,197,94,.16);color:#22c55e;border:1px solid rgba(34,197,94,.35)}
    .info-openchip.closed{background:rgba(239,68,68,.14);color:#ef4444;border:1px solid rgba(239,68,68,.35)}
    .info-text{font-size:13.5px;color:var(--text2);line-height:1.7}
    .info-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--border);color:var(--text)}
    .info-row:last-child{border-bottom:none}
    .info-row .dow{font-weight:700;flex:none}
    .info-row .hrs{color:var(--text2);font-variant-numeric:tabular-nums;direction:ltr}
    .info-link{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;padding:12px;border-radius:14px;background:var(--primary);color:#fff;font-weight:800;font-size:14px;transition:.15s;border:none;font-family:inherit}
    .info-link.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border2);font-weight:700}
    .info-link:hover{background:var(--primary-2)}
    .info-link.ghost:hover{background:var(--border2)}
    .info-socials{display:flex;gap:10px;flex-wrap:wrap}
    .wifi-block{display:flex;flex-direction:column;gap:10px}
    .wifi-row{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
    .wifi-ico{font-size:17px;line-height:1}
    .wifi-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
    .wifi-cap{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
    .wifi-val{font-size:13.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
    .wifi-act{background:none;border:none;cursor:pointer;font-size:14px;line-height:1;padding:4px}
    .info-social{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;border:1px solid var(--border2);background:var(--card2);color:var(--text);font-weight:700;font-size:13px;text-decoration:none;transition:.15s}
    .info-social:hover{border-color:var(--primary);color:var(--primary)}
    .info-legal{margin-top:14px;padding:11px 14px;border:1px dashed var(--border);border-radius:12px;background:var(--card2);font-size:12px;color:var(--text3);line-height:1.6}

    /* Empty */
    .empty-msg{text-align:center;padding:46px 16px;color:var(--text3);font-size:14px}
    .empty-msg .big{font-size:34px;display:block;margin-bottom:10px}

    /* Footer */
    .shop-footer{text-align:center;padding:24px 16px;color:var(--text3);font-size:12px;border-top:1px solid var(--border);margin-top:28px}

    /* Toast */
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);z-index:120;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:30px;font-size:12.5px;font-weight:600;opacity:0;transition:.25s ease;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* Install banner (P2.4) */
    .install-banner{position:fixed;left:16px;right:16px;bottom:96px;z-index:90;display:none;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
    .install-banner.show{display:flex}
    .ib-ico{font-size:16px;line-height:1}
    .ib-text{flex:1;font-size:12.5px;color:var(--text);line-height:1.35}
    .ib-btn{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:800;cursor:pointer}

    @media (max-width:420px){
      .hero{padding:44px 14px 16px}
      .item-img,.item-img.ph{width:60px;height:60px;border-radius:14px}
      .menu-wrap{padding:8px 10px}
      .item-card{padding:12px 13px}
      .deals-scroll{padding:10px 12px}
    }
    @media (min-width:720px){
      .menu-wrap{padding:10px 20px}
      .hero{padding:52px 20px 22px}
      .hero .logo{width:62px;height:62px}
      .hero h1{font-size:24px}
      .hero .tagline{font-size:14px}
      .items-col{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
      .cart-pill{justify-content:space-between}
      .cart-review{margin-inline-start:auto}
    }
    @media (min-width:1080px){
      .items-col{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
    }

    /* FA icon sizing */
    .ctl i{font-size:16px;line-height:1;pointer-events:none}
    .fav-heart i{font-size:15px;line-height:1}
    .sheet-close i{pointer-events:none}
    .hero .contact-row i{font-size:12px;width:15px;text-align:center}
    .item-meta i{font-size:11px;margin-inline-end:2px}
    .deal-badge i,.promo-badge i{font-size:11px;margin-inline-end:2px}
    .empty-msg .big i{font-size:32px;line-height:1}
    .order-whatsapp i{font-size:15px;margin-inline-end:4px}
    .wifi-ico i{font-size:16px}
    .info-logo.ph i{font-size:32px}
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
</head>
<body>
  <!-- Loading -->
  <div class="loading-screen" id="loading">
    <div class="cup"></div>
    <p id="loading-text">جارٍ تحميل القائمة...</p>
  </div>

  <!-- Controls -->
  <div class="controls" id="floating-controls">
    <button class="ctl view" id="view-btn" onclick="toggleView()" title="View" aria-label="Toggle view mode" aria-pressed="false"><i class="fa-solid fa-table-cells-large"></i></button>
    <button class="ctl" id="theme-btn" onclick="toggleTheme()" title="Theme" aria-label="Toggle theme"><i class="fa-solid fa-sun"></i></button>
    <button class="ctl cur" id="currency-btn" onclick="cycleCurrency()" title="Currency" aria-label="Currency" style="display:none">SYP</button>
    <button class="ctl" id="search-btn" onclick="openSearch()" title="Search" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
    <button class="ctl" id="info-btn" onclick="openInfo()" title="Info" aria-label="Info"><i class="fa-solid fa-circle-info"></i></button>
    <button class="ctl lang" id="lang-btn" onclick="toggleLang()">EN</button>
  </div>

  <!-- Shop header (injected) -->
  <header class="hero" id="shop-header" style="display:none"><div class="hero-inner" id="hero-inner"></div></header>

  <!-- Category rail (injected) -->
  <div class="rail-wrap" id="rail-wrap" style="display:none"><div class="cat-tabs" id="cat-tabs"></div></div>

  <!-- Favorites rail (P2.1, localStorage) -->
  <div class="fav-rail" id="fav-rail">
    <div class="fav-head"><span id="fav-head-label"><i class="fa-solid fa-heart"></i> المفضلة</span><button class="clear-favs" onclick="clearFavs()"></button></div>
    <div class="fav-track" id="fav-track"></div>
  </div>

  <!-- Deals (injected) -->
  <div class="deals-scroll" id="deals-section" style="display:none"></div>

  <!-- Menu -->
  <main class="menu-wrap">
    <div class="cat-hero" id="cat-hero" style="display:none"></div>
    <div class="section-label" id="section-label" style="display:none"></div>
    <div id="items-grid" style="display:none"></div>
  </main>

  <!-- Floating cart -->
  <div class="cart-fab" id="cart-fab">
    <div class="cart-pill">
      <div class="cart-count-wrap">
        <span class="cart-badge" id="cart-count">0</span>
        <span class="cart-total" id="cart-total">0</span>
      </div>
      <button class="cart-review" onclick="openOrderSheet()"><span id="cart-review-text">الطلب</span> ⟨⟩</button>
    </div>
  </div>

  <!-- Order modal -->
  <div class="order-modal" id="order-modal" onclick="if(event.target===this)closeOrderSheet()">
    <div class="order-sheet" id="order-sheet"></div>
  </div>

  <!-- Product detail modal (P1.2) -->
  <div class="order-modal" id="product-modal" onclick="if(event.target===this)closeProductSheet()">
    <div class="product-sheet" id="product-sheet"></div>
  </div>

  <!-- Instant search overlay (P1.8) -->
  <div class="search-modal" id="search-modal" onclick="if(event.target===this)closeSearch()">
    <div class="search-sheet" id="search-sheet">
      <div class="search-head">
        <input class="search-input" id="search-input" autocomplete="off" enterkeyhint="search" spellcheck="false" oninput="searchRender(this.value)" aria-label="Search">
        <button class="voice-btn" id="voice-btn" onclick="toggleVoice()" title="Voice search" aria-label="Voice search" style="display:none"><i class="fa-solid fa-microphone"></i></button>
        <button class="sheet-close" onclick="closeSearch()" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="search-body" id="search-body"></div>
    </div>
  </div>

  <!-- Info modal (P1.9): about, hours, address+directions, phone, socials, legal note -->
  <div class="order-modal" id="info-modal" onclick="if(event.target===this)closeInfo()">
    <div class="info-sheet" id="info-sheet"></div>
  </div>

  <!-- Satisfaction survey modal (P2.9) -->
  <div class="survey-modal" id="survey-modal" onclick="if(event.target===this)closeSurvey()">
    <div class="survey-card" id="survey-card"></div>
  </div>

  <!-- Campaign/promo landing modal (P2.10, one-time per campaign) -->
  <div class="survey-modal" id="campaign-modal" onclick="if(event.target===this)closeCampaign()">
    <div class="survey-card" id="campaign-card"></div>
  </div>

  <div class="shop-footer" id="shop-footer" style="display:none"></div>

  <!-- Install banner (P2.4, beforeinstallprompt) -->
  <div class="install-banner" id="install-banner">
    <span class="ib-ico">⬇️</span>
    <span class="ib-text" id="ib-text"></span>
    <button class="ib-btn" id="ib-btn" onclick="installPWA()"></button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ─── STATE ──────────────────────────────────────────────
    let shop = null, categories = [], items = [], deals = [];
    let lang = 'ar';
    let theme = localStorage.getItem('qm-theme') || 'dark';
    let activeCurrency = 'SYP';
    let activeCategory = null;
    let cart = {}; // { itemId: qty }
    let cartOffers = {}; // { dealId: 1 } — offers added to the order
    let customerPhone = localStorage.getItem('qm-phone') || ''; // P3: optional phone for admin replies
    let cartNotes = {}; // { itemId: note } — per-item note (P1.2), in-memory like cart
    let selectedVariants = {}; // { itemId: variantIndex } — chosen size/option (P1.6)
    let currentProductId = null; // open product sheet (P1.2)
    let sheetQty = 1;
    let sheetVariant = 0; // chosen variant index while the sheet is open (P1.6)
    let viewMode = localStorage.getItem('qm-view') || 'grid'; // 'grid' | 'list'
    let outlets = []; // P2.8: active outlets for this shop
    let selectedOutletId = null; // P2.8: persisted in qm-outlet-id
    let allBadges = []; // P3: shop_badges catalog (custom badges)
    let allAllergens = []; // P3: shop_allergens catalog (codes → labels/icons)

    // ─── INIT ───────────────────────────────────────────────
    (async () => {
      // Theme first (no flash)
      document.documentElement.dataset.theme = theme;
      updateThemeBtn();

      // Language: hash > saved > Arabic default
      const hash = window.location.hash.replace('#', '');
      if (hash === 'ar' || hash === 'en') lang = hash;
      else lang = localStorage.getItem('qm-lang') || 'ar';
      window.location.hash = lang;

      const slug = new URLSearchParams(window.location.search).get('shop');
      let query = sb.from('shops').select('*').eq('is_active', true);
      if (slug) query = query.eq('slug', slug);
      const { data: shops } = await query.limit(1);

      if (!shops || shops.length === 0) {
        document.getElementById('loading').innerHTML = '<p style="color:var(--text2)">لا يوجد متجر / No shop found.</p>';
        return;
      }
      shop = shops[0];
      activeCurrency = shop.currency_default || 'SYP';

      const { data: cats } = await sb.from('categories').select('*').eq('shop_id', shop.id).eq('is_active', true).order('sort_order');
      categories = cats || [];

      const { data: its } = await sb.from('items').select('*, item_prices(*)').eq('shop_id', shop.id).eq('is_available', true).order('sort_order');
      items = (its || []).filter(i => (i.item_prices || []).some(p => p.is_visible));

      const now = new Date().toISOString();
      const { data: dls } = await sb.from('deals').select('*').eq('shop_id', shop.id).eq('is_active', true)
        .or(`starts_at.is.null,starts_at.lte.${now}`).or(`ends_at.is.null,ends_at.gte.${now}`).order('sort_order');
      deals = dls || [];

      // Outlets (P2.8): only shops with >=2 active outlets show the branch selector
      const { data: outs } = await sb.from('outlets').select('*').eq('shop_id', shop.id).eq('is_active', true).order('sort_order');
      outlets = outs || [];
      const savedOut = localStorage.getItem('qm-outlet-id');
      selectedOutletId = outlets.some(o => o.id === savedOut) ? savedOut : (outlets.length ? outlets[0].id : null);

      // Badges + allergens catalogs (P3)
      const { data: bgs } = await sb.from('shop_badges').select('*').eq('shop_id', shop.id).eq('is_active', true).order('sort_order');
      allBadges = bgs || [];
      const { data: alg } = await sb.from('shop_allergens').select('*').eq('shop_id', shop.id).eq('is_active', true).order('sort_order');
      allAllergens = alg || [];

      document.documentElement.style.setProperty('--primary', shop.primary_color || '#e08a2e');
      document.documentElement.style.setProperty('--primary-2', shop.accent_color || shop.primary_color || '#c96a12');

      render();
      document.getElementById('loading').style.display = 'none';

      // Deep link (P1.10): ?item=<id> opens the product sheet after first paint
      const deepItem = new URLSearchParams(window.location.search).get('item');
      if (deepItem && items.some(i => i.id === deepItem)) {
        setTimeout(() => openProductSheet(deepItem), 400);
      } else {
        // Campaign landing (P2.10): one-time promo modal after first paint
        setTimeout(showCampaign, 1100);
      }
      // Table attribution (P2.7): ?table=<id> (rendered in order sheet + WhatsApp)
      const tabParam = new URLSearchParams(window.location.search).get('table');
      const tabVal = tabParam ? String(tabParam).trim() : '';
      if (tabVal) tableLabel = tabVal;
      initVoice();
      setupPWA();
    })();

    // ─── RENDER ─────────────────────────────────────────────
    function render() {
      applyLang();
      renderHeader();
      renderSEO();
      renderCurrencyBtn();
      renderCategories();
      renderCatHero();
      renderDeals();
      renderItems();
      renderViewBtn();
      renderFooter();
      renderFavRail();
      updateCartBar();
    }

    // ─── FAVORITES (P2.1) ─────────────────────────────────
    // localStorage 'qm_favs' = [itemId,...]; rail + card/sheet hearts.
    let favs = loadFavs();

    // ─── PWA (P2.4) ──────────────────────────────────────
    let deferredPrompt = null;
    function setupPWA() {
      // Script runs at end of body; register right away rather than on window.load
      // (the data fetch above may resolve AFTER load has already fired).
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        deferredPrompt = e;
        showInstallBanner(true);
      });
      window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        showInstallBanner(false);
      });
    }
    // Floating controls (theme/lang/search/info): hide while scrolling down so
    // they never stack over the sticky category rail; reappear on scroll-up or near top.
    (function setupFloatControls() {
      const ctl = document.getElementById('floating-controls');
      if (!ctl) return;
      let lastY = window.scrollY;
      let ticking = false;
      const update = () => {
        const y = window.scrollY;
        if (y > 160 && y > lastY) ctl.classList.add('fade');
        else if (y < lastY || y <= 160) ctl.classList.remove('fade');
        lastY = y;
        ticking = false;
      };
      window.addEventListener('scroll', () => {
        if (!ticking) { ticking = true; requestAnimationFrame(update); }
      }, { passive: true });
    })();
    function showInstallBanner(show) {
      const b = document.getElementById('install-banner');
      if (!b) return;
      if (show) {
        const ar = lang === 'ar';
        document.getElementById('ib-text').textContent = ar ? 'ثبّت التطبيق لفتح القائمة بشكل أسرع' : 'Install the app for faster menu access';
        document.getElementById('ib-btn').textContent = ar ? 'تثبيت' : 'Install';
        b.classList.add('show');
      } else {
        b.classList.remove('show');
      }
    }
    function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => { deferredPrompt = null; showInstallBanner(false); });
    }
    function loadFavs() { try { return JSON.parse(localStorage.getItem('qm_favs') || '[]'); } catch (e) { return []; } }
    function saveFavs() { try { localStorage.setItem('qm_favs', JSON.stringify(favs)); } catch (e) {} }
    function isFav(id) { return favs.includes(id); }
    function toggleFav(id) {
      const on = !isFav(id);
      favs = on ? favs.concat(id) : favs.filter(x => x !== id);
      saveFavs();
      syncFavHearts();
      renderFavRail();
      toast(on ? (lang === 'ar' ? '♥ أُضيف إلى المفضلة' : '♥ Added to favorites') : (lang === 'ar' ? 'أُزيل من المفضلة' : 'Removed from favorites'));
    }
    function clearFavs() {
      favs = []; saveFavs(); syncFavHearts(); renderFavRail();
      toast(lang === 'ar' ? 'أُفرغت المفضلة' : 'Favorites cleared');
    }
    function favBtnHTML(item) {
      const on = isFav(item.id);
      return `<button class="fav-heart ${on ? 'on' : ''}" data-id="${item.id}" onclick="event.stopPropagation();toggleFav('${item.id}')" aria-label="${lang === 'ar' ? (on ? 'إزالة من المفضلة' : 'أضف إلى المفضلة') : (on ? 'Remove from favorites' : 'Add to favorites')}">${on ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>'}</button>`;
    }
    function syncFavHearts() {
      document.querySelectorAll('.fav-heart').forEach(b => {
        const on = isFav(b.dataset.id);
        b.classList.toggle('on', on);
        b.innerHTML = on ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
        b.setAttribute('aria-label', lang === 'ar' ? (on ? 'إزالة من المفضلة' : 'أضف إلى المفضلة') : (on ? 'Remove from favorites' : 'Add to favorites'));
      });
      const sf = document.getElementById('pd-fav-btn');
      if (sf) { const on = isFav(sf.dataset.id); sf.classList.toggle('on', on); sf.innerHTML = on ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>'; }
    }
    function renderFavRail() {
      const rail = document.getElementById('fav-rail');
      if (!rail) return;
      const list = favs.map(id => items.find(i => i.id === id)).filter(Boolean);
      if (!list.length) { rail.classList.remove('show'); return; }
      rail.classList.add('show');
      document.getElementById('fav-head-label').innerHTML = lang === 'ar' ? '<i class="fa-solid fa-heart"></i> المفضلة' : '<i class="fa-solid fa-heart"></i> Favorites';
      const clearLabel = lang === 'ar' ? 'مسح الكل' : 'Clear';
      rail.querySelector('.clear-favs').textContent = clearLabel;
      document.getElementById('fav-track').innerHTML = list.map(it => {
        const name = lang === 'ar' ? (it.name_ar || it.name) : it.name;
        const thumb = it.image_url
          ? `<img class="fav-thumb" src="${esc(it.image_url)}" alt="" loading="lazy">`
          : `<div class="fav-thumb">${emojiFor(it)}</div>`;
        return `<div class="fav-card" role="button" tabindex="0" onclick="openProductSheet('${it.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openProductSheet('${it.id}')}">
          ${thumb}
          <span class="fav-txt">
            <span class="fav-name">${esc(name)}</span>
            <span class="fav-price">${cardPriceHTML(it)}</span>
          </span>
        </div>`;
      }).join('');
    }

    function applyLang() {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('lang-btn').textContent = lang === 'en' ? 'AR' : 'EN';
      document.title = lang === 'ar' ? (shop?.name_ar || shop?.name || 'QR Menu') : (shop?.name || 'QR Menu');
      document.getElementById('loading-text').textContent = lang === 'ar' ? 'جارٍ تحميل القائمة...' : 'Loading menu...';
      document.getElementById('cart-review-text').textContent = lang === 'ar' ? 'الطلب' : 'Order';
      const label = document.getElementById('section-label');
      label.textContent = lang === 'ar' ? 'من القائمة' : 'FROM THE MENU';
    }

    // ─── SEO (meta + JSON-LD) ──────────────────────────────
    // Matches the professional platform pattern (OG, Twitter, canonical,
    // Restaurant schema + Menu/OfferCatalog) so shared links look rich.
    function renderSEO() {
      const cleanUrl = window.location.origin + window.location.pathname + window.location.search;
      const name = shop.name || 'QR Menu';
      const desc = (lang === 'ar' ? (shop.tagline_ar || shop.tagline) : shop.tagline)
        || (lang === 'ar' ? (shop.footer_text_ar || shop.footer_text) : shop.footer_text)
        || `Order from ${name} on WhatsApp`;
      const image = shop.logo_url || '';
      const setMeta = (sel, attr, val) => { const el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };

      document.title = lang === 'ar' ? (shop.name_ar || shop.name || 'QR Menu') : (shop.name || 'QR Menu');
      setMeta('meta[name="description"]', 'content', desc);
      setMeta('meta[property="og:title"]', 'content', name);
      setMeta('meta[property="og:description"]', 'content', desc);
      setMeta('meta[property="og:url"]', 'content', cleanUrl);
      setMeta('meta[property="og:image"]', 'content', image);
      setMeta('meta[name="twitter:title"]', 'content', name);
      setMeta('meta[name="twitter:description"]', 'content', desc);
      setMeta('meta[name="twitter:image"]', 'content', image);
      setMeta('meta[name="theme-color"]', 'content', shop.primary_color || '#0d0a07');
      const canonical = document.getElementById('canonical-link');
      if (canonical) canonical.href = cleanUrl;

      const priceRange = shop.currency_default || 'SYP';
      const menuSections = categories
        .map(c => {
          const menuItems = items
            .filter(i => i.category_id === c.id)
            .map(i => {
              const p = (i.item_prices || []).find(p => p.is_visible && p.price > 0) || (i.item_prices || [])[0];
              const itemName = lang === 'ar' ? (i.name_ar || i.name) : i.name;
              const itemDesc = lang === 'ar' ? (i.description_ar || i.description) : i.description;
              const offer = (p && p.price > 0)
                ? { '@type': 'Offer', price: Number(p.price).toFixed(2), priceCurrency: p.currency || priceRange, availability: i.is_available ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock' }
                : null;
              const node = { '@type': 'MenuItem', name: itemName };
              if (i.image_url) node.image = i.image_url;
              if (itemDesc) node.description = itemDesc;
              if (offer) node.offers = offer;
              return node;
            });
          return { '@type': 'MenuSection', name: lang === 'ar' ? (c.name_ar || c.name) : c.name, hasMenuItem: menuItems };
        })
        .filter(s => s.hasMenuItem.length);

      const restaurant = {
        '@context': 'https://schema.org',
        '@type': 'Restaurant',
        name,
        url: cleanUrl
      };
      if (image) restaurant.image = image;
      if (shop.phone) restaurant.telephone = shop.phone;
      else if (shop.whatsapp) restaurant.telephone = `+${shop.whatsapp}`;
      if (shop.address) restaurant.address = { '@type': 'PostalAddress', streetAddress: lang === 'ar' ? (shop.address_ar || shop.address) : shop.address };
      restaurant.priceRange = priceRange;
      if (menuSections.length) restaurant.hasMenu = { '@type': 'Menu', hasMenuSection: menuSections };

      const ld = document.getElementById('ld-json');
      if (ld) ld.textContent = JSON.stringify(restaurant);
    }

    function renderHeader() {
      const h = document.getElementById('hero-inner');
      const logo = shop.logo_url ? `<img class="logo" src="${esc(shop.logo_url)}" alt="${esc(shop.name)}">` : '';
      const name = lang === 'ar' ? (shop.name_ar || shop.name) : shop.name;
      const tagline = lang === 'ar' ? (shop.tagline_ar || shop.tagline) : shop.tagline;
      const contactParts = [];
      if (shop.whatsapp) contactParts.push(`<a href="https://wa.me/${esc(shop.whatsapp)}"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>`);
      if (shop.phone) contactParts.push(`<span><i class="fa-solid fa-phone"></i> ${esc(shop.phone)}</span>`);
      if (shop.email) contactParts.push(`<a href="mailto:${esc(shop.email)}"><i class="fa-solid fa-envelope"></i> ${esc(shop.email)}</a>`);

      h.innerHTML = `
        ${logo}
        <h1>${esc(name)}</h1>
        ${tagline ? `<p class="tagline">${esc(tagline)}</p>` : ''}
        ${contactParts.length ? `<div class="contact-row">${contactParts.join('')}</div>` : ''}
      `;
      document.getElementById('shop-header').style.display = 'block';
    }

    function renderCategories() {
      const wrap = document.getElementById('rail-wrap');
      if (categories.length === 0) { wrap.style.display = 'none'; return; }
      wrap.style.display = 'block';
      const allLabel = lang === 'ar' ? 'الكل' : 'All';
      document.getElementById('cat-tabs').innerHTML =
        `<button class="cat-tab ${activeCategory === null ? 'active' : ''}" onclick="setCategory(null)">${allLabel}</button>` +
        categories.map(c => {
          const name = lang === 'ar' ? (c.name_ar || c.name) : c.name;
          return `<button class="cat-tab ${activeCategory === c.id ? 'active' : ''}" onclick="setCategory('${c.id}')">${esc(name)}</button>`;
        }).join('');
    }

    // Category hero banner — image, name, description, item count (P1.7)
    function renderCatHero() {
      const hero = document.getElementById('cat-hero');
      const cat = activeCategory ? categories.find(c => c.id === activeCategory) : null;
      if (!cat) { hero.style.display = 'none'; return; }
      const name = lang === 'ar' ? (cat.name_ar || cat.name) : cat.name;
      const desc = lang === 'ar' ? (cat.description_ar || cat.description) : cat.description;
      const count = items.filter(i => i.category_id === cat.id).length;
      const countLabel = lang === 'ar' ? `عدد الأصناف · ${count}` : `${count} items`;
      const bg = cat.image_url ? `<img class="cat-hero-bg" src="${esc(cat.image_url)}" alt="" loading="lazy">` : '';
      hero.style.display = 'block';
      hero.innerHTML = `
        ${bg}
        <div class="cat-hero-inner">
          <span class="cat-hero-eyebrow">${countLabel}</span>
          <h2>${esc(name)}</h2>
          ${desc ? `<p>${esc(desc)}</p>` : ''}
        </div>`;
    }

    // Localized summary of an offer for the customer-facing card
    function dealSummary(d) {
      const c = d.currency || shop.currency_default || 'SYP';
      const ar = lang === 'ar';
      const dt = d.deal_type || d.discount_type || 'percent';
      switch (dt) {
        case 'percent': return ar ? `خصم ${d.discount_value}%` : `${d.discount_value}% OFF`;
        case 'fixed':   return ar ? `خصم ${d.discount_value} ${c}` : `${d.discount_value} ${c} OFF`;
        case 'bogo':    return ar ? `اشترِ ${d.buy_qty || 1} واحصل على ${d.get_qty || 1} مجاناً` : `BUY ${d.buy_qty || 1} GET ${d.get_qty || 1} FREE`;
        case 'bundle':  return ar ? `باقة ${(d.bundle_items || []).length} أصناف بـ ${d.bundle_price} ${c}` : `COMBO ${(d.bundle_items || []).length} items for ${d.bundle_price} ${c}`;
        case 'min_order': return ar
          ? (d.reward_type === 'percent' ? `أنفق ${d.min_total} واحصل على خصم ${d.discount_value}%` : `أنفق ${d.min_total} واحصل على خصم ${d.discount_value} ${c}`)
          : (d.reward_type === 'percent' ? `Spend ${d.min_total} get ${d.discount_value}% off` : `Spend ${d.min_total} get ${d.discount_value} ${c} off`);
        default: return ar ? 'خصم' : 'OFF';
      }
    }

    // Item promotional badges (P1.3) — New / Popular / Chef's Choice; '' when none

    // ─── INSTANT SEARCH OVERLAY (P1.8) ─────────────────────
    // Fuzzy keyword search across name / name_ar / description / description_ar,
    // results grouped by category. No AI and no voice in v1 (plan: P1.8).
    function openSearch() {
      const input = document.getElementById('search-input');
      input.placeholder = lang === 'ar' ? 'ابحث عن طبق أو مشروب…' : 'Search dishes or drinks…';
      input.setAttribute('aria-label', lang === 'ar' ? 'بحث' : 'Search');
      const mic = document.getElementById('voice-btn');
      if (mic) {
        mic.setAttribute('aria-label', lang === 'ar' ? 'بحث صوتي' : 'Voice search');
        mic.setAttribute('title', lang === 'ar' ? 'بحث صوتي' : 'Voice search');
      }
      searchRender(input.value);
      document.getElementById('search-modal').classList.add('visible');
      setTimeout(() => input.focus(), 60);
    }
    function closeSearch() {
      document.getElementById('search-modal').classList.remove('visible');
      document.getElementById('search-input').value = '';
    }
    // Normalize for matching: lowercase, drop Arabic diacritics/tatweel, fold alef/teh/yeh forms
    function normSearch(s) {
      return (s || '').toLowerCase()
        .replace(/[\u064B-\u0652\u0640]/g, '')
        .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
        .trim();
    }
    function searchRender(q) {
      const body = document.getElementById('search-body');
      const qn = normSearch(q);
      const groups = categories
        .map(c => ({ c, found: items.filter(i => i.category_id === c.id && (
          !qn ||
          normSearch(i.name).includes(qn) || normSearch(i.name_ar).includes(qn) ||
          normSearch(i.description).includes(qn) || normSearch(i.description_ar).includes(qn)
        )) }))
        .filter(g => g.found.length > 0);
      if (!qn) {
        body.innerHTML = `<div class="sr-empty"><span style="display:block;font-size:30px;margin-bottom:8px"><i class="fa-solid fa-magnifying-glass"></i></span>${lang === 'ar' ? 'ابدأ الكتابة للبحث في القائمة…' : 'Start typing to search the menu…'}</div>`;
        return;
      }
      if (groups.length === 0) {
        body.innerHTML = `<div class="sr-empty"><span style="display:block;font-size:30px;margin-bottom:8px"><i class="fa-solid fa-magnifying-glass"></i></span>${lang === 'ar' ? `لا توجد نتائج لـ «${esc(q)}»` : `No results for “${esc(q)}”`}</div>`;
        return;
      }
      body.innerHTML = groups.map(g => {
        const cname = lang === 'ar' ? (g.c.name_ar || g.c.name) : g.c.name;
        return `<div class="search-group"><div class="search-group-title">${esc(cname)}</div>${g.found.map(searchRowHTML).join('')}</div>`;
      }).join('');
    }
    function searchRowHTML(item) {
      const name = lang === 'ar' ? (item.name_ar || item.name) : item.name;
      const sub = lang === 'ar' ? (item.name || '') : (item.name_ar || '');
      const price = cardPriceHTML(item);
      const img = item.image_url
        ? `<img class="sr-media" src="${esc(item.image_url)}" alt="" loading="lazy">`
        : `<div class="sr-media ph">${emojiFor(item)}</div>`;
      const chips = badgeChipsHTML(item);
      return `<button class="search-row" onclick="openProductSheet('${item.id}'); closeSearch()">
        ${img}
        <div class="sr-info">
          <div class="sr-name">${esc(name)}${chips}</div>
          ${sub ? `<div class="sr-sub">${esc(sub)}</div>` : ''}
        </div>
        <span class="sr-price">${price}</span>
      </button>`;
    }

    // ─── SIMILAR PRODUCTS (P2.3) ──────────────────────────
    // Horizontal rail inside the product sheet: other items in the same category.
    function similarHTML(item) {
      const others = items.filter(i => i.category_id === item.category_id && i.id !== item.id).slice(0, 10);
      if (!others.length) return '';
      const heading = lang === 'ar' ? 'مشابهة' : 'Similar';
      const cards = others.map(it => {
        const name = lang === 'ar' ? (it.name_ar || it.name) : it.name;
        const thumb = it.image_url
          ? `<img class="fav-thumb" src="${esc(it.image_url)}" alt="" loading="lazy">`
          : `<div class="fav-thumb">${emojiFor(it)}</div>`;
        return `<button class="fav-card" onclick="openProductSheet('${it.id}')">
          ${thumb}
          <span class="fav-name">${esc(name)}</span>
          <span class="fav-price">${cardPriceHTML(it)}</span>
        </button>`;
      }).join('');
      return `<div class="similar-sec"><div class="similar-head">${heading}</div><div class="similar-track">${cards}</div></div>`;
    }

    // ─── VOICE SEARCH (P2.2) ─────────────────────────────
    // Thin Web Speech API wrapper on the P1.8 search overlay; mic hidden when
    // the browser has no SpeechRecognition. Results land in the normal search box.
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null, recActive = false;
    function initVoice() {
      const mic = document.getElementById('voice-btn');
      if (!mic) return;
      mic.style.display = SR ? '' : 'none';
    }
    function toggleVoice() {
      if (!SR) { toast(lang === 'ar' ? 'متصفحك لا يدعم الإدخال الصوتي' : 'Voice input is not supported in this browser'); return; }
      if (recActive) { stopVoice(); return; }
      try {
        rec = new SR();
        rec.lang = lang === 'ar' ? 'ar-SA' : 'en-US';
        rec.interimResults = false;
        rec.maxAlternatives = 1;
        rec.onstart = () => {
          recActive = true;
          document.getElementById('voice-btn').classList.add('recording');
          toast(lang === 'ar' ? '🎤 استمع الآن…' : '🎤 Listening…');
        };
        rec.onresult = e => {
          const t = e.results[0][0].transcript;
          const input = document.getElementById('search-input');
          input.value = t;
          searchRender(t);
        };
        rec.onend = () => { recActive = false; document.getElementById('voice-btn').classList.remove('recording'); };
        rec.onerror = e => {
          recActive = false;
          document.getElementById('voice-btn').classList.remove('recording');
          toast(voiceErrMsg(e.error));
        };
        rec.start();
      } catch (err) {
        recActive = false;
        document.getElementById('voice-btn').classList.remove('recording');
        toast(lang === 'ar' ? 'تعذر بدء الإدخال الصوتي' : 'Could not start voice input');
      }
    }
    function stopVoice() {
      try { if (rec) rec.stop(); } catch (e) {}
      recActive = false;
      const mic = document.getElementById('voice-btn');
      if (mic) mic.classList.remove('recording');
    }
    function voiceErrMsg(code) {
      const ar = lang === 'ar';
      if (code === 'not-allowed' || code === 'service-not-allowed') return ar ? 'لا يمكن الوصول للميكروفون — امنح الإذن للموقع' : 'Microphone blocked — allow access in the browser';
      if (code === 'no-speech') return ar ? 'لم يُسمع كلام — حاول مجدداً' : 'No speech heard — try again';
      if (code === 'audio-capture') return ar ? 'لا يوجد ميكروفون متاح' : 'No microphone available';
      if (code === 'network') return ar ? 'تعذر الوصول لخدمة التعرف الصوتي' : 'Speech service unreachable';
      return ar ? 'تعذر التعرف على الصوت' : 'Speech recognition failed';
    }

    // ─── INFO MODAL (P1.9) ─────────────────────────────────
    // About, opening hours (rendered when shops.hours jsonb exists — populated in
    // P1.11), address + Google Maps directions, phone (tel:), socials, legal note.
    function openInfo() { renderInfo(); document.getElementById('info-modal').classList.add('visible'); }
    function closeInfo() { document.getElementById('info-modal').classList.remove('visible'); }
    // P1.11 — is the shop open right now? null = no hours configured.
    //   Weekdays Mon=0..Sun=6. A day with open>close runs overnight into the
    //   next day (e.g. Fri 09:00–02:00). Early-morning hours (before today's open)
    //   are only covered by YESTERDAY's overnight window.
    function isNowOpen() {
      if (!shop || !Array.isArray(shop.hours)) return null;
      const now = new Date();
      const dayIdx = (now.getDay() + 6) % 7;
      const cur = now.getHours() * 60 + now.getMinutes();
      const mm = s => { const [h, m] = (s || '').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
      const entry = shop.hours[dayIdx];
      if (entry && entry.open && entry.close) {
        const o = mm(entry.open), c = mm(entry.close);
        if (o < c) return cur >= o && cur < c;
        if (o === c) return false;             // open == close => closed
        if (cur >= o) return true;             // overnight: open from today's open past midnight
      }
      // not covered by today's hours: yesterday's overnight window may still cover early morning
      const prev = shop.hours[(dayIdx + 6) % 7];
      if (prev && prev.open && prev.close) {
        const o = mm(prev.open), c = mm(prev.close);
        if (o > c && cur < c) return true;
      }
      return false;
    }
    function infoHoursHTML() {
      if (!shop || !Array.isArray(shop.hours)) return '';
      const days = shop.hours;
      const labels = lang === 'ar'
        ? ['الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت', 'الأحد']
        : ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
      const rows = labels.map((d, i) => {
        const h = days[i] || {};
        const hrs = h.open && h.close ? `${h.open} – ${h.close}` : (lang === 'ar' ? 'مغلق' : 'Closed');
        return `<div class="info-row"><span class="dow">${d}</span><span class="hrs">${esc(hrs)}</span></div>`;
      }).join('');
      const open = isNowOpen();
      const chip = open === null ? ''
        : `<span class="info-openchip ${open ? 'open' : 'closed'}">${open ? '🟢 ' + (lang === 'ar' ? 'مفتوح الآن' : 'Open now') : '🔴 ' + (lang === 'ar' ? 'مغلق الآن' : 'Closed now')}</span>`;
      return `<div class="info-section"><div class="info-label">${lang === 'ar' ? 'ساعات العمل' : 'Opening Hours'} ${chip}</div>${rows}</div>`;

    function pdQty(delta) {

    function pdCommit() {

      if (note) cartNotes[id] = note; else delete cartNotes[id];
      if (itemHasVariants(item)) selectedVariants[id] = sheetVariant;
      if (sheetQty <= 0) { delete cart[id]; delete cartNotes[id]; delete selectedVariants[id]; }
      else cart[id] = Math.min(sheetQty, 99);

      renderItems(); updateCartBar();
      toast(sheetQty > 0
        ? (lang === 'ar' ? 'تم تحديث الطلب' : 'Order updated')

    // Cart
    function incCart(id) {

      renderItems(); updateCartBar(); if (document.getElementById('order-modal')?.classList.contains('visible')) renderOrderSheet();

    function setCartQty(id, val) {
