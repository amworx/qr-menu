<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QR Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --primary:#D97706;--accent:#92400E;
      --bg:#fafaf9;--card:#ffffff;--text:#1c1917;--text2:#78716c;--text3:#a8a29e;
      --border:#e7e5e4;--radius:12px;
      --font-en:'Inter',system-ui,sans-serif;
      --font-ar:'Noto Kufi Arabic',system-ui,sans-serif;
    }
    [lang="ar"]{--font-en:'Noto Kufi Arabic',system-ui,sans-serif}
    body{font-family:var(--font-en);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px}
    body[dir="rtl"]{font-family:var(--font-ar)}

    /* Loading */
    .loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:12px}
    .loading-screen .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
    .loading-screen p{color:var(--text2);font-size:14px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Header */
    .shop-header{text-align:center;padding:32px 16px 20px;background:var(--card);border-bottom:1px solid var(--border)}
    .shop-header .logo{width:64px;height:64px;border-radius:50%;object-fit:cover;margin-bottom:12px;border:3px solid var(--primary)}
    .shop-header h1{font-size:22px;font-weight:700;margin-bottom:4px}
    .shop-header .tagline{color:var(--text2);font-size:14px}
    .shop-header .contact-row{display:flex;justify-content:center;gap:16px;margin-top:12px;font-size:13px;color:var(--text2)}
    .shop-header .contact-row a{color:var(--primary);text-decoration:none;font-weight:500}

    /* Language toggle */
    .lang-toggle{position:fixed;top:12px;right:12px;z-index:50;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text)}

    /* Currency selector */
    .currency-bar{display:flex;justify-content:center;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
    .currency-btn{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:var(--bg);font-size:12px;font-weight:600;cursor:pointer;color:var(--text2);transition:.15s}
    .currency-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

    /* Categories */
    .cat-tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .cat-tabs::-webkit-scrollbar{display:none}
    .cat-tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;color:var(--text2);transition:.15s}
    .cat-tab.active{background:var(--text);color:#fff;border-color:var(--text)}

    /* Items */
    .items-grid{padding:8px 16px;display:flex;flex-direction:column;gap:12px}
    .item-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;gap:12px;align-items:flex-start;transition:.15s}
    .item-card:active{transform:scale(.98)}
    .item-img{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--bg);flex-shrink:0}
    .item-info{flex:1;min-width:0}
    .item-name{font-size:15px;font-weight:600;margin-bottom:2px}
    .item-name-ar{font-size:13px;color:var(--text2);margin-bottom:4px}
    .item-desc{font-size:12px;color:var(--text2);margin-bottom:6px;line-height:1.4}
    .item-price{font-size:16px;font-weight:700;color:var(--primary)}
    .item-price .old-price{text-decoration:line-through;color:var(--text3);font-size:12px;font-weight:400;margin-right:6px}
    .item-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600;background:var(--primary);color:#fff;margin-bottom:4px}
    .item-unavailable{opacity:.5;pointer-events:none}
    .item-add{width:32px;height:32px;border-radius:50%;border:2px solid var(--primary);background:transparent;color:var(--primary);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
    .item-add:hover{background:var(--primary);color:#fff}

    /* Cart */
    .cart-bar{position:fixed;bottom:0;left:0;right:0;background:var(--primary);color:#fff;padding:12px 16px;display:none;align-items:center;justify-content:space-between;z-index:50;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
    .cart-bar.visible{display:flex}
    .cart-count{font-size:14px;font-weight:600}
    .cart-total{font-size:16px;font-weight:700}
    .cart-btn{padding:10px 20px;border:none;border-radius:8px;background:#fff;color:var(--primary);font-size:14px;font-weight:700;cursor:pointer}
    .cart-btn:disabled{opacity:.5}

    /* Footer */
    .shop-footer{text-align:center;padding:20px 16px;color:var(--text3);font-size:12px;border-top:1px solid var(--border);margin-top:24px}

    /* Deals banner */
    .deals-banner{margin:8px 16px;padding:12px 16px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:var(--radius);color:#fff}
    .deals-banner h3{font-size:14px;font-weight:700;margin-bottom:4px}
    .deals-banner p{font-size:12px;opacity:.9}

    /* Empty */
    .empty-msg{text-align:center;padding:40px 16px;color:var(--text3);font-size:14px}

    /* WhatsApp order modal */
    .order-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
    .order-modal.visible{display:flex}
    .order-sheet{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;padding:20px}
    .order-sheet h3{font-size:18px;font-weight:700;margin-bottom:12px}
    .order-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
    .order-item .qty{display:flex;align-items:center;gap:8px}
    .order-item .qty button{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--bg);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .order-total-row{display:flex;justify-content:space-between;padding:12px 0;font-size:16px;font-weight:700;border-top:2px solid var(--text)}
    .order-whatsapp{width:100%;margin-top:12px;padding:14px;border:none;border-radius:10px;background:#25D366;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    .order-whatsapp:disabled{opacity:.5}
    .order-note{width:100%;margin-top:8px;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:13px;resize:none;min-height:60px;font-family:inherit}
  </style>
</head>
<body>
  <!-- Loading -->
  <div class="loading-screen" id="loading">
    <div class="spinner"></div>
    <p>Loading menu...</p>
  </div>

  <!-- Language toggle -->
  <button class="lang-toggle" id="lang-btn" onclick="toggleLang()">AR</button>

  <!-- Shop header (injected) -->
  <div class="shop-header" id="shop-header" style="display:none"></div>

  <!-- Currency selector (injected) -->
  <div class="currency-bar" id="currency-bar" style="display:none"></div>

  <!-- Category tabs (injected) -->
  <div class="cat-tabs" id="cat-tabs" style="display:none"></div>

  <!-- Deals (injected) -->
  <div id="deals-section"></div>

  <!-- Items grid (injected) -->
  <div class="items-grid" id="items-grid" style="display:none"></div>

  <!-- Cart bar -->
  <div class="cart-bar" id="cart-bar">
    <div>
      <div class="cart-count" id="cart-count">0 items</div>
      <div class="cart-total" id="cart-total">0</div>
    </div>
    <button class="cart-btn" onclick="openOrderSheet()">Review Order</button>
  </div>

  <!-- Order review modal -->
  <div class="order-modal" id="order-modal" onclick="if(event.target===this)closeOrderSheet()">
    <div class="order-sheet" id="order-sheet"></div>
  </div>

  <!-- Footer (injected) -->
  <div class="shop-footer" id="shop-footer" style="display:none"></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ─── STATE ──────────────────────────────────────────────
    let shop = null;
    let categories = [];
    let items = [];
    let deals = [];
    let lang = 'en';
    let activeCurrency = 'SYP';
    let activeCategory = null;
    let cart = {}; // { itemId: qty }

    // ─── INIT ───────────────────────────────────────────────
    (async () => {
      // Detect language from browser or hash
      const hash = window.location.hash.replace('#', '');
      if (hash === 'ar' || hash === 'en') {
        lang = hash;
      } else {
        lang = navigator.language.startsWith('ar') ? 'ar' : 'en';
      }

      // Load shop (first active shop, or by slug in URL)
      const slug = new URLSearchParams(window.location.search).get('shop');
      let query = sb.from('shops').select('*').eq('is_active', true);
      if (slug) query = query.eq('slug', slug);
      const { data: shops } = await query.limit(1);

      if (!shops || shops.length === 0) {
        document.getElementById('loading').innerHTML = '<p style="color:var(--text2)">No shop found.</p>';
        return;
      }
      shop = shops[0];
      activeCurrency = shop.currency_default || 'SYP';

      // Load categories
      const { data: cats } = await sb.from('categories').select('*').eq('shop_id', shop.id).eq('is_active', true).order('sort_order');
      categories = cats || [];

      // Load items with prices
      const { data: its } = await sb.from('items').select('*, item_prices(*)').eq('shop_id', shop.id).eq('is_available', true).order('sort_order');
      items = (its || []).filter(i => {
        // Only show items that have at least one visible price
        return (i.item_prices || []).some(p => p.is_visible);
      });

      // Load active deals
      const now = new Date().toISOString();
      const { data: dls } = await sb.from('deals').select('*').eq('shop_id', shop.id).eq('is_active', true)
        .or(`starts_at.is.null,starts_at.lte.${now}`)
        .or(`ends_at.is.null,ends_at.gte.${now}`)
        .order('sort_order');
      deals = dls || [];

      // Apply theme colors
      document.documentElement.style.setProperty('--primary', shop.primary_color || '#D97706');
      document.documentElement.style.setProperty('--accent', shop.accent_color || '#92400E');

      render();
      document.getElementById('loading').style.display = 'none';
    })();

    // ─── RENDER ─────────────────────────────────────────────
    function render() {
      applyLang();
      renderHeader();
      renderCurrencyBar();
      renderCategories();
      renderDeals();
      renderItems();
      renderFooter();
    }

    function applyLang() {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('lang-btn').textContent = lang === 'en' ? 'AR' : 'EN';
      document.title = lang === 'ar' ? (shop.name_ar || shop.name) : shop.name;
    }

    function renderHeader() {
      const h = document.getElementById('shop-header');
      h.style.display = 'block';
      const logo = shop.logo_url ? `<img class="logo" src="${esc(shop.logo_url)}" alt="${esc(shop.name)}">` : '';
      const name = lang === 'ar' ? (shop.name_ar || shop.name) : shop.name;
      const tagline = lang === 'ar' ? (shop.tagline_ar || shop.tagline) : shop.tagline;
      const contactParts = [];
      if (shop.whatsapp) contactParts.push(`<a href="https://wa.me/${esc(shop.whatsapp)}">WhatsApp</a>`);
      if (shop.phone) contactParts.push(`<span>${esc(shop.phone)}</span>`);
      if (shop.email) contactParts.push(`<a href="mailto:${esc(shop.email)}">${esc(shop.email)}</a>`);
      h.innerHTML = `
        ${logo}
        <h1>${esc(name)}</h1>
        ${tagline ? `<p class="tagline">${esc(tagline)}</p>` : ''}
        ${contactParts.length ? `<div class="contact-row">${contactParts.join('')}</div>` : ''}
      `;
    }

    function renderCurrencyBar() {
      const bar = document.getElementById('currency-bar');
      const currencies = shop.currencies || ['SYP'];
      if (currencies.length <= 1 && !shop.show_currency_selector) {
        bar.style.display = 'none';
        return;
      }
      bar.style.display = 'flex';
      bar.innerHTML = currencies.map(c =>
        `<button class="currency-btn ${c === activeCurrency ? 'active' : ''}" onclick="setCurrency('${c}')">${c}</button>`
      ).join('');
    }

    function renderCategories() {
      const tabs = document.getElementById('cat-tabs');
      if (categories.length === 0) { tabs.style.display = 'none'; return; }
      tabs.style.display = 'flex';
      const allLabel = lang === 'ar' ? 'الكل' : 'All';
      tabs.innerHTML = `<button class="cat-tab ${activeCategory === null ? 'active' : ''}" onclick="setCategory(null)">${allLabel}</button>` +
        categories.map(c => {
          const name = lang === 'ar' ? (c.name_ar || c.name) : c.name;
          return `<button class="cat-tab ${activeCategory === c.id ? 'active' : ''}" onclick="setCategory('${c.id}')">${esc(name)}</button>`;
        }).join('');
    }

    function renderDeals() {
      const sec = document.getElementById('deals-section');
      if (deals.length === 0) { sec.innerHTML = ''; return; }
      sec.innerHTML = deals.map(d => {
        const title = lang === 'ar' ? (d.title_ar || d.title) : d.title;
        const desc = lang === 'ar' ? (d.description_ar || d.description) : d.description;
        const discount = d.discount_type === 'percent' ? `${d.discount_value}% OFF` : `${d.discount_value} ${d.currency} OFF`;
        return `<div class="deals-banner"><h3>🔥 ${esc(title)} — ${discount}</h3>${desc ? `<p>${esc(desc)}</p>` : ''}</div>`;
      }).join('');
    }

    function renderItems() {
      const grid = document.getElementById('items-grid');
      const filtered = activeCategory ? items.filter(i => i.category_id === activeCategory) : items;
      if (filtered.length === 0) {
        grid.style.display = 'block';
        grid.innerHTML = `<div class="empty-msg">${lang === 'ar' ? 'لا عناصر بعد' : 'No items yet'}</div>`;
        return;
      }
      grid.style.display = 'flex';
      grid.innerHTML = filtered.map(item => {
        const name = lang === 'ar' ? (item.name_ar || item.name) : item.name;
        const desc = lang === 'ar' ? (item.description_ar || item.description) : item.description;
        const priceObj = (item.item_prices || []).find(p => p.currency === activeCurrency && p.is_visible);
        const price = priceObj ? formatPrice(priceObj.price, activeCurrency) : '';
        const img = item.image_url ? `<img class="item-img" src="${esc(item.image_url)}" alt="">` : '';
        const badge = item.is_featured ? `<span class="item-badge">${lang === 'ar' ? 'مميز' : 'Featured'}</span>` : '';
        const inCart = cart[item.id] || 0;
        return `
          <div class="item-card">
            ${img}
            <div class="item-info">
              ${badge}
              <div class="item-name">${esc(name)}</div>
              ${desc ? `<div class="item-desc">${esc(desc)}</div>` : ''}
              ${price ? `<div class="item-price">${price}</div>` : ''}
            </div>
            <button class="item-add" onclick="addToCart('${item.id}')" title="Add">+</button>
          </div>
        `;
      }).join('');
    }

    function renderFooter() {
      const f = document.getElementById('shop-footer');
      f.style.display = 'block';
      const text = lang === 'ar' ? (shop.footer_text_ar || shop.footer_text || '') : (shop.footer_text || '');
      f.textContent = text || `© ${new Date().getFullYear()} ${shop.name}`;
    }

    // ─── ACTIONS ────────────────────────────────────────────
    function toggleLang() {
      lang = lang === 'en' ? 'ar' : 'en';
      window.location.hash = lang;
      render();
    }

    function setCurrency(c) {
      activeCurrency = c;
      renderCurrencyBar();
      renderItems();
    }

    function setCategory(id) {
      activeCategory = id;
      renderCategories();
      renderItems();
    }

    function addToCart(itemId) {
      cart[itemId] = (cart[itemId] || 0) + 1;
      updateCartBar();
    }

    function removeFromCart(itemId) {
      if (cart[itemId]) {
        cart[itemId]--;
        if (cart[itemId] <= 0) delete cart[itemId];
      }
      updateCartBar();
      renderOrderSheet();
    }

    function updateCartBar() {
      const bar = document.getElementById('cart-bar');
      const totalItems = Object.values(cart).reduce((s, q) => s + q, 0);
      if (totalItems === 0) {
        bar.classList.remove('visible');
        return;
      }
      bar.classList.add('visible');
      document.getElementById('cart-count').textContent = `${totalItems} ${lang === 'ar' ? 'عناصر' : 'items'}`;
      const total = Object.entries(cart).reduce((sum, [id, qty]) => {
        const item = items.find(i => i.id === id);
        const priceObj = (item?.item_prices || []).find(p => p.currency === activeCurrency && p.is_visible);
        return sum + (priceObj ? priceObj.price * qty : 0);
      }, 0);
      document.getElementById('cart-total').textContent = formatPrice(total, activeCurrency);
    }

    function openOrderSheet() {
      document.getElementById('order-modal').classList.add('visible');
      renderOrderSheet();
    }

    function closeOrderSheet() {
      document.getElementById('order-modal').classList.remove('visible');
    }

    function renderOrderSheet() {
      const sheet = document.getElementById('order-sheet');
      const totalItems = Object.values(cart).reduce((s, q) => s + q, 0);
      if (totalItems === 0) {
        sheet.innerHTML = `<h3>${lang === 'ar' ? 'سلة فارغة' : 'Cart is empty'}</h3><p style="color:var(--text2);margin-top:8px">${lang === 'ar' ? 'أضف عناصر من القائمة' : 'Add items from the menu'}</p>`;
        return;
      }

      let rows = '';
      let total = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const item = items.find(i => i.id === id);
        if (!item) continue;
        const name = lang === 'ar' ? (item.name_ar || item.name) : item.name;
        const priceObj = (item.item_prices || []).find(p => p.currency === activeCurrency && p.is_visible);
        const unitPrice = priceObj ? priceObj.price : 0;
        const lineTotal = unitPrice * qty;
        total += lineTotal;
        rows += `
          <div class="order-item">
            <span>${esc(name)} × ${qty}</span>
            <div class="qty">
              <span>${formatPrice(lineTotal, activeCurrency)}</span>
              <button onclick="removeFromCart('${id}')">−</button>
            </div>
          </div>
        `;
      }

      const noteLabel = lang === 'ar' ? 'ملاحظات الطلب (اختياري)' : 'Order notes (optional)';
      const waLabel = lang === 'ar' ? 'إرسال عبر واتساب' : 'Send via WhatsApp';
      const totalLabel = lang === 'ar' ? 'المجموع' : 'Total';

      sheet.innerHTML = `
        <h3>${lang === 'ar' ? 'مراجعة الطلب' : 'Review Order'}</h3>
        ${rows}
        <div class="order-total-row"><span>${totalLabel}</span><span>${formatPrice(total, activeCurrency)}</span></div>
        <textarea class="order-note" id="order-note" placeholder="${noteLabel}"></textarea>
        <button class="order-whatsapp" onclick="sendWhatsApp()">${waLabel}</button>
      `;
    }

    function sendWhatsApp() {
      const totalItems = Object.values(cart).reduce((s, q) => s + q, 0);
      if (totalItems === 0) return;

      const lines = [];
      lines.push(lang === 'ar' ? `*طلب جديد — ${shop.name}*` : `*New Order — ${shop.name}*`);
      lines.push('');

      let total = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const item = items.find(i => i.id === id);
        if (!item) continue;
        const name = lang === 'ar' ? (item.name_ar || item.name) : item.name;
        const priceObj = (item.item_prices || []).find(p => p.currency === activeCurrency && p.is_visible);
        const unitPrice = priceObj ? priceObj.price : 0;
        const lineTotal = unitPrice * qty;
        total += lineTotal;
        lines.push(`• ${name} × ${qty} — ${formatPrice(lineTotal, activeCurrency)}`);
      }

      lines.push('');
      lines.push(`${lang === 'ar' ? 'المجموع' : 'Total'}: *${formatPrice(total, activeCurrency)}*`);

      const note = document.getElementById('order-note')?.value?.trim();
      if (note) {
        lines.push('');
        lines.push(`${lang === 'ar' ? 'ملاحظات' : 'Notes'}: ${note}`);
      }

      const msg = encodeURIComponent(lines.join('\n'));
      const phone = shop.whatsapp?.replace(/[^0-9]/g, '') || '';
      const url = phone ? `https://wa.me/${phone}?text=${msg}` : `https://wa.me/?text=${msg}`;
      window.open(url, '_blank');
    }

    // ─── HELPERS ────────────────────────────────────────────
    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function formatPrice(amount, currency) {
      const formatted = new Intl.NumberFormat(lang === 'ar' ? 'ar-SY' : 'en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(amount);
      return `${formatted} ${currency}`;
    }
  </script>
</body>
</html>
